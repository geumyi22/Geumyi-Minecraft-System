    description: Geumyi Discord Status / GSC Bridge management command
    usage: /gds
    permission: geumyidiscordstatus.use
permissions:
  geumyidiscordstatus.use:
    default: op
  geumyidiscordstatus.admin:
    default: op
  geumyidiscordstatus.announce:
    default: op
