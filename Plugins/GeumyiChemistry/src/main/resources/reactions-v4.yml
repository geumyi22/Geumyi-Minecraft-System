    lab: ACID_BASE
    temperature: ROOM
    inputs: CaO=1,H2O=1
    outputs: CaOH2=1
  sodium_chloride:
    name: 염화나트륨 생성
    lab: GENERAL
    temperature: HEATED
    inputs: Na=2,Cl2=1
    outputs: NaCl=2
  potassium_iodide:
    name: 아이오딘화칼륨 생성
