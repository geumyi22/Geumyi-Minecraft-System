# GeumyiChemistry v0.4.0
# lab: GENERAL | SOLUTION | GAS | PRECIPITATION | ACID_BASE | REDOX | ELECTROLYSIS | THERMAL
# temperature: ROOM | HEATED
# pressure: NORMAL | HIGH (optional, default NORMAL)
# catalyst: chemistry ID (optional, placed in catalyst slot and not consumed)
# inputs/outputs use chemistry IDs and integer stoichiometric amounts.
reactions:
  hydrogen_gas:
    name: 수소 기체 생성
    lab: GAS
    temperature: ROOM
    inputs: H=2
    outputs: H2=1
  hydrogen_atomization:
    name: 수소 분자 분해
    lab: GENERAL
    temperature: HEATED
    inputs: H2=1
    outputs: H=2
  oxygen_gas:
    name: 산소 기체 생성
    lab: GAS
    temperature: ROOM
    inputs: O=2
    outputs: O2=1
  oxygen_atomization:
    name: 산소 분자 분해
    lab: GENERAL
    temperature: HEATED
    inputs: O2=1
    outputs: O=2
  nitrogen_gas:
    name: 질소 기체 생성
    lab: GAS
    temperature: ROOM
    inputs: N=2
    outputs: N2=1
  nitrogen_atomization:
    name: 질소 분자 분해
    lab: GENERAL
    temperature: HEATED
    inputs: N2=1
    outputs: N=2
  chlorine_gas:
    name: 염소 기체 생성
    lab: GAS
    temperature: ROOM
    inputs: Cl=2
    outputs: Cl2=1
  chlorine_atomization:
    name: 염소 분자 분해
    lab: GENERAL
    temperature: HEATED
    inputs: Cl2=1
    outputs: Cl=2
  iodine_molecule:
    name: 아이오딘 분자 생성
    lab: GENERAL
    temperature: ROOM
    inputs: I=2
    outputs: I2=1
  iodine_atomization:
    name: 아이오딘 분자 분해
    lab: GENERAL
    temperature: HEATED
    inputs: I2=1
    outputs: I=2
  water_synthesis:
    name: 물 합성
    lab: GAS
    temperature: HEATED
    inputs: H2=2,O2=1
    outputs: H2O=2
  water_electrolysis:
    name: 물 전기분해
    lab: ELECTROLYSIS
    temperature: ROOM
    inputs: H2O=2
    outputs: H2=2,O2=1
    note: 수소와 산소 기체가 생성됨
  carbon_dioxide:
    name: 이산화탄소 생성
    lab: GAS
    temperature: HEATED
    inputs: C=1,O2=1
    outputs: CO2=1
  carbon_monoxide:
    name: 일산화탄소 생성
    lab: GAS
    temperature: HEATED
    inputs: C=2,O2=1
    outputs: CO=2
  carbon_monoxide_oxidation:
    name: 일산화탄소 산화
    lab: GAS
    temperature: HEATED
    catalyst: Pt
    inputs: CO=2,O2=1
    outputs: CO2=2
    note: 백금 촉매가 산화를 촉진하는 모델
  methane:
    name: 메테인 합성
    lab: GAS
    temperature: HEATED
    pressure: HIGH
    catalyst: Ni
    inputs: C=1,H2=2
    outputs: CH4=1
    note: 고압·가열 및 니켈 촉매를 사용하는 연구 모델
  methane_combustion:
    name: 메테인 연소
    lab: GAS
    temperature: HEATED
    inputs: CH4=1,O2=2
    outputs: CO2=1,H2O=2
    note: 연소 후 이산화탄소와 물이 생성됨
  ammonia:
    name: 암모니아 합성
    lab: GAS
    temperature: HEATED
    pressure: HIGH
    catalyst: Fe
    inputs: N2=1,H2=3
    outputs: NH3=2
    note: 고압·가열 조건에서 철 촉매를 사용한 합성 모델
  ammonia_decomposition:
    name: 암모니아 분해
    lab: GAS
    temperature: HEATED
    inputs: NH3=2
    outputs: N2=1,H2=3
  hydrogen_chloride:
    name: 염화수소 생성
    lab: GAS
    temperature: HEATED
    inputs: H2=1,Cl2=1
    outputs: HCl=2
  hydrochloric_acid:
    name: 염산 제조(용해 모델)
    lab: SOLUTION
    temperature: ROOM
    inputs: HCl=1,H2O=1
    outputs: HClAQ=1,H2O=1
  sulfur_dioxide:
    name: 이산화황 생성
    lab: GAS
    temperature: HEATED
    inputs: S=1,O2=1
    outputs: SO2=1
  sulfur_trioxide:
    name: 삼산화황 생성
    lab: GAS
    temperature: HEATED
    catalyst: Pt
    inputs: SO2=2,O2=1
    outputs: SO3=2
    note: 백금 촉매를 사용하는 접촉법 모델
  sulfuric_acid:
    name: 황산 생성
    lab: SOLUTION
    temperature: ROOM
    inputs: SO3=1,H2O=1
    outputs: H2SO4=1
  nitric_oxide:
    name: 일산화질소 생성
    lab: GAS
    temperature: HEATED
    inputs: N2=1,O2=1
    outputs: NO=2
  nitrogen_dioxide:
    name: 이산화질소 생성
    lab: GAS
    temperature: HEATED
    inputs: NO=2,O2=1
    outputs: NO2=2
  nitric_acid:
    name: 질산 생성
    lab: SOLUTION
    temperature: ROOM
    inputs: NO2=4,O2=1,H2O=2
    outputs: HNO3=4
  hydrogen_sulfide:
    name: 황화수소 생성
    lab: GAS
    temperature: ROOM
    inputs: H2=1,S=1
    outputs: H2S=1
  iron_oxide:
    name: 산화철(III) 생성
    lab: REDOX
    temperature: HEATED
    inputs: Fe=4,O2=3
    outputs: Fe2O3=2
  copper_oxide:
    name: 산화구리(II) 생성
    lab: REDOX
    temperature: HEATED
    inputs: Cu=2,O2=1
    outputs: CuO=2
  zinc_oxide:
    name: 산화아연 생성
    lab: REDOX
    temperature: HEATED
    inputs: Zn=2,O2=1
    outputs: ZnO=2
  aluminium_oxide:
    name: 산화알루미늄 생성
    lab: REDOX
    temperature: HEATED
    inputs: Al=4,O2=3
    outputs: Al2O3=2
  silicon_dioxide:
    name: 이산화규소 생성
    lab: REDOX
    temperature: HEATED
    inputs: Si=1,O2=1
    outputs: SiO2=1
  calcium_oxide:
    name: 산화칼슘 생성
    lab: REDOX
    temperature: HEATED
    inputs: Ca=2,O2=1
    outputs: CaO=2
  iron_oxide_reduction:
    name: 산화철 탄소 환원 모델
    lab: REDOX
    temperature: HEATED
    inputs: Fe2O3=2,C=3
    outputs: Fe=4,CO2=3
  copper_oxide_reduction:
    name: 산화구리 탄소 환원 모델
    lab: REDOX
    temperature: HEATED
    inputs: CuO=2,C=1
    outputs: Cu=2,CO2=1
  zinc_oxide_reduction:
    name: 산화아연 탄소 환원 모델
    lab: REDOX
    temperature: HEATED
    inputs: ZnO=2,C=1
    outputs: Zn=2,CO2=1
  silicon_reduction:
    name: 이산화규소 환원 모델
    lab: REDOX
    temperature: HEATED
    inputs: SiO2=1,C=1
    outputs: Si=1,CO2=1
  aluminium_electrolysis:
    name: 산화알루미늄 전기분해 모델
    lab: ELECTROLYSIS
    temperature: HEATED
    inputs: Al2O3=2
    outputs: Al=4,O2=3
  sodium_hydroxide:
    name: 나트륨과 물 반응
    lab: ACID_BASE
    temperature: ROOM
    inputs: Na=2,H2O=2
    outputs: NaOH=2,H2=1
  potassium_hydroxide:
    name: 칼륨과 물 반응
    lab: ACID_BASE
    temperature: ROOM
    inputs: K=2,H2O=2
    outputs: KOH=2,H2=1
  calcium_hydroxide:
