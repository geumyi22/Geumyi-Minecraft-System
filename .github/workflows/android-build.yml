name: Build GSCM 1.1.2 Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'gscm-ios-source.b64'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gscm-android-build
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore GSCM source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode gscm-ios-source.b64 > gscm-source.zip
          mkdir app
          unzip -q gscm-source.zip -d app
          test -f app/pubspec.yaml

      - name: Migrate Android build to AGP 9 built-in Kotlin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/android/app/build.gradle.kts")
          s=p.read_text()
          s=s.replace('    id("kotlin-android")\\n','')
          s=s.replace('\\n    kotlinOptions {\\n        jvmTarget = JavaVersion.VERSION_17.toString()\\n    }\\n','\\n')
          p.write_text(s)
          p=Path("app/android/settings.gradle.kts")
          s=p.read_text().replace('    id("org.jetbrains.kotlin.android") version "2.4.0" apply false\\n','')
          p.write_text(s)
          PY

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/GSCM-v1.1.2-Android.apk
          sha256sum dist/GSCM-v1.1.2-Android.apk > dist/GSCM-v1.1.2-Android.apk.sha256
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSCM-1.1.2-Android
          path: |
            dist/GSCM-v1.1.2-Android.apk
            dist/GSCM-v1.1.2-Android.apk.sha256
          if-no-files-found: error
          retention-days: 14
