name: Build GSCM Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'GSCM/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'GSCM/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gscm-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(awk '/^version:/ {print $2; exit}' GSCM/pubspec.yaml)"
          NAME="${FULL%%+*}"
          BUILD="${FULL##*+}"
          test -n "$NAME"
          test -n "$BUILD"
          echo "version_full=$FULL" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Install Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Restore GSCM source
        shell: bash
        run: |
          set -euo pipefail
          cp -R GSCM app
          test -f app/pubspec.yaml

      - name: Configure Android Gradle compatibility
        shell: bash
        run: |
          set -euo pipefail
          cat > app/android/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.geumyi.gscm"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              defaultConfig {
                  applicationId = "com.geumyi.gscm"
                  minSdk = 24
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }

          flutter {
              source = "../.."
          }
          EOF

          cat > app/android/settings.gradle.kts <<'EOF'
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
                  flutterSdkPath
              }

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "9.1.0" apply false
              id("org.jetbrains.kotlin.android") version "2.2.20" apply false
          }

          include(":app")
          EOF

          {
            echo "android.newDsl=false"
            echo "android.builtInKotlin=false"
          } >> app/android/gradle.properties

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Stage artifact
        shell: bash
        env:
          VERSION_FULL: ${{ steps.version.outputs.version_full }}
        run: |
          set -euo pipefail
          mkdir -p app/dist
          FILE="GSCM-v${VERSION_FULL}-Android.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "app/dist/$FILE"
          (
            cd app/dist
            sha256sum "$FILE" > "$FILE.sha256"
          )
          ls -lh app/dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSCM-${{ steps.version.outputs.version_name }}-build${{ steps.version.outputs.build_number }}-Android
          path: app/dist/*
          if-no-files-found: error
          retention-days: 14
