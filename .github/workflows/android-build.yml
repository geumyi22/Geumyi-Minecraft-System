name: Build GSCM 1.1.2 Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'gscm-ios-source.b64'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gscm-android-build
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore GSCM source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode gscm-ios-source.b64 > gscm-source.zip
          mkdir app
          unzip -q gscm-source.zip -d app
          test -f app/pubspec.yaml

      - name: Migrate Android build to AGP 9 built-in Kotlin
        shell: bash
        run: |
          set -euo pipefail
          cat > app/android/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.geumyi.gscm"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              defaultConfig {
                  applicationId = "com.geumyi.gscm"
                  minSdk = 24
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

          cat > app/android/settings.gradle.kts <<'EOF'
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
                  flutterSdkPath
              }

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "9.1.0" apply false
          }

          include(":app")
          EOF

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/GSCM-v1.1.2-Android.apk
          sha256sum dist/GSCM-v1.1.2-Android.apk > dist/GSCM-v1.1.2-Android.apk.sha256
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSCM-1.1.2-Android
          path: |
            dist/GSCM-v1.1.2-Android.apk
            dist/GSCM-v1.1.2-Android.apk.sha256
          if-no-files-found: error
          retention-days: 14
