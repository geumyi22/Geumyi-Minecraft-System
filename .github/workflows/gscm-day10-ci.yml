name: GSCM Day 10 Update Controls
on:
  push:
    paths:
      - 'GSCM/**'
      - '.github/workflows/gscm-day10-ci.yml'
  pull_request:
    paths:
      - 'GSCM/**'
      - '.github/workflows/gscm-day10-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-update-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: GSCM
        run: flutter pub get
      - name: Dart static analysis
        working-directory: GSCM
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Widget and controller tests
        working-directory: GSCM
        run: flutter test
      - name: Build Android debug APK
        working-directory: GSCM
        run: flutter build apk --debug
      - name: Upload debug APK for host testing
        uses: actions/upload-artifact@v7
        with:
          name: gscm-day10-debug-unsigned
          path: GSCM/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
