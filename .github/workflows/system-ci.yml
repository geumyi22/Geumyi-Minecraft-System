  gsc-package:
    name: GSC 4.5.1 / assemble CI Setup
    needs: [gsc, statusagent, gds, gst]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: GSC/ServerCenter/go.mod
          cache: false
      - name: Download StatusAgent
        uses: actions/download-artifact@v8
        with:
          name: statusagent-0.5.4
          path: ci-artifacts/statusagent
      - name: Download GDS
        uses: actions/download-artifact@v8
        with:
          name: gds-1.1.1
          path: ci-artifacts/gds
      - name: Download GST
        uses: actions/download-artifact@v8
        with:
          name: gst-1.1.1-hotfix
          path: ci-artifacts/gst
      - name: Restore installer payloads
        shell: pwsh
        run: |
          $dst = 'GSC/ServerCenter/cmd/setup/payload'
          Copy-Item 'ci-artifacts/statusagent/GeumyiStatusAgent-0.5.4.jar' "$dst/GeumyiStatusAgent-0.5.4.jar" -Force
          Copy-Item 'ci-artifacts/gds/GeumyiDiscordStatus-1.1.1-SpigotPaper26.3.jar' "$dst/GeumyiDiscordStatus-1.1.1-SpigotPaper26.3.jar" -Force
          Copy-Item 'ci-artifacts/gst/GeumyiServerTools-1.1.1-SpigotPaper26.3-GSCv4.1-HOTFIX.jar' "$dst/GeumyiServerTools-1.1.1-SpigotPaper26.3-GSCv4.1-HOTFIX.jar" -Force
      - name: Build GSC Setup
        shell: pwsh
        working-directory: GSC/ServerCenter
        run: ./build.ps1
      - name: Verify and stage GSC binaries
        shell: pwsh
        run: |
          $root = 'GSC/ServerCenter'
          $files = @(
            "$root/dist/GeumyiServerCenter-v4.5.1-Setup.exe",
            "$root/cmd/setup/payload/GeumyiServerHost.exe",
            "$root/cmd/setup/payload/GeumyiServerCenter.exe"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Missing GSC artifact: $f" }
            if ((Get-Item $f).Length -lt 100000) { throw "Suspiciously small GSC artifact: $f" }
          }
          $out = "$root/dist-ci"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($f in $files) { Copy-Item $f $out -Force }
          $lines = Get-ChildItem $out -File | ForEach-Object {
            "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii "$out/SHA256SUMS.txt"
      - name: Run Day 10 non-destructive E2E self-test
        shell: pwsh
        run: |
          $hostExe = (Resolve-Path 'GSC/ServerCenter/cmd/setup/payload/GeumyiServerHost.exe').Path
          $proc = Start-Process -FilePath $hostExe -ArgumentList '--day10-selftest' -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            throw "Day 10 self-test failed with exit code $($proc.ExitCode)"
          }
          Write-Host 'DAY10 BUILT HOST SELFTEST PASS'

      - name: Upload GSC CI package
        uses: actions/upload-artifact@v7
        with:
          name: gsc-4.5.1-ci
          path: GSC/ServerCenter/dist-ci/*
          if-no-files-found: error
          retention-days: 14

  bedrock-foundation:
    name: Day 10 / Bedrock dependency staging
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Parse and self-test Bedrock staging
        shell: powershell
        run: |
          $path = 'tools/day10/prepare_bedrock_foundation.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
            exit 1
          }
          & $path -SelfTest
      - name: Resolve and verify official Bedrock dependencies
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'day10-bedrock'
          & 'tools/day10/prepare_bedrock_foundation.ps1' -OutputRoot $out -Download
          $required = @(
            (Join-Path $out 'proxy-plugins/Geyser-Velocity.jar'),
            (Join-Path $out 'proxy-plugins/floodgate-velocity.jar'),
            (Join-Path $out 'backend-plugins/ViaVersion-5.12.0.jar'),
            (Join-Path $out 'backend-plugins/ViaBackwards-5.12.0.jar'),
            (Join-Path $out 'geyser-required-overrides.yml'),
            (Join-Path $out 'bedrock-plan.json')
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing staged dependency: $file" }
          }
          foreach ($jar in $required | Where-Object { $_ -like '*.jar' }) {
            if ((Get-Item -LiteralPath $jar).Length -lt 100000) { throw "Suspiciously small JAR: $jar" }
          }
          $plan = Get-Content -LiteralPath (Join-Path $out 'bedrock-plan.json') -Raw | ConvertFrom-Json
          if ($plan.destructive_changes_applied -ne $false) { throw 'Bedrock staging must remain non-destructive' }
          if ($plan.bedrock.geyser_java_emulation -ne '26.2') { throw 'Unexpected Geyser Java protocol baseline' }
          if (@($plan.backend_targets).Count -ne 3) { throw 'Expected Lobby/Wild/Playground Via targets' }
          if ($null -eq $plan.resolved.geyser -or $null -eq $plan.resolved.floodgate) {
            throw 'Geyser/Floodgate build metadata was not locked'
          }

