            if (-not $runner.Contains($safety)) { throw "Missing four-server guard: $safety" }
          }
          $helpers = Get-Content -LiteralPath 'tools/day10/four_cutover_helpers.ps1' -Raw
          foreach ($safety in @('gsc-4.2.4-ci', 'Day10-VerifySums', 'GeumyiServerCenter-v4.2.4-Setup.exe')) {
            if (-not $helpers.Contains($safety)) { throw "Missing verified GSC artifact guard: $safety" }
          }
          $launcher = Get-Content -LiteralPath 'tools/day10/Day10_FourServer_Live.cmd' -Raw
          if ($launcher.Contains('finish_day10.ps1') -or $launcher.Contains('call Day10_Final_E2E.cmd')) {
            throw 'Retired three-server finalizer must not be invoked'
          }
          foreach ($safety in @('Requesting Administrator permission', 'four-server-readiness.json', 'resolve_four_server_stage.ps1')) {
            if (-not $launcher.Contains($safety)) { throw "Missing one-click launcher guard: $safety" }
          }
