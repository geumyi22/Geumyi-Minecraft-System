          foreach($call in $calls){$name=$call.GetCommandName();if($name -and $name -in $denied){throw ('Read-only script invokes forbidden mutation: '+$name)}}
          $output=(& powershell.exe -NoProfile -NonInteractive -File $file |Out-String)|ConvertFrom-Json
