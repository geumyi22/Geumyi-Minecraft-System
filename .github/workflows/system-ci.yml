name: System CI

on:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - 'GSC/ServerCenter/**'
      - 'GSC/StatusAgent/**'
      - 'Plugins/GeumyiServerTools/**'
      - 'Plugins/GeumyiDiscordStatus/**'
      - 'Plugins/GeumyiTechnology/**'
      - 'Plugins/GeumyiChemistry/**'
      - 'Plugins/GeumyiLobby/**'
      - 'Plugins/GeumyiNetwork/**'
      - 'Servers/Lobby/**'
      - 'ResourcePacks/**'
      - 'deploy/**'
      - 'Network/**'
      - 'tools/day10/**'
      - 'tools/release/**'
      - 'DAY8-RUNBOOK.md'
      - '.github/workflows/day8-release.yml'
      - '.github/workflows/system-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'GSC/ServerCenter/**'
      - 'GSC/StatusAgent/**'
      - 'Plugins/GeumyiServerTools/**'
      - 'Plugins/GeumyiDiscordStatus/**'
      - 'Plugins/GeumyiTechnology/**'
      - 'Plugins/GeumyiChemistry/**'
      - 'Plugins/GeumyiLobby/**'
      - 'Plugins/GeumyiNetwork/**'
      - 'Servers/Lobby/**'
      - 'ResourcePacks/**'
      - 'deploy/**'
      - 'Network/**'
      - 'tools/day10/**'
      - 'tools/release/**'
      - 'DAY8-RUNBOOK.md'
      - '.github/workflows/day8-release.yml'
      - '.github/workflows/system-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gsc:
    name: GSC 4.2.4 / Go test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: GSC/ServerCenter/go.mod
          cache: false
      - name: Run GSC tests
        working-directory: GSC/ServerCenter
        run: go test ./...

  statusagent:
    name: StatusAgent 0.5.4 / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build StatusAgent
        working-directory: GSC/StatusAgent
        shell: bash
        run: bash build.sh
      - name: Verify and stage StatusAgent
        shell: bash
        run: |
          set -euo pipefail
          JAR="GSC/StatusAgent/GeumyiStatusAgent-0.5.4.jar"
          test -s "$JAR"
          unzip -t "$JAR" >/dev/null
          COUNT=$(unzip -Z1 "$JAR" | grep -c '^kr/geumyi/statusagent/.*[.]class$')
          test "$COUNT" -ge 9
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q 'Implementation-Version: 0.5.4'
          mkdir -p dist/statusagent
          cp "$JAR" dist/statusagent/
          (cd dist/statusagent && sha256sum GeumyiStatusAgent-0.5.4.jar > GeumyiStatusAgent-0.5.4.jar.sha256)
      - name: Upload StatusAgent artifact
        uses: actions/upload-artifact@v4
        with:
          name: statusagent-0.5.4
          path: dist/statusagent/*
          if-no-files-found: error
          retention-days: 14

  gds:
    name: GDS 1.1.1 / build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test GDS
        working-directory: Plugins/GeumyiDiscordStatus
        shell: bash
        run: bash build.sh
      - name: Verify and stage GDS
        shell: bash
        run: |
          set -euo pipefail
          JAR="Plugins/GeumyiDiscordStatus/GeumyiDiscordStatus-1.1.1-SpigotPaper26.3.jar"
          test -s "$JAR"
          unzip -t "$JAR" >/dev/null
          if unzip -Z1 "$JAR" | grep -q '^org/bukkit/'; then
            echo 'ERROR: compile-only Bukkit stubs leaked into JAR' >&2
            exit 1
          fi
          unzip -p "$JAR" plugin.yml | grep -Eq '^version:[[:space:]]*1[.]1[.]1'
          mkdir -p dist/gds
          cp "$JAR" dist/gds/
          (cd dist/gds && sha256sum GeumyiDiscordStatus-1.1.1-SpigotPaper26.3.jar > GeumyiDiscordStatus-1.1.1-SpigotPaper26.3.jar.sha256)
      - name: Upload GDS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gds-1.1.1
          path: dist/gds/*
          if-no-files-found: error
          retention-days: 14

  gst:
    name: GST 1.1.1 HOTFIX / overlay build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch verified deployed GST reference/core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-reference
          URL="https://github.com/geumyi22/Geumyi-Minecraft-System/releases/download/mc-2026.09.26-v3/GeumyiServerTools-1.1.1-SpigotPaper26.3-GSCv4.1-HOTFIX.jar"
          curl --fail --location --retry 3 "$URL" -o ci-reference/gst-reference.jar
          echo "af0509ea77f49fab6bf4dea48ddc0d030e50fa0880eb9250185b47e5ec696ac7  ci-reference/gst-reference.jar" | sha256sum -c -
      - name: Build and test GST overlay
        working-directory: Plugins/GeumyiServerTools
        shell: bash
        env:
          BASE_JAR: ${{ github.workspace }}/ci-reference/gst-reference.jar
        run: bash build.sh
      - name: Verify and stage GST
        shell: bash
        run: |
          set -euo pipefail
          JAR="Plugins/GeumyiServerTools/GeumyiServerTools-1.1.1-SpigotPaper26.3-GSCv4.1-HOTFIX.jar"
          test -s "$JAR"
          unzip -t "$JAR" >/dev/null
          if unzip -Z1 "$JAR" | grep -q '^org/bukkit/'; then
            echo 'ERROR: compile-only Bukkit stubs leaked into JAR' >&2
            exit 1
          fi
          unzip -p "$JAR" plugin.yml | grep -Eq '^version:[[:space:]]*1[.]1[.]1'
          mkdir -p dist/gst
          cp "$JAR" dist/gst/
          (cd dist/gst && sha256sum GeumyiServerTools-1.1.1-SpigotPaper26.3-GSCv4.1-HOTFIX.jar > GeumyiServerTools-1.1.1-SpigotPaper26.3-GSCv4.1-HOTFIX.jar.sha256)
      - name: Upload GST artifact
        uses: actions/upload-artifact@v4
        with:
          name: gst-1.1.1-hotfix
          path: dist/gst/*
          if-no-files-found: error
          retention-days: 14

  technology:
    name: Technology 0.1.4 / Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build Technology
        shell: bash
        run: gradle -p Plugins/GeumyiTechnology --no-daemon clean jar
      - name: Verify and stage Technology
        shell: bash
        run: |
          set -euo pipefail
          SRC="Plugins/GeumyiTechnology/build/libs/GeumyiTechnology-0.1.4.jar"
          OUT="GeumyiTechnology-0.1.4-Paper26.3.jar"
          test -s "$SRC"
          unzip -t "$SRC" >/dev/null
          unzip -p "$SRC" plugin.yml | grep -Eq '^version:[[:space:]]*0[.]1[.]4'
          unzip -p "$SRC" plugin.yml | grep -Eq "^api-version:[[:space:]]*'26[.]3'"
          javap -verbose -classpath "$SRC" kr.geumyi.technology.GeumyiTechnology | grep -q 'major version: 69'
          mkdir -p dist/technology
          cp "$SRC" "dist/technology/$OUT"
          (cd dist/technology && sha256sum "$OUT" > "$OUT.sha256")
      - name: Upload Technology artifact
        uses: actions/upload-artifact@v4
        with:
          name: technology-0.1.4
          path: dist/technology/*
          if-no-files-found: error
          retention-days: 14

  chemistry:
    name: Chemistry 0.4.1 / Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build Chemistry
        shell: bash
        run: gradle -p Plugins/GeumyiChemistry --no-daemon clean jar
      - name: Verify and stage Chemistry
        shell: bash
        run: |
          set -euo pipefail
          SRC="Plugins/GeumyiChemistry/build/libs/GeumyiChemistry-0.4.1.jar"
          OUT="GeumyiChemistry-0.4.1-Paper26.3.jar"
          test -s "$SRC"
          unzip -t "$SRC" >/dev/null
          unzip -p "$SRC" plugin.yml | grep -Eq '^version:[[:space:]]*0[.]4[.]1'
          unzip -p "$SRC" plugin.yml | grep -Eq "^api-version:[[:space:]]*'26[.]3'"
          javap -verbose -classpath "$SRC" kr.geumyi.chemistry.GeumyiChemistry | grep -q 'major version: 69'
          mkdir -p dist/chemistry
          cp "$SRC" "dist/chemistry/$OUT"
          (cd dist/chemistry && sha256sum "$OUT" > "$OUT.sha256")
      - name: Upload Chemistry artifact
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-0.4.1
          path: dist/chemistry/*
          if-no-files-found: error
          retention-days: 14

  lobby:
    name: GeumyiLobby 0.1.0 / Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build GeumyiLobby
        shell: bash
        run: gradle -p Plugins/GeumyiLobby --no-daemon clean jar
      - name: Verify and stage GeumyiLobby
        shell: bash
        run: |
          set -euo pipefail
          SRC="Plugins/GeumyiLobby/build/libs/GeumyiLobby-0.1.0.jar"
          OUT="GeumyiLobby-0.1.0-Paper26.3.jar"
          test -s "$SRC"
          unzip -t "$SRC" >/dev/null
          unzip -p "$SRC" plugin.yml | grep -Eq '^name:[[:space:]]*GeumyiLobby'
          unzip -p "$SRC" plugin.yml | grep -Eq '^version:[[:space:]]*0[.]1[.]0'
          unzip -p "$SRC" plugin.yml | grep -Eq "^api-version:[[:space:]]*'26[.]3'"
          javap -verbose -classpath "$SRC" kr.geumyi.lobby.GeumyiLobby | grep -q 'major version: 69'
          mkdir -p dist/lobby
          cp "$SRC" "dist/lobby/$OUT"
          (cd dist/lobby && sha256sum "$OUT" > "$OUT.sha256")
      - name: Validate Lobby templates stay private/backend-only
        shell: bash
        run: |
          set -euo pipefail
          PROPS="Servers/Lobby/server.properties.template"
          grep -Eq '^server-ip=127[.]0[.]0[.]1$' "$PROPS"
          grep -Eq '^server-port=25569$' "$PROPS"
          grep -Eq '^online-mode=false$' "$PROPS"
          grep -Eq '^gamemode=adventure$' "$PROPS"
          grep -Eq '^level-type=minecraft:flat$' "$PROPS"
          grep -Eq '^pvp=false$' "$PROPS"
      - name: Upload GeumyiLobby artifact
        uses: actions/upload-artifact@v4
        with:
          name: lobby-0.1.0
          path: dist/lobby/*
          if-no-files-found: error
          retention-days: 14

  network:
    name: GeumyiNetwork 0.1.0 / Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build GeumyiNetwork
        shell: bash
        run: gradle -p Plugins/GeumyiNetwork --no-daemon clean jar
      - name: Verify and stage GeumyiNetwork
        shell: bash
        run: |
          set -euo pipefail
          SRC="Plugins/GeumyiNetwork/build/libs/GeumyiNetwork-0.1.0.jar"
          OUT="GeumyiNetwork-0.1.0-Paper26.3.jar"
          test -s "$SRC"
          unzip -t "$SRC" >/dev/null
          unzip -p "$SRC" plugin.yml | grep -Eq '^name:[[:space:]]*GeumyiNetwork'
          unzip -p "$SRC" plugin.yml | grep -Eq '^version:[[:space:]]*0[.]1[.]0'
          unzip -p "$SRC" plugin.yml | grep -Eq "^api-version:[[:space:]]*'26[.]3'"
          javap -verbose -classpath "$SRC" kr.geumyi.network.GeumyiNetwork | grep -q 'major version: 69'
          mkdir -p dist/network
          cp "$SRC" "dist/network/$OUT"
          (cd dist/network && sha256sum "$OUT" > "$OUT.sha256")
      - name: Upload GeumyiNetwork artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-0.1.0
          path: dist/network/*
          if-no-files-found: error
          retention-days: 14

  resourcepacks:
    name: ResourcePacks / metadata validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JSON, pack.mcmeta and manifest.json
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path("ResourcePacks")
          json_files = sorted(root.rglob("*.json"))
          pack_meta = sorted(root.rglob("pack.mcmeta"))
          manifests = sorted(root.rglob("manifest.json"))

          if not pack_meta:
              raise SystemExit("No pack.mcmeta files found")
          if not manifests:
              raise SystemExit("No manifest.json files found")

          failures = []
          for path in sorted(set(json_files + pack_meta)):
              try:
                  with path.open("r", encoding="utf-8-sig") as fh:
                      json.load(fh)
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          for path in pack_meta:
              try:
                  with path.open("r", encoding="utf-8-sig") as fh:
                      data = json.load(fh)
                  pack = data.get("pack")
                  if not isinstance(pack, dict):
                      raise ValueError("missing object: pack")
                  legacy = "pack_format" in pack
                  ranged = "min_format" in pack and "max_format" in pack
                  if not (legacy or ranged):
                      raise ValueError("missing pack format metadata")
                  if ranged:
                      for key in ("min_format", "max_format"):
                          value = pack[key]
                          if not (isinstance(value, list) and len(value) == 2 and all(isinstance(n, int) for n in value)):
                              raise ValueError(f"invalid pack.{key}: expected [major, minor]")
                  if "description" not in pack:
                      raise ValueError("missing pack.description")
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          for path in manifests:
              try:
                  with path.open("r", encoding="utf-8-sig") as fh:
                      data = json.load(fh)
                  if "format_version" not in data:
                      raise ValueError("missing format_version")
                  header = data.get("header")
                  if not isinstance(header, dict) or not header.get("uuid"):
                      raise ValueError("missing header.uuid")
                  modules = data.get("modules")
                  if not isinstance(modules, list) or not modules:
                      raise ValueError("missing/non-empty modules")
                  for i, module in enumerate(modules):
                      if not isinstance(module, dict) or not module.get("uuid"):
                          raise ValueError(f"modules[{i}] missing uuid")
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("Resource pack validation failed:", file=sys.stderr)
              for failure in failures:
                  print(f" - {failure}", file=sys.stderr)
              raise SystemExit(1)

          print(f"Validated {len(json_files)} JSON files, {len(pack_meta)} pack.mcmeta files, and {len(manifests)} manifest.json files.")
          PY

  gsc-package:
    name: GSC 4.2.4 / assemble CI Setup
    needs: [gsc, statusagent, gds, gst]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: GSC/ServerCenter/go.mod
          cache: false
      - name: Download StatusAgent
        uses: actions/download-artifact@v4
        with:
          name: statusagent-0.5.4
          path: ci-artifacts/statusagent
      - name: Download GDS
        uses: actions/download-artifact@v4
        with:
          name: gds-1.1.1
          path: ci-artifacts/gds
      - name: Download GST
        uses: actions/download-artifact@v4
        with:
          name: gst-1.1.1-hotfix
          path: ci-artifacts/gst
      - name: Restore installer payloads
        shell: pwsh
        run: |
          $dst = 'GSC/ServerCenter/cmd/setup/payload'
          Copy-Item 'ci-artifacts/statusagent/GeumyiStatusAgent-0.5.4.jar' "$dst/GeumyiStatusAgent-0.5.4.jar" -Force
          Copy-Item 'ci-artifacts/gds/GeumyiDiscordStatus-1.1.1-SpigotPaper26.3.jar' "$dst/GeumyiDiscordStatus-1.1.1-SpigotPaper26.3.jar" -Force
          Copy-Item 'ci-artifacts/gst/GeumyiServerTools-1.1.1-SpigotPaper26.3-GSCv4.1-HOTFIX.jar' "$dst/GeumyiServerTools-1.1.1-SpigotPaper26.3-GSCv4.1-HOTFIX.jar" -Force
      - name: Build GSC Setup
        shell: pwsh
        working-directory: GSC/ServerCenter
        run: ./build.ps1
      - name: Verify and stage GSC binaries
        shell: pwsh
        run: |
          $root = 'GSC/ServerCenter'
          $files = @(
            "$root/dist/GeumyiServerCenter-v4.2.4-Setup.exe",
            "$root/cmd/setup/payload/GeumyiServerHost.exe",
            "$root/cmd/setup/payload/GeumyiServerCenter.exe"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Missing GSC artifact: $f" }
            if ((Get-Item $f).Length -lt 100000) { throw "Suspiciously small GSC artifact: $f" }
          }
          $out = "$root/dist-ci"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($f in $files) { Copy-Item $f $out -Force }
          $lines = Get-ChildItem $out -File | ForEach-Object {
            "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii "$out/SHA256SUMS.txt"
      - name: Run Day 10 non-destructive E2E self-test
        shell: pwsh
        run: |
          $hostExe = (Resolve-Path 'GSC/ServerCenter/cmd/setup/payload/GeumyiServerHost.exe').Path
          $proc = Start-Process -FilePath $hostExe -ArgumentList '--day10-selftest' -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            throw "Day 10 self-test failed with exit code $($proc.ExitCode)"
          }
          Write-Host 'DAY10 BUILT HOST SELFTEST PASS'

      - name: Upload GSC CI package
        uses: actions/upload-artifact@v4
        with:
          name: gsc-4.2.4-ci
          path: GSC/ServerCenter/dist-ci/*
          if-no-files-found: error
          retention-days: 14

  bedrock-foundation:
    name: Day 10 / Bedrock dependency staging
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse and self-test Bedrock staging
        shell: powershell
        run: |
          $path = 'tools/day10/prepare_bedrock_foundation.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
            exit 1
          }
          & $path -SelfTest
      - name: Resolve and verify official Bedrock dependencies
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'day10-bedrock'
          & 'tools/day10/prepare_bedrock_foundation.ps1' -OutputRoot $out -Download
          $required = @(
            (Join-Path $out 'proxy-plugins/Geyser-Velocity.jar'),
            (Join-Path $out 'proxy-plugins/floodgate-velocity.jar'),
            (Join-Path $out 'backend-plugins/ViaVersion-5.12.0.jar'),
            (Join-Path $out 'backend-plugins/ViaBackwards-5.12.0.jar'),
            (Join-Path $out 'geyser-required-overrides.yml'),
            (Join-Path $out 'bedrock-plan.json')
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing staged dependency: $file" }
          }
          foreach ($jar in $required | Where-Object { $_ -like '*.jar' }) {
            if ((Get-Item -LiteralPath $jar).Length -lt 100000) { throw "Suspiciously small JAR: $jar" }
          }
          $plan = Get-Content -LiteralPath (Join-Path $out 'bedrock-plan.json') -Raw | ConvertFrom-Json
          if ($plan.destructive_changes_applied -ne $false) { throw 'Bedrock staging must remain non-destructive' }
          if ($plan.bedrock.geyser_java_emulation -ne '26.2') { throw 'Unexpected Geyser Java protocol baseline' }
          if (@($plan.backend_targets).Count -ne 3) { throw 'Expected Lobby/Wild/Playground Via targets' }
          if ($null -eq $plan.resolved.geyser -or $null -eq $plan.resolved.floodgate) {
            throw 'Geyser/Floodgate build metadata was not locked'
          }

  release-foundation:
    name: Day 8 / release foundation static test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment catalog and generator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/release/generate_manifest.py
          python3 - <<'PY'
          import json, pathlib
          c=json.loads(pathlib.Path("deploy/components.json").read_text(encoding="utf-8"))
          assert c["schema"] == 1
          required={"gst","gds","technology","chemistry","statusagent","gsc","gscm_android","gscm_ios_unsigned"}
          assert required <= set(c["components"])
          for k,v in c["components"].items():
              assert v["version"]
              assert v["artifact_glob"]
              assert v["kind"]
              assert isinstance(v["targets"], list) and v["targets"]
          print("catalog OK")
          PY

      - name: Exercise manifest generator and Ed25519 signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/day8-assets
          python3 - <<'PY'
          import json, pathlib
          c=json.loads(pathlib.Path("deploy/components.json").read_text(encoding="utf-8"))
          root=pathlib.Path("/tmp/day8-assets")
          for key,v in c["components"].items():
              name=v["artifact_glob"]
              assert not any(ch in name for ch in "*?[")
              (root/name).write_bytes(("day8-static-"+key).encode())
          PY
          python3 tools/release/generate_manifest.py             --catalog deploy/components.json             --assets /tmp/day8-assets             --channel canary             --tag static-canary             --base-url https://github.com/geumyi22/Geumyi-Minecraft-System/releases/download/static-canary             --output /tmp/deployment-canary.json
          openssl genpkey -algorithm ED25519 -out /tmp/day8-private.pem
          openssl pkey -in /tmp/day8-private.pem -pubout -out /tmp/day8-public.pem
          openssl pkeyutl -sign -rawin -inkey /tmp/day8-private.pem -in /tmp/deployment-canary.json -out /tmp/deployment-canary.json.sig
          openssl pkeyutl -verify -rawin -pubin -inkey /tmp/day8-public.pem -in /tmp/deployment-canary.json -sigfile /tmp/deployment-canary.json.sig

      - name: Parse workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RB'
          require 'yaml'
          %w[
            .github/workflows/system-ci.yml
            .github/workflows/android-build.yml
            .github/workflows/ios-build.yml
            .github/workflows/day8-release.yml
          ].each do |path|
            YAML.load_file(path, aliases: true)
            puts "YAML OK: #{path}"
          end
          RB

      - name: Validate Day 10 proxy foundation
        shell: pwsh
        run: |
          $path = 'tools/day10/prepare_proxy_foundation.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
            exit 1
          }
          & $path -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Day 10 proxy foundation self-test failed' }

          $template = Get-Content 'Network/Velocity/velocity.toml.template' -Raw
          foreach ($needle in @(
            'player-info-forwarding-mode = "modern"',
            'lobby = "127.0.0.1:__LOBBY_PORT__"',
            'wild = "127.0.0.1:__WILD_PORT__"',
            'playground = "127.0.0.1:__PLAYGROUND_PORT__"',
            'try = ['
          )) {
            if (-not $template.Contains($needle)) { throw "Velocity template missing: $needle" }
          }

      - name: Parse GSC dashboard JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          html=pathlib.Path("GSC/ServerCenter/cmd/client/dashboard.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script>(.*?)</script>", html, flags=re.S|re.I)
          assert scripts, "dashboard script not found"
          pathlib.Path("/tmp/gsc-dashboard.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/gsc-dashboard.js

      - name: Parse Day 8 PowerShell tools
        shell: pwsh
        run: |
          foreach ($path in @(
            'tools/release/bootstrap_day8_signing.ps1',
            'tools/release/finish_day8.ps1',
            'tools/release/finish_day9.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $path"
          }

  release-foundation-windows:
    name: Day 8 / Windows PowerShell 5.1 compatibility
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Day 8 scripts with Windows PowerShell
        shell: powershell
        run: |
          foreach ($path in @(
            'tools/release/bootstrap_day8_signing.ps1',
            'tools/release/finish_day8.ps1',
            'tools/release/finish_day9.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              exit 1
            }
            Write-Host "Windows PowerShell syntax OK: $path"
          }

      - name: Day 10 proxy foundation on Windows PowerShell
        shell: powershell
        run: |
          $path = 'tools/day10/prepare_proxy_foundation.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
            exit 1
          }
          & $path -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Day 10 proxy foundation self-test failed on Windows PowerShell' }

      - name: Guard Day 9 PowerShell reserved variables
        shell: powershell
        run: |
          $path = 'tools/release/finish_day9.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { throw "Cannot inspect $path because it has parse errors" }

          $reserved = @('host','home','pid','pshome','pwd','shellid','true','false','null')
          $bad = $ast.FindAll({
            param($node)
            if ($node -isnot [System.Management.Automation.Language.AssignmentStatementAst]) { return $false }
            $left = $node.Left
            if ($left -isnot [System.Management.Automation.Language.VariableExpressionAst]) { return $false }
            return $reserved -contains $left.VariablePath.UserPath.ToLowerInvariant()
          }, $true)

          if (@($bad).Count -gt 0) {
            $bad | ForEach-Object { Write-Error ("Reserved variable assignment: " + $_.Extent.Text) }
            throw "Reserved PowerShell variable assignment detected in $path"
          }
          Write-Host 'Day 9 reserved-variable guard OK'

      - name: Guard Day 9 direct workflow run capture
        shell: powershell
        run: |
          $path = 'tools/release/finish_day9.ps1'
          $text = Get-Content -LiteralPath $path -Raw
          if ($text -match 'gh run list') {
            throw 'Day 9 finalizer must not rediscover a just-dispatched run via gh run list'
          }
          $sample = 'https://github.com/geumyi22/Geumyi-Minecraft-System/actions/runs/36589724562'
          $m = [regex]::Match($sample, 'actions/runs/(?<id>[0-9]+)')
          if (-not $m.Success -or $m.Groups['id'].Value -ne '36589724562') {
            throw 'Direct workflow run URL parser regression'
          }
          Write-Host 'Day 9 direct run-id capture guard OK'

      - name: Exercise PowerShell 5.1 random-byte API
        shell: powershell
        run: |
          $buf = New-Object byte[] 32
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($buf) } finally { $rng.Dispose() }
          if (($buf | Where-Object { $_ -ne 0 }).Count -eq 0) {
            throw 'RandomNumberGenerator returned only zero bytes'
          }
          Write-Host 'PowerShell 5.1 RNG API OK'

      - name: Exercise signing-tool discovery
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/release/bootstrap_day8_signing.ps1 -PreflightOnly
          if ($LASTEXITCODE -ne 0) {
            throw "Day 8 signing preflight failed with code $LASTEXITCODE"
          }

      - name: Verify Git-for-Windows OpenSSL fallback
        shell: powershell
        run: |
          $candidate = "$env:ProgramFiles\Git\usr\bin\openssl.exe"
          if (-not (Test-Path -LiteralPath $candidate)) {
            throw "Git OpenSSL fallback missing: $candidate"
          }
          & $candidate version

      - name: Verify ASCII-only CMD launcher
        shell: powershell
        run: |
          foreach ($path in @(
            'tools/release/Day8_Final_E2E.cmd',
            'tools/release/Day9_Final_E2E.cmd'
          )) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $path))
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "$path must not contain UTF-8 BOM"
            }
            if (($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "$path must remain ASCII-only"
            }
            & cmd.exe /d /c "call $path --selftest"
            if ($LASTEXITCODE -ne 0) {
              throw "$path parser self-test failed with code $LASTEXITCODE"
            }
            Write-Host "ASCII CMD launcher OK: $path"
          }

  day7-summary:
    name: Component CI + Day 8 foundation summary
    if: always()
    needs: [gsc, statusagent, gds, gst, technology, chemistry, lobby, network, resourcepacks, gsc-package, bedrock-foundation, release-foundation, release-foundation-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require every component job to pass
        shell: bash
        env:
          GSC: ${{ needs.gsc.result }}
          AGENT: ${{ needs.statusagent.result }}
          GDS: ${{ needs.gds.result }}
          GST: ${{ needs.gst.result }}
          TECHNOLOGY: ${{ needs.technology.result }}
          CHEMISTRY: ${{ needs.chemistry.result }}
          LOBBY: ${{ needs.lobby.result }}
          NETWORK: ${{ needs.network.result }}
          RESOURCEPACKS: ${{ needs.resourcepacks.result }}
          GSC_PACKAGE: ${{ needs.gsc-package.result }}
          BEDROCK_FOUNDATION: ${{ needs.bedrock-foundation.result }}
          RELEASE_FOUNDATION: ${{ needs.release-foundation.result }}
          RELEASE_WINDOWS: ${{ needs.release-foundation-windows.result }}
        run: |
          set -euo pipefail
          failed=0
          for name in GSC AGENT GDS GST TECHNOLOGY CHEMISTRY LOBBY NETWORK RESOURCEPACKS GSC_PACKAGE BEDROCK_FOUNDATION RELEASE_FOUNDATION RELEASE_WINDOWS; do
            value="${!name}"
            printf '%-16s %s\n' "$name" "$value"
            if [[ "$value" != "success" ]]; then failed=1; fi
          done
          exit "$failed"
