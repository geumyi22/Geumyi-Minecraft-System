          }
          $recovery = Get-Content -LiteralPath 'tools/day10/recover_failed_four_server.ps1' -Raw
          foreach ($marker in @('HttpWebRequest', 'GetRequestStream', 'DAY10 FAILED-CUTOVER RECOVERY PASS')) {
            if (-not $recovery.Contains($marker)) { throw "Missing recovery transport guard: $marker" }
          }

          # Exercise the exact PS5.1 raw-request transport against a real loopback HTTP parser.
          $py = (Get-Command python.exe -ErrorAction Stop).Source
          $serverPy = Join-Path $env:RUNNER_TEMP 'day10_utf8_http_server.py'
          $capture = Join-Path $env:RUNNER_TEMP 'day10_utf8_http_capture.json'
          $ready = Join-Path $env:RUNNER_TEMP 'day10_utf8_http_ready.txt'
          Remove-Item -LiteralPath $ready -Force -ErrorAction SilentlyContinue
          $port = Get-Random -Minimum 20000 -Maximum 45000
          @'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json, pathlib, sys
          port = int(sys.argv[1])
          capture = pathlib.Path(sys.argv[2])
          ready = pathlib.Path(sys.argv[3])
          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  try:
                      length = int(self.headers.get("Content-Length", "0"))
                      raw = self.rfile.read(length)
                      obj = json.loads(raw.decode("utf-8"))
                      capture.write_text(json.dumps(obj, ensure_ascii=False), encoding="utf-8")
                      body = b'{"ok":true}'
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json; charset=utf-8")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  except Exception as exc:
                      body = str(exc).encode("utf-8", errors="replace")
                      self.send_response(400)
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
              def log_message(self, fmt, *args):
                  pass
          server = HTTPServer(("127.0.0.1", port), Handler)
          ready.write_text("ready", encoding="ascii")
          server.handle_request()
          '@ | Set-Content -LiteralPath $serverPy -Encoding UTF8
          $serverProc = Start-Process -FilePath $py -ArgumentList @($serverPy, [string]$port, $capture, $ready) -PassThru -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path -LiteralPath $ready)) {
            if ($serverProc.HasExited) { throw 'Loopback JSON receiver exited before readiness' }
            if ((Get-Date) -ge $deadline) { throw 'Loopback JSON receiver readiness timeout' }
            Start-Sleep -Milliseconds 100
          }
          try {
            $name = ([string][char]0xAE08) + [char]0xC774 + ' ' + [char]0xC57C + [char]0xC0DD
            $dir = ([string][char]0xD14C) + [char]0xC2A4 + [char]0xD2B8
            $path = 'C:\' + $dir + '\' + ([string][char]0xC57C) + [char]0xC0DD
            $response = Day10-PostJsonUtf8 -Uri ("http://127.0.0.1:" + $port + "/") -Body @{ id='wild'; action='start'; name=$name; path=$path }
            if (-not $response.ok) { throw 'Raw PS5.1 HTTP transport returned non-ok response' }
            if (-not $serverProc.WaitForExit(10000)) { throw 'Loopback JSON receiver did not exit' }
            $received = Get-Content -LiteralPath $capture -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($received.name -ne $name -or $received.path -ne $path -or $received.action -ne 'start') {
              throw 'Raw PS5.1 UTF-8 HTTP transport corrupted JSON'
            }
            Write-Host 'DAY10 PS5.1 RAW UTF-8 HTTP POST SELFTEST PASS'
          } finally {
            if (-not $serverProc.HasExited) { Stop-Process -Id $serverProc.Id -Force -ErrorAction SilentlyContinue }
          }
          $launcher = Get-Content -LiteralPath 'tools/day10/Day10_FourServer_Live.cmd' -Raw
          foreach ($marker in @('Never pass the stage path through UAC.', 'resolve_four_server_stage.ps1', '--elevated')) {
