          . (Resolve-Path 'tools/day10/day10_live_helpers.ps1')
          $probe = @{ action='update'; server=@{ id='wild'; name='금이 야생'; path='C:\테스트\야생' } }
          $utf8 = Day10-JsonUtf8Bytes $probe
          $decoded = [Text.Encoding]::UTF8.GetString($utf8) | ConvertFrom-Json
          if ($decoded.server.name -ne '금이 야생' -or $decoded.server.path -ne 'C:\테스트\야생') {
