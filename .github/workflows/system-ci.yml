name: System CI

on:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - 'GSC/ServerCenter/**'
      - 'GSC/StatusAgent/**'
      - 'Plugins/GeumyiServerTools/**'
      - 'Plugins/GeumyiDiscordStatus/**'
      - 'Plugins/GeumyiTechnology/**'
      - 'Plugins/GeumyiChemistry/**'
      - 'Plugins/GeumyiLobby/**'
      - 'Plugins/GeumyiNetwork/**'
      - 'Servers/Lobby/**'
      - 'ResourcePacks/**'
      - 'deploy/**'
      - 'Network/**'
      - 'tools/day10/**'
      - 'tools/velocity/CI_Scheduler_Disposable_Policy_Restore.ps1'
      - 'tools/velocity/CI_Managed_Cutover_Disposable.ps1'
      - 'tools/velocity/Velocity_Managed_Cutover.ps1'
      - 'tools/velocity/Velocity_Actual_Launch_Audit_READ_ONLY.ps1'
      - 'tools/velocity/Velocity_Snapshot_Three_Before_Cutover.ps1'
      - 'tools/velocity/GSC452_Host_Swap_Recovery_PREFLIGHT_READ_ONLY.ps1'
      - 'tools/velocity/GSC452_Host_Service_Reversible_Swap.ps1'
      - 'tools/velocity/GSC452_Wild_Task_JVM_Identity_READ_ONLY.ps1'
      - 'tools/velocity/GSC452_Wild_Endpoint_Differential_READ_ONLY.ps1'
      - 'tools/velocity/Run_GSC452_Wild_Endpoint_Differential_READ_ONLY.cmd'
      - 'tools/velocity/Run_GSC452_Wild_Task_JVM_Identity_READ_ONLY.cmd'
      - 'tools/velocity/GSC452_HOST_SWAP_OPERATOR_README.md'
      - 'tools/velocity/Run_GSC452_Host_Swap_Recovery_PREFLIGHT_READ_ONLY.cmd'
      - 'tools/velocity/CI_Scheduler_Disposable_AutoRestart.ps1'
      - 'tools/release/**'
      - 'DAY8-RUNBOOK.md'
      - '.github/workflows/day8-release.yml'
      - '.github/workflows/system-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'GSC/ServerCenter/**'
      - 'GSC/StatusAgent/**'
      - 'Plugins/GeumyiServerTools/**'
      - 'Plugins/GeumyiDiscordStatus/**'
      - 'Plugins/GeumyiTechnology/**'
      - 'Plugins/GeumyiChemistry/**'
      - 'Plugins/GeumyiLobby/**'
      - 'Plugins/GeumyiNetwork/**'
      - 'Servers/Lobby/**'
      - 'ResourcePacks/**'
      - 'deploy/**'
      - 'Network/**'
      - 'tools/day10/**'
      - 'tools/velocity/CI_Scheduler_Disposable_Policy_Restore.ps1'
      - 'tools/velocity/CI_Managed_Cutover_Disposable.ps1'
      - 'tools/velocity/Velocity_Managed_Cutover.ps1'
      - 'tools/velocity/Velocity_Actual_Launch_Audit_READ_ONLY.ps1'
      - 'tools/velocity/Velocity_Snapshot_Three_Before_Cutover.ps1'
      - 'tools/velocity/GSC452_Host_Swap_Recovery_PREFLIGHT_READ_ONLY.ps1'
      - 'tools/velocity/GSC452_Host_Service_Reversible_Swap.ps1'
      - 'tools/velocity/GSC452_Wild_Task_JVM_Identity_READ_ONLY.ps1'
      - 'tools/velocity/GSC452_Wild_Endpoint_Differential_READ_ONLY.ps1'
      - 'tools/velocity/Run_GSC452_Wild_Endpoint_Differential_READ_ONLY.cmd'
      - 'tools/velocity/Run_GSC452_Wild_Task_JVM_Identity_READ_ONLY.cmd'
      - 'tools/velocity/GSC452_HOST_SWAP_OPERATOR_README.md'
      - 'tools/velocity/Run_GSC452_Host_Swap_Recovery_PREFLIGHT_READ_ONLY.cmd'
      - 'tools/velocity/CI_Scheduler_Disposable_AutoRestart.ps1'
      - 'tools/release/**'
      - 'DAY8-RUNBOOK.md'
      - '.github/workflows/day8-release.yml'
      - '.github/workflows/system-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gsc:
    name: GSC 4.5.1 / Go test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: GSC/ServerCenter/go.mod
          cache: false
      - name: Run GSC tests
        working-directory: GSC/ServerCenter
        run: go test ./...
      - name: Race-check isolated Velocity lifecycle and message authentication
        working-directory: GSC/ServerCenter
        run: go test -race ./internal/velocitylifecycle ./internal/velocitybridge ./internal/velocitypeer ./internal/velocitymanaged
      - name: Validate cutover kit parser and fail-closed synthetic modes
        shell: powershell
        timeout-minutes: 2
        run: |
          $script='tools/velocity/Velocity_Managed_Cutover.ps1'
          $tokens=$null; $parseErrors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$parseErrors)
          if(@($parseErrors).Count -gt 0){throw 'Velocity cutover PowerShell syntax invalid'}
          foreach($target in @('wild','playground','other')){
            foreach($state in @('Running','Ready','Disabled','Queued','Missing')){
              $output=& powershell.exe -NoProfile -NonInteractive -File $script -Target $target -Mode Preflight -Synthetic -SyntheticState $state
              if($LASTEXITCODE -ne 0){throw 'Synthetic preflight failed'}
              $v=($output|Out-String)|ConvertFrom-Json
              if($v.schema -ne 1 -or $v.target -cne $target -or $v.synthetic -ne $true -or $v.read_only -ne $true -or $v.live_control_authorized -ne $false -or $v.status -cne 'SYNTHETIC_NO_GO' -or $v.ready_for_cutover -ne ($state -eq 'Ready')){throw 'Synthetic read-only preflight violated NO-GO contract'}
            }
          }
          # Expected child errors are intentional: PowerShell 5.1 treats child
          # stderr as a terminating NativeCommandError with Stop preference.
          $originalPreference=$ErrorActionPreference
          try {
            $ErrorActionPreference='Continue'
            $output=& powershell.exe -NoProfile -NonInteractive -File $script -Target wild -Mode Cutover -Synthetic -Approved -Ticket 'CI-ONLY-12345' 2>&1
            $cutoverExit=$LASTEXITCODE
            $output=& powershell.exe -NoProfile -NonInteractive -File $script -Target wild -Mode Rollback -Synthetic -Approved -Ticket 'CI-ONLY-12345' 2>&1
            $rollbackExit=$LASTEXITCODE
          } finally { $ErrorActionPreference=$originalPreference }
          if($cutoverExit -eq 0){throw 'Synthetic mode executed a cutover'}
          if($rollbackExit -eq 0){throw 'Synthetic mode executed rollback'}
          Write-Host 'Velocity 17-case cutover safety matrix PASS'
          # Actions PowerShell wrapper exits with LASTEXITCODE of last native child.
          # Reset only after both intentional denials were explicitly verified.
          $global:LASTEXITCODE=0
      - name: Disposable non-triggered Windows task 999 to zero to 999 and cleanup
        shell: powershell
        timeout-minutes: 4
        run: |
          $file='tools/velocity/CI_Scheduler_Disposable_Policy_Restore.ps1'
          $tokens=$null; $syntaxErrors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$syntaxErrors)
          if(@($syntaxErrors).Count -gt 0){throw 'Disposable CI policy task script syntax rejected'}
          & powershell.exe -NoProfile -NonInteractive -File $file
          if($LASTEXITCODE -ne 0){throw 'Disposable Windows task restoration test failed'}
      # Deliberately do not re-run the bounded dummy auto-retry probe on
      # every PR commit. Two disposable Windows observations saw only the
      # initial failure and no automatic relaunch within the fixed window.
      # A green probe used to mean cleanup succeeded, NOT crash-retry worked.
      # Crash-recovery capability remains NO-GO until a separate, purpose-
      # built disposable Windows VM verifies the actual scheduler failure mode.

  velocity-owned-official-e2e:
    name: Official Velocity 4.2.0 owned-console shutdown/restart CI only
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact draft
        uses: actions/checkout@v7
      - name: Setup JDK25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: GSC/ServerCenter/go.mod
          cache: false
      - name: Run pinned official Velocity process ownership lifecycle (CI ONLY)
        shell: powershell
        working-directory: GSC/ServerCenter
        timeout-minutes: 6
        run: |
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_OS -cne 'Windows' -or
             [string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)){
            throw 'CI HOST GUARD failed; refusing Velocity process launch'
          }
          $sha='35a5596a5468a035d8a32c8de5ebb0dc6b8d8f0cc3ff5169d514aca762af8aa8'
          $jar=Join-Path $env:RUNNER_TEMP 'gsc452-ci-velocity-4.2.0-30.jar'
          $url='https://fill-data.papermc.io/v1/objects/'+$sha+'/velocity-4.2.0-30.jar'
          try {
            Invoke-WebRequest -Uri $url -OutFile $jar -UseBasicParsing -TimeoutSec 75 -ErrorAction Stop
            $file=Get-Item -LiteralPath $jar -ErrorAction Stop
            if($file.Length -ne 42163652){throw 'Official Velocity artifact length mismatch'}
            $digest=(Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant()
            if($digest -cne $sha){throw 'Official Velocity SHA-256 mismatch'}
            $env:GSC452_CI_VELOCITY420_JAR=$jar
            go test -count=1 -timeout 125s -run TestOfficialVelocity420ManagedConsoleLifecycleCI -v ./internal/velocitymanaged
            if($LASTEXITCODE -ne 0){throw 'Owned-console shutdown/restart E2E failed'}
          } finally {
            Remove-Item -LiteralPath $jar -Force -ErrorAction SilentlyContinue
          }

  velocity-cutover-disposable:
    name: Disposable Windows Task cutover + original backup + rollback (CI ONLY)
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Setup disposable Java path (never launch)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify and execute fake non-triggered Windows Task Scheduler cutover
        shell: powershell
        timeout-minutes: 5
        run: |
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_OS -cne 'Windows'){
            throw 'CI-only OS guard failed'
          }
          $script='tools/velocity/CI_Managed_Cutover_Disposable.ps1'
          $tokens=$null; $issues=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$issues)
          if(@($issues).Count -gt 0){throw 'Disposable cutover fixture syntax invalid'}
          $audit='tools/velocity/Velocity_Actual_Launch_Audit_READ_ONLY.ps1'
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $audit),[ref]$tokens,[ref]$issues)
          if(@($issues).Count -gt 0){foreach($i in @($issues)){Write-Host ('AUDIT PARSE LINE '+$i.Extent.StartLineNumber+': '+$i.Message)};throw 'Host launch audit PowerShell syntax invalid'}
          $backup='tools/velocity/Velocity_Snapshot_Three_Before_Cutover.ps1'
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $backup),[ref]$tokens,[ref]$issues)
          if(@($issues).Count -gt 0){throw 'Production backup-only wrapper PowerShell syntax invalid'}
          & powershell.exe -NoProfile -NonInteractive -File $script
          if($LASTEXITCODE -ne 0){throw 'Disposable Windows cutover and rollback not proven'}
      - name: Upload actual-host READ-ONLY launch audit (separate safe ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: GSC452-Velocity-Actual-Launch-READ-ONLY
          path: |
            tools/velocity/Velocity_Actual_Launch_Audit_READ_ONLY.ps1
            tools/velocity/Run_Velocity_Actual_Launch_Audit_READ_ONLY.cmd
          if-no-files-found: error
          retention-days: 7
      - name: Upload snapshot-only approved maintenance kit
        uses: actions/upload-artifact@v4
        with:
          name: GSC452-Velocity-OriginalTask-Snapshot-ONLY
          path: |
            tools/velocity/Velocity_Snapshot_Three_Before_Cutover.ps1
            tools/velocity/Run_Velocity_Snapshot_Three_ADMIN.cmd
            tools/velocity/Velocity_Managed_Cutover.ps1
            tools/velocity/Velocity_Actual_Launch_Audit_READ_ONLY.ps1
            tools/velocity/VELOCITY-MANAGED-KIT-README.txt
          if-no-files-found: error
          retention-days: 7
      - name: Attach read-only-first Velocity operator kit (do not auto-apply)
        uses: actions/upload-artifact@v4
        with:
          name: GSC452-Velocity-Managed-Cutover-CANARY
          path: |
            tools/velocity/Velocity_Managed_Cutover.ps1
            tools/velocity/Run_Velocity_Managed_PRECHECK_READ_ONLY.cmd
            tools/velocity/Velocity_Actual_Launch_Audit_READ_ONLY.ps1
            tools/velocity/Run_Velocity_Actual_Launch_Audit_READ_ONLY.cmd
            tools/velocity/VELOCITY-MANAGED-KIT-README.txt
            docs/operations/GSC-VELOCITY-DIRECT-OWNERSHIP-CUTOVER-2026-10-19.md
          if-no-files-found: error
          retention-days: 7
  statusagent:
    name: StatusAgent 0.5.4 / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build StatusAgent
        working-directory: GSC/StatusAgent
        shell: bash
        run: bash build.sh
      - name: Verify and stage StatusAgent
        shell: bash
        run: |
          set -euo pipefail
          JAR="GSC/StatusAgent/GeumyiStatusAgent-0.5.4.jar"
          test -s "$JAR"
          unzip -t "$JAR" >/dev/null
          COUNT=$(unzip -Z1 "$JAR" | grep -c '^kr/geumyi/statusagent/.*[.]class$')
          test "$COUNT" -ge 9
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q 'Implementation-Version: 0.5.4'
          mkdir -p dist/statusagent
          cp "$JAR" dist/statusagent/
          (cd dist/statusagent && sha256sum GeumyiStatusAgent-0.5.4.jar > GeumyiStatusAgent-0.5.4.jar.sha256)
      - name: Upload StatusAgent artifact
        uses: actions/upload-artifact@v7
        with:
          name: statusagent-0.5.4
          path: dist/statusagent/*
          if-no-files-found: error
          retention-days: 14

  gds:
    name: GDS 1.1.1 / build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test GDS
        working-directory: Plugins/GeumyiDiscordStatus
        shell: bash
        run: bash build.sh
      - name: Verify and stage GDS
        shell: bash
        run: |
          set -euo pipefail
          JAR="Plugins/GeumyiDiscordStatus/GeumyiDiscordStatus-1.1.1-SpigotPaper26.3.jar"
          test -s "$JAR"
          unzip -t "$JAR" >/dev/null
          if unzip -Z1 "$JAR" | grep -q '^org/bukkit/'; then
            echo 'ERROR: compile-only Bukkit stubs leaked into JAR' >&2
            exit 1
          fi
          unzip -p "$JAR" plugin.yml | grep -Eq '^version:[[:space:]]*1[.]1[.]1'
          mkdir -p dist/gds
          cp "$JAR" dist/gds/
          (cd dist/gds && sha256sum GeumyiDiscordStatus-1.1.1-SpigotPaper26.3.jar > GeumyiDiscordStatus-1.1.1-SpigotPaper26.3.jar.sha256)
      - name: Upload GDS artifact
        uses: actions/upload-artifact@v7
        with:
          name: gds-1.1.1
          path: dist/gds/*
          if-no-files-found: error
          retention-days: 14

  gst:
    name: GST 1.1.1 HOTFIX / overlay build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch verified deployed GST reference/core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-reference
          URL="https://github.com/geumyi22/Geumyi-Minecraft-System/releases/download/mc-2026.09.26-v3/GeumyiServerTools-1.1.1-SpigotPaper26.3-GSCv4.1-HOTFIX.jar"
          curl --fail --location --retry 3 "$URL" -o ci-reference/gst-reference.jar
          echo "af0509ea77f49fab6bf4dea48ddc0d030e50fa0880eb9250185b47e5ec696ac7  ci-reference/gst-reference.jar" | sha256sum -c -
      - name: Build and test GST overlay
        working-directory: Plugins/GeumyiServerTools
        shell: bash
        env:
          BASE_JAR: ${{ github.workspace }}/ci-reference/gst-reference.jar
        run: bash build.sh
      - name: Verify and stage GST
        shell: bash
        run: |
          set -euo pipefail
          JAR="Plugins/GeumyiServerTools/GeumyiServerTools-1.1.1-SpigotPaper26.3-GSCv4.1-HOTFIX.jar"
          test -s "$JAR"
          unzip -t "$JAR" >/dev/null
          if unzip -Z1 "$JAR" | grep -q '^org/bukkit/'; then
            echo 'ERROR: compile-only Bukkit stubs leaked into JAR' >&2
            exit 1
          fi
          unzip -p "$JAR" plugin.yml | grep -Eq '^version:[[:space:]]*1[.]1[.]1'
          mkdir -p dist/gst
          cp "$JAR" dist/gst/
          (cd dist/gst && sha256sum GeumyiServerTools-1.1.1-SpigotPaper26.3-GSCv4.1-HOTFIX.jar > GeumyiServerTools-1.1.1-SpigotPaper26.3-GSCv4.1-HOTFIX.jar.sha256)
      - name: Upload GST artifact
        uses: actions/upload-artifact@v7
        with:
          name: gst-1.1.1-hotfix
          path: dist/gst/*
          if-no-files-found: error
          retention-days: 14

  technology:
    name: Technology 0.1.4 / Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Build Technology
        shell: bash
        run: gradle -p Plugins/GeumyiTechnology --no-daemon clean jar
      - name: Verify and stage Technology
        shell: bash
        run: |
          set -euo pipefail
          SRC="Plugins/GeumyiTechnology/build/libs/GeumyiTechnology-0.1.4.jar"
          OUT="GeumyiTechnology-0.1.4-Paper26.3.jar"
          test -s "$SRC"
          unzip -t "$SRC" >/dev/null
          unzip -p "$SRC" plugin.yml | grep -Eq '^version:[[:space:]]*0[.]1[.]4'
          unzip -p "$SRC" plugin.yml | grep -Eq "^api-version:[[:space:]]*'26[.]3'"
          javap -verbose -classpath "$SRC" kr.geumyi.technology.GeumyiTechnology | grep -q 'major version: 69'
          mkdir -p dist/technology
          cp "$SRC" "dist/technology/$OUT"
          (cd dist/technology && sha256sum "$OUT" > "$OUT.sha256")
      - name: Upload Technology artifact
        uses: actions/upload-artifact@v7
        with:
          name: technology-0.1.4
          path: dist/technology/*
          if-no-files-found: error
          retention-days: 14

  chemistry:
    name: Chemistry 0.4.1 / Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Build Chemistry
        shell: bash
        run: gradle -p Plugins/GeumyiChemistry --no-daemon clean jar
      - name: Verify and stage Chemistry
        shell: bash
        run: |
          set -euo pipefail
          SRC="Plugins/GeumyiChemistry/build/libs/GeumyiChemistry-0.4.1.jar"
          OUT="GeumyiChemistry-0.4.1-Paper26.3.jar"
          test -s "$SRC"
          unzip -t "$SRC" >/dev/null
          unzip -p "$SRC" plugin.yml | grep -Eq '^version:[[:space:]]*0[.]4[.]1'
          unzip -p "$SRC" plugin.yml | grep -Eq "^api-version:[[:space:]]*'26[.]3'"
          javap -verbose -classpath "$SRC" kr.geumyi.chemistry.GeumyiChemistry | grep -q 'major version: 69'
          mkdir -p dist/chemistry
          cp "$SRC" "dist/chemistry/$OUT"
          (cd dist/chemistry && sha256sum "$OUT" > "$OUT.sha256")
      - name: Upload Chemistry artifact
        uses: actions/upload-artifact@v7
        with:
          name: chemistry-0.4.1
          path: dist/chemistry/*
          if-no-files-found: error
          retention-days: 14

  lobby:
    name: GeumyiLobby 0.1.1 / Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Build GeumyiLobby
        shell: bash
        run: gradle -p Plugins/GeumyiLobby --no-daemon clean jar
      - name: Verify and stage GeumyiLobby
        shell: bash
        run: |
          set -euo pipefail
          SRC="Plugins/GeumyiLobby/build/libs/GeumyiLobby-0.1.1.jar"
          OUT="GeumyiLobby-0.1.1-Paper26.3.jar"
          test -s "$SRC"
          unzip -t "$SRC" >/dev/null
          unzip -p "$SRC" plugin.yml | grep -Eq '^name:[[:space:]]*GeumyiLobby'
          unzip -p "$SRC" plugin.yml | grep -Eq '^version:[[:space:]]*0[.]1[.]1'
          unzip -p "$SRC" plugin.yml | grep -Eq "^api-version:[[:space:]]*'26[.]3'"
          javap -verbose -classpath "$SRC" kr.geumyi.lobby.GeumyiLobby | grep -q 'major version: 69'
          mkdir -p dist/lobby
          cp "$SRC" "dist/lobby/$OUT"
          (cd dist/lobby && sha256sum "$OUT" > "$OUT.sha256")
      - name: Validate Lobby templates stay private/backend-only
        shell: bash
        run: |
          set -euo pipefail
          PROPS="Servers/Lobby/server.properties.template"
          grep -Eq '^server-ip=127[.]0[.]0[.]1$' "$PROPS"
          grep -Eq '^server-port=25573$' "$PROPS"
          grep -Eq '^online-mode=false$' "$PROPS"
          grep -Eq '^gamemode=adventure$' "$PROPS"
          grep -Eq '^level-type=minecraft:flat$' "$PROPS"
          grep -Eq '^pvp=false$' "$PROPS"
      - name: Upload GeumyiLobby artifact
        uses: actions/upload-artifact@v7
        with:
          name: lobby-0.1.1
          path: dist/lobby/*
          if-no-files-found: error
          retention-days: 14

  network:
    name: GeumyiNetwork 0.1.0 / Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Build GeumyiNetwork
        shell: bash
        run: gradle -p Plugins/GeumyiNetwork --no-daemon clean jar
      - name: Verify and stage GeumyiNetwork
        shell: bash
        run: |
          set -euo pipefail
          SRC="Plugins/GeumyiNetwork/build/libs/GeumyiNetwork-0.1.0.jar"
          OUT="GeumyiNetwork-0.1.0-Paper26.3.jar"
          test -s "$SRC"
          unzip -t "$SRC" >/dev/null
          unzip -p "$SRC" plugin.yml | grep -Eq '^name:[[:space:]]*GeumyiNetwork'
          unzip -p "$SRC" plugin.yml | grep -Eq '^version:[[:space:]]*0[.]1[.]0'
          unzip -p "$SRC" plugin.yml | grep -Eq "^api-version:[[:space:]]*'26[.]3'"
          javap -verbose -classpath "$SRC" kr.geumyi.network.GeumyiNetwork | grep -q 'major version: 69'
          mkdir -p dist/network
          cp "$SRC" "dist/network/$OUT"
          (cd dist/network && sha256sum "$OUT" > "$OUT.sha256")
      - name: Upload GeumyiNetwork artifact
        uses: actions/upload-artifact@v7
        with:
          name: network-0.1.0
          path: dist/network/*
          if-no-files-found: error
          retention-days: 14

  resourcepacks:
    name: ResourcePacks / metadata validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate JSON, pack.mcmeta and manifest.json
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path("ResourcePacks")
          json_files = sorted(root.rglob("*.json"))
          pack_meta = sorted(root.rglob("pack.mcmeta"))
          manifests = sorted(root.rglob("manifest.json"))

          if not pack_meta:
              raise SystemExit("No pack.mcmeta files found")
          if not manifests:
              raise SystemExit("No manifest.json files found")

          failures = []
          for path in sorted(set(json_files + pack_meta)):
              try:
                  with path.open("r", encoding="utf-8-sig") as fh:
                      json.load(fh)
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          for path in pack_meta:
              try:
                  with path.open("r", encoding="utf-8-sig") as fh:
                      data = json.load(fh)
                  pack = data.get("pack")
                  if not isinstance(pack, dict):
                      raise ValueError("missing object: pack")
                  legacy = "pack_format" in pack
                  ranged = "min_format" in pack and "max_format" in pack
                  if not (legacy or ranged):
                      raise ValueError("missing pack format metadata")
                  if ranged:
                      for key in ("min_format", "max_format"):
                          value = pack[key]
                          if not (isinstance(value, list) and len(value) == 2 and all(isinstance(n, int) for n in value)):
                              raise ValueError(f"invalid pack.{key}: expected [major, minor]")
                  if "description" not in pack:
                      raise ValueError("missing pack.description")
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          for path in manifests:
              try:
                  with path.open("r", encoding="utf-8-sig") as fh:
                      data = json.load(fh)
                  if "format_version" not in data:
                      raise ValueError("missing format_version")
                  header = data.get("header")
                  if not isinstance(header, dict) or not header.get("uuid"):
                      raise ValueError("missing header.uuid")
                  modules = data.get("modules")
                  if not isinstance(modules, list) or not modules:
                      raise ValueError("missing/non-empty modules")
                  for i, module in enumerate(modules):
                      if not isinstance(module, dict) or not module.get("uuid"):
                          raise ValueError(f"modules[{i}] missing uuid")
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("Resource pack validation failed:", file=sys.stderr)
              for failure in failures:
                  print(f" - {failure}", file=sys.stderr)
              raise SystemExit(1)

          print(f"Validated {len(json_files)} JSON files, {len(pack_meta)} pack.mcmeta files, and {len(manifests)} manifest.json files.")
          PY

  gsc452-wild-identity-readonly:
    name: GSC 4.5.2 / wild Task-JVM evidence parser + isolated synthetic CI
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Draft PR
        uses: actions/checkout@v7
      - name: Fail-closed evidence classifier and forbidden-operation test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $file='tools/velocity/GSC452_Wild_Task_JVM_Identity_READ_ONLY.ps1'
          $tokens=$null; $errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
          if(@($errors).Count -ne 0){foreach($e in @($errors)){Write-Host ('PARSE '+$e.Message)};throw 'Read-only evidence parser failed'}
          $commands=$ast.FindAll({param($n) $n -is [Management.Automation.Language.CommandAst]},$true)
          $forbid=@('Disable-ScheduledTask','Enable-ScheduledTask','Stop-ScheduledTask','Start-ScheduledTask','Unregister-ScheduledTask',
             'Register-ScheduledTask','Stop-Process','Start-Process','taskkill','sc.exe','Set-Acl','Set-Content','Remove-Item',
             'Set-ItemProperty','New-Service','Remove-Service','Stop-Service','Start-Service',
             'Set-NetFirewallRule','New-NetFirewallRule','wevtutil','Clear-EventLog')
          foreach($command in $commands){
            $n=$command.GetCommandName()
            if($n -and $n -in $forbid){throw ('Mutation in read-only evidence script: '+$n)}
          }
          $text=Get-Content -LiteralPath $file -Raw
          foreach($required in @('Get-ScheduledTask','Get-NetTCPConnection','Get-NetUDPEndpoint','Get-WinEvent','Get-CimInstance',
             'Id=129','live_control_authorized=$false','safe_to_stop=$false','safe_to_cutover=$false')){
            if(-not $text.Contains($required)){throw ('Safety/evidence requirement missing: '+$required)}
          }
          foreach($scenario in @('matched','missing-event','different-owner','stale-event')){
            $result=(& powershell.exe -NoProfile -NonInteractive -File $file -SyntheticScenario $scenario |Out-String) | ConvertFrom-Json
            if($LASTEXITCODE -ne 0 -or $result.schema -ne 1 -or $result.target -cne 'wild' -or
              $result.synthetic -ne $true -or $result.read_only -ne $true -or
              $result.task_to_proxy_jvm_evidence_matched -ne $false -or
              $result.safe_to_stop -ne $false -or $result.safe_to_cutover -ne $false -or
              $result.live_control_authorized -ne $false -or $result.scheduled_task_modified -ne $false -or
              $result.java_operations -ne 0){throw ('Unsafe synthetic classifier: '+$scenario)}
          }
          Write-Host 'GSC452_WILD_TASK_JVM_READONLY_SYNTHETIC_CI_PASS_NO_REAL_TASKS'
      - name: Test differential wild TCP-UDP ownership without live hosts (READ ONLY)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $file='tools/velocity/GSC452_Wild_Endpoint_Differential_READ_ONLY.ps1'
          $tokens=$null; $errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0){foreach($e in @($errors)){Write-Host ('PARSE '+$e.Message)};throw 'Read-only differential parser rejected script'}
          $commands=$ast.FindAll({param($n) $n -is [Management.Automation.Language.CommandAst]},$true)
          $forbidden=@('Stop-ScheduledTask','Start-ScheduledTask','Disable-ScheduledTask','Enable-ScheduledTask',
            'Register-ScheduledTask','Unregister-ScheduledTask','Stop-Process','Start-Process','taskkill','Set-Content',
            'Set-Acl','Remove-Item','Start-Service','Stop-Service','Restart-Service','Set-ItemProperty','wevtutil',
            'Clear-EventLog','Set-NetFirewallRule','New-NetFirewallRule','Invoke-CimMethod')
          foreach($command in $commands){
            $name=$command.GetCommandName()
            if($name -and $name -in $forbidden){throw ('Unexpected OS mutation command: '+$name)}
          }
          $source=Get-Content -LiteralPath $file -Raw
          foreach($guard in @('read_only=$true','task_to_jvm_identity_proven=$false',
             'safe_to_stop=$false','safe_to_cutover=$false','live_control_authorized=$false',
             'Get-NetTCPConnection','Get-NetUDPEndpoint','Get-WinEvent','Get-CimInstance')){
            if(-not $source.Contains($guard)){throw ('Missing fail-closed invariant: '+$guard)}
          }
          $cases=@{
            same='SAME_PID'
            different='DIFFERENT_PID'
            'udp-missing'='INSUFFICIENT_UNIQUE_OWNERS'
            'udp-multiple'='INSUFFICIENT_UNIQUE_OWNERS'
            'tcp-missing'='INSUFFICIENT_UNIQUE_OWNERS'
            'query-failed'='UNVERIFIED_QUERY'
          }
          foreach($key in $cases.Keys){
            $text=& powershell.exe -NoProfile -NonInteractive -File $file -SyntheticScenario $key
            if($LASTEXITCODE -ne 0){throw ('Differential synthetic script failed: '+$key)}
            $out=($text|Out-String)|ConvertFrom-Json
            if($out.schema -ne 2 -or $out.synthetic -ne $true -or $out.read_only -ne $true -or
              $out.tcp_udp_owner_relation -cne $cases[$key] -or
              $out.task_to_jvm_identity_proven -ne $false -or
              $out.safe_to_stop -ne $false -or $out.safe_to_cutover -ne $false -or
              $out.live_control_authorized -ne $false -or
              $out.scheduled_task_modified -ne $false -or $out.java_operations -ne 0){
                throw ('Differential safety regression: '+$key)
            }
            if(($text|Out-String) -match '(?i)GeumyiServerCenter\\|[A-Z]:\\|ProcessID|raw_pid'){
              throw ('Private host detail leaked in scenario: '+$key)
            }
          }
          Write-Host 'GSC452_WILD_DIFFERENTIAL_READONLY_SYNTHETIC_CI_PASS'
      - name: Publish operator read-only ownership evidence kit
        uses: actions/upload-artifact@v4
        with:
          name: GSC452-WILD-TASK-JVM-IDENTITY-READ-ONLY
          path: |
            tools/velocity/GSC452_Wild_Task_JVM_Identity_READ_ONLY.ps1
            tools/velocity/Run_GSC452_Wild_Task_JVM_Identity_READ_ONLY.cmd
            tools/velocity/GSC452_Wild_Endpoint_Differential_READ_ONLY.ps1
            tools/velocity/Run_GSC452_Wild_Endpoint_Differential_READ_ONLY.cmd
          if-no-files-found: error
          retention-days: 7

  gsc452-host-swap-reversible:
    name: GSC 4.5.2 / Host swap safe-state + parser CI (NO LIVE SCM)
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Draft PR
        uses: actions/checkout@v7
      - name: Validate host swap syntax, mutation scopes and synthetic states
        shell: powershell
        run: |
          $file='tools/velocity/GSC452_Host_Service_Reversible_Swap.ps1'
          $tokens=$null; $errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0){foreach($e in @($errors)){Write-Host ('PARSE '+$e.Extent.StartLineNumber+': '+$e.Message)};throw 'Host reversible swap syntax error'}
          $commands=$ast.FindAll({param($n) $n -is [Management.Automation.Language.CommandAst]},$true)
          $forbid=@('Disable-ScheduledTask','Enable-ScheduledTask','Start-ScheduledTask','Stop-ScheduledTask','Unregister-ScheduledTask','Register-ScheduledTask','Stop-Process','Start-Process','taskkill','sc.exe','Set-Acl','Set-Content','Remove-Item','Remove-Service','New-Service','Register-ScheduledJob')
          foreach($cmd in $commands){$name=$cmd.GetCommandName();if($name -and $name -in $forbid){throw ('Illegal Host swap operation '+$name)}}
          $text=Get-Content -LiteralPath $file -Raw
          foreach($guard in @('STAGING_HASH_MISMATCH','JOURNAL_EXISTS','MANAGED_OPTIN_ENV_ENABLED','ORPHANED_VELOCITY_GENERATION_PRESENT','AUTOSTART_BACKEND_OFFLINE','HOST_CANARY_AUTO_ROLLBACK_VERIFIED','HOST_CANARY_MANUAL_RECOVERY_REQUIRED','Invoke-CimMethod')){
            if(-not $text.Contains($guard)){throw ('Host swap safety guard absent: '+$guard)}
          }
          foreach($case in @('healthy','canary-start-fails','rollback-start-fails')){
            $result=(& powershell.exe -NoProfile -NonInteractive -File $file -Mode Synthetic -SyntheticCase $case |Out-String)|ConvertFrom-Json
            if($LASTEXITCODE -ne 0 -or $result.schema -ne 1 -or $result.success -ne $true -or
               $result.service_mutation_authorized -ne $false -or $result.paper_operations_direct -ne 0 -or
               -not $result.status.StartsWith('SYNTHETIC_')){throw ('Synthetic no-mutation classification failed '+$case)}
          }
          $originalPreference=$ErrorActionPreference
          try{
            $ErrorActionPreference='Continue'
            $blocked=& powershell.exe -NoProfile -NonInteractive -File $file -Mode Plan 2>&1
            $code=$LASTEXITCODE
          }finally{$ErrorActionPreference=$originalPreference}
          if($code -ne 2){throw 'Unconfigured Windows runner unexpectedly permitted GSC Host Plan'}
          $report=(@($blocked)|Where-Object {$_ -is [string] -and $_ -match '^\{.*\}$'}|Select-Object -Last 1)|ConvertFrom-Json
          if($report.success -ne $false -or $report.status -cne 'HOST_SWAP_BLOCKED_OR_UNCONFIRMED' -or
            $report.service_mutation_authorized -ne $false){throw 'Host Plan no-go classification violated'}
          Write-Host 'GSC452_HOST_SWAP_SAFE_STATE_CI_PASS_NO_SCM_MODIFICATION'
          # Plan child is expected to exit 2 in a disposable runner. Clear its
          # native exit code after asserting the fail-closed result explicitly.
          $global:LASTEXITCODE=0
      - name: Regression test staging ACL inherited from protected trusted root (synthetic, NO LIVE SCM)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $file='tools/velocity/GSC452_Host_Service_Reversible_Swap.ps1'
          $tokens=$null; $errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
          if(@($errors).Count -ne 0){throw 'Host swap parser rejected ACL test target'}
          $fn=$ast.Find({param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -ceq 'PrivateDir'},$true)
          if($null -eq $fn){throw 'PrivateDir guard missing'}
          Invoke-Expression $fn.Extent.Text
          function Deny([string]$code){throw ('CI_DENY_'+$code)}
          function AssertDenied([scriptblock]$call,[string]$code){
            $rejected=$false
            try{& $call}catch{
              if($_.Exception.Message -like ('*CI_DENY_'+$code+'*')){$rejected=$true}else{throw}
            }
            if(-not $rejected){throw ('Unexpected ACL acceptance: '+$code)}
          }
          $oldProgramData=$env:ProgramData
          $testProgramData=Join-Path $env:RUNNER_TEMP ('gsc452-acl-'+[guid]::NewGuid().ToString('N'))
          $script:testRoot=Join-Path $testProgramData 'GeumyiServerCenter\VelocityManaged'
          $script:testStage=Join-Path $script:testRoot 'CanaryStaging'
          try{
            [void](New-Item -ItemType Directory -Path $script:testStage -Force)
            $env:ProgramData=$testProgramData
            $systemAce=[pscustomobject]@{IdentityReference=(New-Object Security.Principal.SecurityIdentifier 'S-1-5-18');AccessControlType=[Security.AccessControl.AccessControlType]::Allow}
            $adminsAce=[pscustomobject]@{IdentityReference=(New-Object Security.Principal.SecurityIdentifier 'S-1-5-32-544');AccessControlType=[Security.AccessControl.AccessControlType]::Allow}
            $everyoneAce=[pscustomobject]@{IdentityReference=(New-Object Security.Principal.SecurityIdentifier 'S-1-1-0');AccessControlType=[Security.AccessControl.AccessControlType]::Allow}
            $script:parentAcl=[pscustomobject]@{AreAccessRulesProtected=$true;Access=@($systemAce,$adminsAce)}
            $script:stageAcl=[pscustomobject]@{AreAccessRulesProtected=$false;Access=@($systemAce,$adminsAce)}
            # Isolate ACL decisions by mocking only Get-Acl. Real disposable
            # directory existence and no-reparse checks still run.
            function Get-Acl {
              param([string]$LiteralPath)
              if($LiteralPath -ieq $script:testRoot){return $script:parentAcl}
              if($LiteralPath -ieq $script:testStage){return $script:stageAcl}
              throw 'UNEXPECTED_ACL_PATH'
            }
            PrivateDir $script:testRoot
            PrivateDir $script:testStage $true
            AssertDenied {PrivateDir $script:testStage} 'STAGING_INHERITED_ACL'
            $script:parentAcl.AreAccessRulesProtected=$false
            AssertDenied {PrivateDir $script:testStage $true} 'STAGING_PARENT_ACL_INHERITED'
            $script:parentAcl.AreAccessRulesProtected=$true
            $script:stageAcl.Access=@($systemAce,$everyoneAce)
            AssertDenied {PrivateDir $script:testStage $true} 'STAGING_UNTRUSTED_ALLOW_ACE'
            $script:stageAcl.Access=@($systemAce,$adminsAce)
            $script:stageAcl.AreAccessRulesProtected=$true
            PrivateDir $script:testStage
            $script:stageAcl.AreAccessRulesProtected=$false
            $script:parentAcl.AreAccessRulesProtected=$false
            AssertDenied {PrivateDir $script:testRoot} 'STAGING_INHERITED_ACL'
            Write-Host 'GSC452_STAGING_ACL_INHERITANCE_REGRESSION_PASS_NO_SCM_CHANGES'
          }finally{
            $env:ProgramData=$oldProgramData
            if(Test-Path -LiteralPath $testProgramData){Remove-Item -LiteralPath $testProgramData -Recurse -Force}
          }
      - name: Test Windows SCM PathName change and restore on disposable unstarted service
        shell: powershell
        timeout-minutes: 2
        run: |
          $ErrorActionPreference='Stop'
          $name='GSC_CI_BinPath_'+[guid]::NewGuid().ToString('N').Substring(0,12)
          $old=$env:SystemRoot+'\System32\cmd.exe'
          $created=$false
          try{
            $null=& sc.exe create $name 'binPath=' $old 'start=' 'demand'
            if($LASTEXITCODE -ne 0){throw 'Cannot register disposable unstarted Windows service'}
            $created=$true
            $obj=Get-CimInstance Win32_Service -Filter ("Name='"+$name+"'") -ErrorAction Stop
            if($obj.State -ne 'Stopped'){throw 'Disposable service unexpectedly running'}
            $target='"'+$old+'" --service --config "C:\ProgramData\ci-not-real.json"'
            $result=Invoke-CimMethod -InputObject $obj -MethodName Change -Arguments @{PathName=$target} -ErrorAction Stop
            if($null -eq $result -or [int]$result.ReturnValue -ne 0){throw 'CIM PathName update failed'}
            $changed=Get-CimInstance Win32_Service -Filter ("Name='"+$name+"'")
            if($changed.PathName -cne $target -or $changed.State -ne 'Stopped'){throw 'CIM PathName update did not persist exact quotes'}
            $result=Invoke-CimMethod -InputObject $changed -MethodName Change -Arguments @{PathName=$old} -ErrorAction Stop
            if($null -eq $result -or [int]$result.ReturnValue -ne 0){throw 'Disposable original service restoration failed'}
            $restored=Get-CimInstance Win32_Service -Filter ("Name='"+$name+"'")
            if($restored.PathName -cne $old -or $restored.State -ne 'Stopped'){throw 'Disposable original PathName not restored'}
            Write-Host 'GSC452_CIM_SERVICE_BINPATH_CHANGE_RESTORE_UNSTARTED_PASS'
          }finally{
            if($created){
              $null=& sc.exe delete $name
              if($LASTEXITCODE -ne 0){throw 'Disposable SCM CI service cleanup failed'}
            }
          }
      - name: Publish gated service swap and original rollback kit
        uses: actions/upload-artifact@v4
        with:
          name: GSC452-HOST-SWAP-AND-ROLLBACK-OPERATOR-KIT
          path: |
            tools/velocity/GSC452_Host_Service_Reversible_Swap.ps1
            tools/velocity/GSC452_Host_Swap_Recovery_PREFLIGHT_READ_ONLY.ps1
            tools/velocity/Run_GSC452_Host_Swap_WITH_AUTO_ROLLBACK_ADMIN.cmd
            tools/velocity/Run_GSC452_Host_Rollback_ONLY_ADMIN.cmd
            tools/velocity/GSC452_HOST_SWAP_OPERATOR_README.md
          if-no-files-found: error
          retention-days: 7
  gsc452-host-rollback-readonly:
