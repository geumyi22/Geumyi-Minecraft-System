          python3 - <<'PY'
          import json, pathlib
          c=json.loads(pathlib.Path("deploy/components.json").read_text(encoding="utf-8"))
          assert c["schema"] == 1
          required={"gst","gds","technology","chemistry","statusagent","gsc","gscm_android","gscm_ios_unsigned"}
          assert required <= set(c["components"])
          for k,v in c["components"].items():
              assert v["version"]
              assert v["artifact_glob"]
              assert v["kind"]
              assert isinstance(v["targets"], list) and v["targets"]
          print("catalog OK")
          PY

      - name: Exercise manifest generator and Ed25519 signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/day8-assets
          python3 - <<'PY'
          import json, pathlib
          c=json.loads(pathlib.Path("deploy/components.json").read_text(encoding="utf-8"))
          root=pathlib.Path("/tmp/day8-assets")
          for key,v in c["components"].items():
              name=v["artifact_glob"]
              assert not any(ch in name for ch in "*?[")
              (root/name).write_bytes(("day8-static-"+key).encode())
          PY
          python3 tools/release/generate_manifest.py             --catalog deploy/components.json             --assets /tmp/day8-assets             --channel canary             --tag static-canary             --base-url https://github.com/geumyi22/Geumyi-Minecraft-System/releases/download/static-canary             --output /tmp/deployment-canary.json
          openssl genpkey -algorithm ED25519 -out /tmp/day8-private.pem
          openssl pkey -in /tmp/day8-private.pem -pubout -out /tmp/day8-public.pem
          openssl pkeyutl -sign -rawin -inkey /tmp/day8-private.pem -in /tmp/deployment-canary.json -out /tmp/deployment-canary.json.sig
          openssl pkeyutl -verify -rawin -pubin -inkey /tmp/day8-public.pem -in /tmp/deployment-canary.json -sigfile /tmp/deployment-canary.json.sig

