          }
          Write-Host 'DAY10 FOUR-SERVER FINALIZER STATIC GATES PASS (LIVE E2E UNVERIFIED)'

      - name: Day 10 Phase 2 staging launcher safety gate
        shell: powershell
        run: |
          & '.\tools\day10\Day10_Phase2_Stage.cmd' --selftest
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2 stage launcher selftest failed' }
          $cmd = Get-Content -LiteralPath 'tools/day10/Day10_Phase2_Stage.cmd' -Raw
          foreach ($needle in @('stage_four_server_network.ps1', '-DownloadDependencies', 'STAGING ONLY', 'four-server-network-plan.json')) {
            if (-not $cmd.Contains($needle)) { throw "Phase 2 launcher missing: $needle" }
          }
          if ($cmd.Contains('Day10_Final_E2E.cmd"') -or $cmd.Contains('finish_day10.ps1"')) {
            throw 'Retired three-server finalizer must never be executed by Phase 2'
          }
          $validator = 'tools/day10/validate_four_server_cutover.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $validator), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("Cutover preflight syntax: " + $_.Message) }
            exit 1
          }
          & $validator -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Cutover readiness synthetic selftest failed' }
          if (-not $cmd.Contains('validate_four_server_cutover.ps1')) {
            throw 'Phase2 must execute the read-only readiness validator'
          }
          Write-Host 'DAY10 PHASE 2 STAGING LAUNCHER SAFETY PASS'

      - name: Day 10 four-server port snapshot, cutover and rollback self-test
        shell: powershell
        run: |
          $path = 'tools/day10/four_server_port_transaction.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("Port transaction syntax line " + $_.Extent.StartLineNumber + ": " + $_.Message) }
            exit 1
          }
          & $path -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Day 10 four-server port transaction failed' }
          Write-Host 'DAY 10 FOUR SERVER PORT TRANSACTION PASS'

      - name: Day 10 four-server proxy staging on Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = 'tools/day10/stage_four_server_network.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("Day 10 staging syntax at line " + $_.Extent.StartLineNumber + ":" + $_.Extent.StartColumnNumber + ": " + $_.Message) }
            exit 1
          }
          & $path -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Day 10 four-server staging selftest failed' }
          $targets = Get-Content -LiteralPath 'deploy/components.json' -Raw | ConvertFrom-Json
          foreach ($component in @('technology','chemistry')) {
            $actual = @($targets.components.$component.targets | Sort-Object)
            if ($actual.Count -ne 2 -or $actual[0] -ne 'other' -or $actual[1] -ne 'wild') {
              throw "$component must target Wild and Other only"
            }
          }
          $lobbyJava = Get-Content -LiteralPath 'Plugins/GeumyiLobby/src/main/java/kr/geumyi/lobby/GeumyiLobby.java' -Raw
          $lobbyYaml = Get-Content -LiteralPath 'Plugins/GeumyiLobby/src/main/resources/config.yml' -Raw
          $lobbyProps = Get-Content -LiteralPath 'Servers/Lobby/server.properties.template' -Raw
          foreach ($required in @('otherServer', 'buildOtherGate()', 'requestServer(player, otherServer)', 'event.getRawSlot() == 6')) {
            if (-not $lobbyJava.Contains($required)) { throw "Lobby missing Other routing: $required" }
          }
          if (-not $lobbyYaml.Contains('other-server: other') -or
              -not $lobbyProps.Contains('server-port=25573')) {
            throw 'Lobby config or backend private port regression'
          }
          Write-Host 'DAY 10 FOUR-SERVER TARGETS AND STAGING PASS'

      - name: Validate Day 10 finalizer with Windows PowerShell
        shell: powershell
        run: |
          foreach ($path in @(
            'tools/day10/day10_live_helpers.ps1',
            'tools/day10/rollback_day10.ps1',
            'tools/day10/finish_day10.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              exit 1
            }
            Write-Host "Day 10 PowerShell syntax OK: $path"
          }
          & 'tools/day10/finish_day10.ps1' -SelfTest

      - name: Day 10 four-server read-only preflight and retired deployment guard
        shell: powershell
        run: |
          $path = 'tools/day10/preflight_four_servers.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("Day 10 preflight syntax at line " + $_.Extent.StartLineNumber + ":" + $_.Extent.StartColumnNumber + ": " + $_.Message + "; around: " + $_.Extent.Text) }
            exit 1
          }
          & $path -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Day 10 four-server preflight self-test failed' }
          $retired = Get-Content -LiteralPath 'tools/day10/Day10_Final_E2E.cmd' -Raw
          if ($retired -notmatch 'retired 3-server topology' -or $retired -notmatch 'exit /b 60') {
            throw 'Old 3-server finalizer is not guarded'
          }
          $launcher = Get-Content -LiteralPath 'tools/day10/Day10_Phase1_Preflight.cmd' -Raw
          if ($launcher -notmatch 'preflight_four_servers.ps1' -or $launcher -match 'finish_day10[.]ps1') {
            throw 'Day 10 inspection launcher must only call read-only preflight'
          }
          Write-Host 'DAY 10 PHASE 1 PREFLIGHT AND DEPLOY GUARD PASS'

      - name: Guard Day 9 PowerShell reserved variables
        shell: powershell
        run: |
          $path = 'tools/release/finish_day9.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { throw "Cannot inspect $path because it has parse errors" }

          $reserved = @('host','home','pid','pshome','pwd','shellid','true','false','null')
          $bad = $ast.FindAll({
            param($node)
            if ($node -isnot [System.Management.Automation.Language.AssignmentStatementAst]) { return $false }
            $left = $node.Left
            if ($left -isnot [System.Management.Automation.Language.VariableExpressionAst]) { return $false }
            return $reserved -contains $left.VariablePath.UserPath.ToLowerInvariant()
          }, $true)

          if (@($bad).Count -gt 0) {
            $bad | ForEach-Object { Write-Error ("Reserved variable assignment: " + $_.Extent.Text) }
            throw "Reserved PowerShell variable assignment detected in $path"
          }
          Write-Host 'Day 9 reserved-variable guard OK'

      - name: Guard Day 9 direct workflow run capture
        shell: powershell
        run: |
          $path = 'tools/release/finish_day9.ps1'
          $text = Get-Content -LiteralPath $path -Raw
          if ($text -match 'gh run list') {
            throw 'Day 9 finalizer must not rediscover a just-dispatched run via gh run list'
          }
          $sample = 'https://github.com/geumyi22/Geumyi-Minecraft-System/actions/runs/36589724562'
          $m = [regex]::Match($sample, 'actions/runs/(?<id>[0-9]+)')
          if (-not $m.Success -or $m.Groups['id'].Value -ne '36589724562') {
            throw 'Direct workflow run URL parser regression'
          }
          Write-Host 'Day 9 direct run-id capture guard OK'

      - name: Exercise PowerShell 5.1 random-byte API
        shell: powershell
        run: |
          $buf = New-Object byte[] 32
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($buf) } finally { $rng.Dispose() }
          if (($buf | Where-Object { $_ -ne 0 }).Count -eq 0) {
            throw 'RandomNumberGenerator returned only zero bytes'
          }
          Write-Host 'PowerShell 5.1 RNG API OK'

      - name: Exercise signing-tool discovery
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/release/bootstrap_day8_signing.ps1 -PreflightOnly
          if ($LASTEXITCODE -ne 0) {
            throw "Day 8 signing preflight failed with code $LASTEXITCODE"
          }

      - name: Verify Git-for-Windows OpenSSL fallback
        shell: powershell
        run: |
          $candidate = "$env:ProgramFiles\Git\usr\bin\openssl.exe"
          if (-not (Test-Path -LiteralPath $candidate)) {
            throw "Git OpenSSL fallback missing: $candidate"
          }
          & $candidate version

      - name: Verify ASCII-only CMD launcher
        shell: powershell
        run: |
          foreach ($path in @(
            'tools/release/Day8_Final_E2E.cmd',
            'tools/release/Day9_Final_E2E.cmd',
            'tools/day10/Day10_Final_E2E.cmd'
          )) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $path))
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "$path must not contain UTF-8 BOM"
            }
            if (($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "$path must remain ASCII-only"
            }
            & cmd.exe /d /c "call $path --selftest"
            if ($LASTEXITCODE -ne 0) {
              throw "$path parser self-test failed with code $LASTEXITCODE"
            }
            Write-Host "ASCII CMD launcher OK: $path"
          }

  day7-summary:
    name: Component CI + Day 8 foundation summary
    if: always()
    needs: [gsc, statusagent, gds, gst, technology, chemistry, lobby, network, resourcepacks, gsc-package, bedrock-foundation, release-foundation, release-foundation-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require every component job to pass
        shell: bash
        env:
          GSC: ${{ needs.gsc.result }}
          AGENT: ${{ needs.statusagent.result }}
          GDS: ${{ needs.gds.result }}
          GST: ${{ needs.gst.result }}
          TECHNOLOGY: ${{ needs.technology.result }}
          CHEMISTRY: ${{ needs.chemistry.result }}
          LOBBY: ${{ needs.lobby.result }}
          NETWORK: ${{ needs.network.result }}
          RESOURCEPACKS: ${{ needs.resourcepacks.result }}
          GSC_PACKAGE: ${{ needs.gsc-package.result }}
          BEDROCK_FOUNDATION: ${{ needs.bedrock-foundation.result }}
          RELEASE_FOUNDATION: ${{ needs.release-foundation.result }}
          RELEASE_WINDOWS: ${{ needs.release-foundation-windows.result }}
        run: |
          set -euo pipefail
          failed=0
          for name in GSC AGENT GDS GST TECHNOLOGY CHEMISTRY LOBBY NETWORK RESOURCEPACKS GSC_PACKAGE BEDROCK_FOUNDATION RELEASE_FOUNDATION RELEASE_WINDOWS; do
            value="${!name}"
            printf '%-16s %s\n' "$name" "$value"
            if [[ "$value" != "success" ]]; then failed=1; fi
          done
          exit "$failed"
