name: Day12 Stable 8h Soak Read-Only Kit

on:
  pull_request:
    paths:
      - 'tools/day12/Day12_Phase12_Continuous_Soak_READ_ONLY.ps1'
      - 'tools/day12/Start_Day12_8H_Soak_READ_ONLY.cmd'
      - 'tools/day12/README-Day12-8H-STABLE-SOAK-KO.txt'
      - '.github/workflows/day12-stable-soak-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-soak-kit:
    name: Verify and package 8h READ-ONLY operator kit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell and verify synthetic 8h analyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'tools/day12/Day12_Phase12_Continuous_Soak_READ_ONLY.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
          if(@($errors).Count -gt 0){ throw ('SOAK_PARSER_ERRORS=' + @($errors).Count) }
          $out = @(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Synthetic)
          if($LASTEXITCODE -ne 0){ throw 'SOAK_SYNTHETIC_SCRIPT_FAILED' }
          $report = ($out | Out-String) | ConvertFrom-Json
          if($report.mode -ne 'CONTINUOUS_READ_ONLY_SOAK' -or $report.schema -ne 3 -or
             $report.result -ne 'REVIEW_REQUIRED' -or $report.stable_release_allowed -or
             -not $report.duration_requirement_met -or $report.observed_added_java_gsc_process_identities -ne 1 -or
             $report.observed_removed_java_gsc_process_identities -ne 1 -or
             $report.application_probe_unhealthy_samples -ne 1 -or
             $report.observed_process_identity_stable) {
            throw 'SOAK_SYNTHETIC_FAIL_CLOSED_CONTRACT_BROKEN'
          }
          Write-Host 'SOAK_EIGHT_HOUR_ANALYZER_SYNTHETIC_PASS'

      - name: Verify disposable loopback TCP positive and negative controls
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase12_Continuous_Soak_READ_ONLY.ps1 -ProbeSelfTest 2>&1
          if($LASTEXITCODE -ne 0 -or ($out | Out-String) -notmatch 'SOAK_TCP_LOOPBACK_FIXTURE_PASS') {
            $out | ForEach-Object { Write-Host $_ }
            throw 'SOAK_EPHEMERAL_TCP_CONTROLS_FAILED'
          }
          Write-Host 'SOAK_EPHEMERAL_TCP_CONTROLS_PASS'

      - name: Confirm non-host runner cannot start live monitor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Runner has no GSC service; live preflight must fail before 8h run.
          $out = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase12_Continuous_Soak_READ_ONLY.ps1 -LivePreflight 2>&1
          if($LASTEXITCODE -eq 0){ throw 'SOAK_NON_HOST_PREFLIGHT_WRONGLY_PASSED' }
          $text = ($out | Out-String)
          if($text -notmatch 'REFUSE_NON_HOST_PC' -and $text -notmatch 'SOAK_HOST_SERVICE_NOT_RUNNING'){
            throw 'SOAK_NON_HOST_EXPECTED_ERROR_NOT_SEEN'
          }
          $global:LASTEXITCODE=0
          Write-Host 'SOAK_NON_HOST_RUNNER_VETO_PASS'

      - name: Assemble minimal operator READ-ONLY ZIP with manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP ('day12-soak-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          foreach($file in @('Day12_Phase12_Continuous_Soak_READ_ONLY.ps1',
                             'Start_Day12_8H_Soak_READ_ONLY.cmd',
                             'README-Day12-8H-STABLE-SOAK-KO.txt')) {
            Copy-Item -LiteralPath (Join-Path 'tools/day12' $file) -Destination $dir -ErrorAction Stop
          }
          $files = @(Get-ChildItem -LiteralPath $dir -File)
          if($files.Count -ne 3){throw 'SOAK_PACKAGE_FILE_COUNT_UNEXPECTED'}
          $zip = Join-Path $PWD 'Geumyi-Day12-8H-STABLE-Soak-READ-ONLY.zip'
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names=@($z.Entries | ForEach-Object {$_.FullName} | Sort-Object)
            $expected=@($files | ForEach-Object {$_.Name} | Sort-Object)
            if((Compare-Object $names $expected)){throw 'SOAK_ZIP_MANIFEST_MISMATCH'}
          } finally {$z.Dispose()}
          Write-Host 'SOAK_OPERATOR_ZIP_VERIFIED'
          Get-FileHash -LiteralPath $zip -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v7
        with:
          name: day12-stable-8h-readonly-operator-kit
          path: Geumyi-Day12-8H-STABLE-Soak-READ-ONLY.zip
          if-no-files-found: error
          retention-days: 30
