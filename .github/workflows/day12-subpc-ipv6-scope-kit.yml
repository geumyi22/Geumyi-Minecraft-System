name: Day12 SubPC IPv6 Scope Only ReadOnly Kit

on:
  push:
    branches: [main]
    paths:
      - 'tools/day12/Day12_Phase10_SubPC_IPv6_Scope_Only_READ_ONLY.ps1'
      - 'tools/day12/Day12_Phase10_SubPC_IPv6_Scope_Only_READ_ONLY.cmd'
      - 'DAY12-PHASE10-IPV6-SCOPE-FOLLOWUP-20261010.md'
      - '.github/workflows/day12-subpc-ipv6-scope-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Windows IPv6 link-local scope synthetic and read-only kit
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Parse IPv6-only script and verify no IPv4/production mutation
        shell: powershell
        run: |
          $src='tools/day12/Day12_Phase10_SubPC_IPv6_Scope_Only_READ_ONLY.ps1'
          $tok=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $src),[ref]$tok,[ref]$errors)
          if(@($errors).Count){
            $errors | ForEach-Object {Write-Host $_.ErrorId}
            throw 'IPv6-only SubPC script parse failure'
          }
          $content=Get-Content -LiteralPath $src -Raw
          foreach($bad in @('New-NetFirewallRule','Set-NetFirewallRule','Remove-NetFirewallRule',
            'Stop-Service','Restart-Service','Start-Service','Stop-Process','Remove-Item',
            'Get-NetTCPConnection','GetExtendedTcpTable','auditpol')){
            if($content -match [regex]::Escape($bad)){throw ('Prohibited live/TCP-table instruction '+$bad)}
          }
          $cmd=Get-Content 'tools/day12/Day12_Phase10_SubPC_IPv6_Scope_Only_READ_ONLY.cmd' -Raw
          if($cmd -notmatch 'powershell.exe.*Day12_Phase10_SubPC_IPv6_Scope_Only_READ_ONLY.ps1' -or
             $cmd -match '(?i)-NonInteractive'){
            throw 'Interactive IPv6-only launcher contract violated'
          }
      - name: No-network synthetic link-local scope tests and local-address refusal
        shell: powershell
        run: |
          $src='tools/day12/Day12_Phase10_SubPC_IPv6_Scope_Only_READ_ONLY.ps1'
          $out=Join-Path $env:RUNNER_TEMP 'geumyi-ipv6-only-synthetic'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $src -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'IPv6-only synthetic scope regression'}
          $r=Get-Content -LiteralPath (Join-Path $out 'Day12-IPv6-Scope-Synthetic.json') -Raw -Encoding UTF8|ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_PASS' -or !$r.synthetic -or !$r.read_only -or
             $r.ipv4_probes -ne 0 -or $r.ipv6_probes -ne 0 -or
             $r.mutation_performed -or $r.canonical_backend_ports_private -ne 'UNCHANGED_FAIL'){
            throw 'IPv6-only synthetic report contract failed'
          }
          $log=Join-Path $out 'invalid-loopback-err.txt'
          $bad=Start-Process powershell.exe -PassThru -Wait -NoNewWindow -RedirectStandardError $log -ArgumentList @(
            '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$src,
            '-TargetIPv6','::1','-OutputDir',$out)
          if($bad.ExitCode -eq 0){throw 'IPv6 loopback was accepted as remote target'}
          Write-Host 'IPv6-only script synthetic tests PASS; no actual server connections made'
      - name: Create limited read-only SubPC artifact and verify members
        shell: powershell
        run: |
          $folder=Join-Path $env:RUNNER_TEMP 'Geumyi-Day12-SubPC-IPv6-Scope-READ-ONLY'
          New-Item -ItemType Directory -Force -Path $folder|Out-Null
          Copy-Item 'tools/day12/Day12_Phase10_SubPC_IPv6_Scope_Only_READ_ONLY.ps1' $folder
          Copy-Item 'tools/day12/Day12_Phase10_SubPC_IPv6_Scope_Only_READ_ONLY.cmd' $folder
          Copy-Item 'DAY12-PHASE10-IPV6-SCOPE-FOLLOWUP-20261010.md' $folder
          [ordered]@{
            schema=1;role='SUBPC_ONLY';production_mutation='FORBIDDEN'
            ipv4_retest='FORBIDDEN';canonical_backend_ports_private='UNCHANGED_FAIL'
            files=@(Get-ChildItem $folder -File|Sort-Object Name|ForEach-Object{
              [ordered]@{file=$_.Name;sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
            })
          }|ConvertTo-Json -Depth 6|Set-Content -LiteralPath (Join-Path $folder 'SHA256-MANIFEST.json') -Encoding UTF8
          $zip='Geumyi-Day12-SubPC-IPv6-Scope-READ-ONLY.zip'
          Compress-Archive -Path (Join-Path $folder '*') -DestinationPath $zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try{
            $names=@($z.Entries | ForEach-Object {$_.FullName})
            if($names.Count -ne 4 -or
               $names -notcontains 'Day12_Phase10_SubPC_IPv6_Scope_Only_READ_ONLY.ps1' -or
               $names -notcontains 'Day12_Phase10_SubPC_IPv6_Scope_Only_READ_ONLY.cmd' -or
               $names -notcontains 'DAY12-PHASE10-IPV6-SCOPE-FOLLOWUP-20261010.md' -or
               $names -notcontains 'SHA256-MANIFEST.json'){
              throw 'Focused ZIP content verification failed'
            }
          }finally{$z.Dispose()}
          Write-Host 'IPv6-only verified SubPC archive ready'
      - uses: actions/upload-artifact@v7
        with:
          name: day12-subpc-ipv6-scope-readonly-kit
          path: Geumyi-Day12-SubPC-IPv6-Scope-READ-ONLY.zip
          retention-days: 30
