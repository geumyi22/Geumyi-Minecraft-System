name: GSC v4.5.2 Canary Velocity Plugin Prototype CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'Plugins/GeumyiVelocityBridge/**'
      - 'tools/velocity/Velocity_Compatibility_READ_ONLY.ps1'
      - 'tools/velocity/CI_Velocity420_Disabled_Runtime_Smoke.py'
      - 'tools/velocity/CI_Velocity420_Geyser_Floodgate_Smoke.py'
      - 'tools/velocity/CI_Velocity_Loopback_Probe.java'
      - 'tools/velocity/CI_Velocity_Localhost_ReadOnly_IPC.py'
      - 'tools/velocity/Velocity_GeyserFloodgate_READ_ONLY.ps1'
      - 'tools/velocity/Velocity_TaskPolicy_READ_ONLY.ps1'
      - 'tools/velocity/Run_Velocity_TaskPolicy_READ_ONLY.cmd'
      - 'tools/velocity/Velocity_TaskJvm_Event_READ_ONLY.ps1'
      - 'tools/velocity/Run_Velocity_TaskJvm_Event_READ_ONLY.cmd'
      - 'tools/velocity/Velocity_TaskInstance_COM_READ_ONLY.ps1'
      - 'tools/velocity/Run_Velocity_TaskInstance_COM_READ_ONLY.cmd'
      - 'tools/velocity/Velocity_PrincipalScope_READ_ONLY.ps1'
      - 'tools/velocity/Run_Velocity_PrincipalScope_READ_ONLY.cmd'
      - 'tools/velocity/Velocity_GSC_HostPrincipal_READ_ONLY.ps1'
      - 'tools/velocity/Run_Velocity_GSC_HostPrincipal_READ_ONLY.cmd'
      - 'tools/velocity/Run_GeyserFloodgate_READ_ONLY.cmd'
      - 'tools/velocity/ci/**'
      - '.github/workflows/velocity-bridge-disabled-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-native-pipe-interoperability:
    name: Windows JDK25 native pipe + protected DACL feasibility (CI ONLY)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and execute test-owned Java native Windows pipe client
        shell: powershell
        timeout-minutes: 3
        run: |
          $script='tools/velocity/ci/CI_JavaNativePipe_Interop.ps1'
          $tokens=$null; $issues=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $script),[ref]$tokens,[ref]$issues)
          if(@($issues).Count -ne 0){throw 'CI-only Windows Java pipe feasibility fixture syntax invalid'}
          & powershell.exe -NoProfile -NonInteractive -File $script
          if($LASTEXITCODE -ne 0){throw 'Java native Win32 pipe feasibility unverified: fail closed'}

  velocity-api-synthetic:
    name: Velocity API ${{ matrix.velocity_api }} compile-only (NO DEPLOY)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        velocity_api: ['4.2.0', '4.2.1-SNAPSHOT']
    steps:
      - name: Checkout exact proposal
        uses: actions/checkout@v4
      - name: JDK 25 compile target from PaperMC docs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Fail closed against runtime bridge activity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('Plugins/GeumyiVelocityBridge/src/main/java')
          sources=list(root.rglob('*.java'))
          entry=root/'kr/geumyi/velocitybridge/GeumyiVelocityBridge.java'
          allowed={
            'GeumyiVelocityBridge.java',
            'BridgeEnvelope.java',
            'AdmissionFence.java',
          }
          if len(sources)!=len(allowed) or {p.name for p in sources}!=allowed or not entry.exists():
            raise SystemExit('unexpected Velocity plugin source added without security review')
          forbidden=[
            '.shutdown(', '.getScheduler(', '.getCommandManager(', '.getEventManager(',
            'ServerSocket', 'Socket(', 'HttpServer', 'HttpClient', 'DatagramSocket',
            'Files.write', 'ProcessBuilder', 'Runtime.getRuntime()', 'System.exit(',
            'registerCommand(', '.register(', 'ProxyServer.shutdown(',
          ]
          for p in sources:
            source=p.read_text(encoding='utf-8')
            # Inspect executable source, not quoted security documentation;
            # comments are not runtime Java statements.
            source=re.sub(r'/\*[\s\S]*?\*/|//[^\n]*', '', source)
            for item in forbidden:
              if item in source:
                raise SystemExit(f'active lifecycle/IPC action forbidden in {p.name}: {item}')
          # The admission fence must stay unhooked: only the @Plugin class
          # can have Velocity event annotations or ProxyServer references.
          fence=(root/'kr/geumyi/velocitybridge/AdmissionFence.java').read_text(encoding='utf-8')
          if '@Subscribe' in fence or 'ProxyServer proxy' in fence or 'ProxyServer.shutdown(' in source:
            raise SystemExit('admission model was wired to a live Velocity event')
          source=entry.read_text()
          if '@Plugin(' not in source or 'onInitialize(ProxyInitializeEvent event)' not in source:
            raise SystemExit('not a recognized no-op Velocity plugin')
          print('All three allowlisted Java sources verified inert (static check only)')
          PY
      - name: Compile offline prototype and run Java tests
        run: gradle -p Plugins/GeumyiVelocityBridge clean test jar -PvelocityApiVersion=${{ matrix.velocity_api }} --no-daemon --stacktrace
      - name: Verify generated Velocity plugin metadata
        shell: bash
        run: |
          set -eu
          jarfile=$(find Plugins/GeumyiVelocityBridge/build/libs -name '*.jar' | head -n1)
          test -n "$jarfile"
          jar tf "$jarfile" | grep -Fx 'velocity-plugin.json'
          jar tf "$jarfile" | grep -Fx 'kr/geumyi/velocitybridge/GeumyiVelocityBridge.class'
          python3 - "$jarfile" <<'PY'
          import sys,zipfile,struct
          with zipfile.ZipFile(sys.argv[1]) as z:
            classes=[n for n in z.namelist() if n.endswith('.class')]
            if not classes: raise SystemExit('jar contains no plugin classes')
            for name in classes:
              header=z.read(name)[:8]
              if len(header)!=8 or header[:4]!=bytes.fromhex('cafebabe'):
                raise SystemExit('bad class file: '+name)
              major=struct.unpack('>H',header[6:8])[0]
              if major>69:
                raise SystemExit(f'{name} requires Java newer than 25: {major}')
            print(f'{len(classes)} plugin classes target Java 25 or older. Java 26 load remains untested.')
          PY
          echo "Isolated ${{ matrix.velocity_api }} class and metadata built (NOT installed or deployed)."
      - name: Run SHA-pinned official 4.2.0 in disposable CI folder (NO PRODUCTION)
        if: matrix.velocity_api == '4.2.0'
        shell: bash
        run: |
          set -euo pipefail
          plugin_jar=$(find Plugins/GeumyiVelocityBridge/build/libs -maxdepth 1 -name '*.jar' | head -n1)
          test -n "$plugin_jar"
          python3 tools/velocity/CI_Velocity420_Disabled_Runtime_Smoke.py "$plugin_jar"
      - name: Select Java 26 for separate disposable official 4.2.0 smoke
        if: matrix.velocity_api == '4.2.0'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
      - name: Validate Java 26 disabled plugin loading with same pinned binary
        if: matrix.velocity_api == '4.2.0'
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | grep -E 'version "26([.]|")'
          plugin_jar=$(find Plugins/GeumyiVelocityBridge/build/libs -maxdepth 1 -name '*.jar' | head -n1)
          test -n "$plugin_jar"
          python3 tools/velocity/CI_Velocity420_Disabled_Runtime_Smoke.py "$plugin_jar"
      - name: SHA-pinned operator-matched and reference Geyser/Floodgate co-loading (NO DEPLOY)
        if: matrix.velocity_api == '4.2.0'
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python3 -m py_compile tools/velocity/CI_Velocity420_Geyser_Floodgate_Smoke.py
          plugin_jar=$(find Plugins/GeumyiVelocityBridge/build/libs -maxdepth 1 -name '*.jar' | head -n1)
          test -n "$plugin_jar"
          docker pull eclipse-temurin:26-jre
          python3 tools/velocity/CI_Velocity420_Geyser_Floodgate_Smoke.py "$plugin_jar" operator
          python3 tools/velocity/CI_Velocity420_Geyser_Floodgate_Smoke.py "$plugin_jar" reference


  velocity-localhost-ipc-fixture:
    name: Ephemeral local-only signed status IPC (NO CONTROL)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact proposal
        uses: actions/checkout@v4
      - name: Static script parse and localhost-only status contract test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/velocity/CI_Velocity_Localhost_ReadOnly_IPC.py
          python3 -m py_compile tools/velocity/CI_Velocity420_Geyser_Floodgate_Smoke.py
          python3 -m py_compile tools/velocity/CI_Velocity420_Disabled_Runtime_Smoke.py
          python3 tools/velocity/CI_Velocity_Localhost_ReadOnly_IPC.py

  velocity-compatibility-synthetic:
    name: Windows version fingerprint collector synthetic (NO LIVE TASKS)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse and execute synthetic collector without OS target probing
        shell: powershell
        run: |
          $file='tools/velocity/Velocity_Compatibility_READ_ONLY.ps1'
          $tokens=$null; $issues=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file),[ref]$tokens,[ref]$issues)
          if(@($issues).Count -gt 0){throw 'PowerShell parser rejected read-only version collector'}
          $raw = (& powershell.exe -NoProfile -NonInteractive -File $file -Synthetic | Out-String)
          $result = $raw | ConvertFrom-Json
          if($result.schema -ne 1 -or @($result.instances).Count -ne 3 -or
            $result.host_state_changed -ne $false -or
            $result.runtime_api_compatibility_verified -ne $false -or
            $result.result -ne 'SYNTHETIC_STRUCTURE_PASS_NOT_LIVE'){
            throw 'synthetic fingerprint collector contract failed'
          }
          Write-Host 'Read-only synthetic version collector 3/3 PASS (NOT REAL HOST)'
      - name: Parse and exercise Geyser-Floodgate READ-ONLY fixture
        shell: powershell
        run: |
          $file='tools/velocity/Velocity_GeyserFloodgate_READ_ONLY.ps1'
          $tokens=$null; $issues=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file),[ref]$tokens,[ref]$issues)
          if(@($issues).Count -gt 0){throw 'Geyser/Floodgate inspector PowerShell parse rejected'}
          $result = (& powershell.exe -NoProfile -NonInteractive -File $file -Synthetic | Out-String) | ConvertFrom-Json
          if($result.schema -ne 1 -or @($result.instances).Count -ne 3 -or
            $result.host_state_changed -ne $false -or
            $result.actual_plugin_loading_verified -ne $false -or
            $result.result -ne 'SYNTHETIC_STRUCTURE_PASS_NOT_LIVE'){
            throw 'Geyser/Floodgate synthetic schema or fail-closed state rejected'
          }
          foreach($entry in $result.instances){
            if(@($entry.jars).Count -ne 2){throw 'Expected two fake plugin entries'}
          }
          Write-Host 'Geyser/Floodgate read-only fixture 3x2 PASS (NOT LIVE)'
      - name: Parse and validate Velocity Task Scheduler READ-ONLY synthetic policy
        shell: powershell
        run: |
          $path='tools/velocity/Velocity_TaskPolicy_READ_ONLY.ps1'
          $tokens=$null; $issues=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path),[ref]$tokens,[ref]$issues)
          if(@($issues).Count -gt 0){throw 'TaskPolicy read-only script failed PowerShell 5.1 syntax'}
          $result = (& powershell.exe -NoProfile -NonInteractive -File $path -Synthetic | Out-String) | ConvertFrom-Json
          if($result.schema -ne 1 -or @($result.instances).Count -ne 3 -or
            $result.result -ne 'SYNTHETIC_AUTO_RESPAWN_RISK_NOT_LIVE' -or
            $result.server_state_changed -ne $false -or $result.scheduled_task_modified -ne $false -or
            $result.live_control_authorized -ne $false -or $result.read_only -ne $true) {
            throw 'Synthetic TaskPolicy collector did not stay fail-closed'
          }
          foreach($item in $result.instances) {
            if($item.restart_count -ne 999 -or $item.multiple_instance_policy -ne 'IgnoreNew' -or
              $item.task_to_jvm_identity_verified -ne $false -or $item.live_control_authorized -ne $false) {
              throw 'Synthetic TaskPolicy auto-restart hazard not safely classified'
            }
          }
          Write-Host '3x TaskPolicy synthetic auto-restart hazard PASS (NOT LIVE)'
      - name: Parse and exercise Task-JVM event correlation read-only synthetic fixture
        shell: powershell
        run: |
          $file='tools/velocity/Velocity_TaskJvm_Event_READ_ONLY.ps1'
          $tokens=$null; $issues=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file),[ref]$tokens,[ref]$issues)
          if(@($issues).Count -gt 0){throw 'Read-only Task-JVM event inspector has PowerShell syntax errors'}
          $raw = (& powershell.exe -NoProfile -NonInteractive -File $file -Synthetic | Out-String)
          $result=$raw | ConvertFrom-Json
          if($result.schema -ne 1 -or
            $result.kind -ne 'GEUMYI_GSC_452_VELOCITY_TASK_PROCESS_EVENT_READ_ONLY' -or
            $result.result -ne 'SYNTHETIC_SHAPE_PASS_NEVER_LIVE' -or
            @($result.instances).Count -ne 3 -or
            $result.source_authenticated -ne $false -or
            $result.live_control_authorized -ne $false -or
            $result.server_state_changed -ne $false -or
            $result.task_state_modified -ne $false -or
            $result.audit_log_settings_changed -ne $false) {
            throw 'Read-only Task-JVM event output breached NO-GO synthetic contract'
          }
          $ids=@($result.instances | ForEach-Object { $_.id })
          if(($ids -join ',') -ne 'wild,playground,other'){throw 'Wrong fixed target order'}
          foreach($entry in $result.instances){
            if($entry.reliable_task_to_jvm_identity_verified -ne $false -or
              $entry.live_control_authorized -ne $false -or
              $entry.result -ne 'SYNTHETIC_EVENT_CANNOT_PROVE_IDENTITY'){
              throw 'Synthetic event record was promoted to execution proof'
            }
          }
          if($result.event_log_state -ne 'ENABLED' -or
            $result.event129_query_status -ne 'HAS_EVENTS' -or
            $result.event129_window_hours -ne 48 -or
            $result.event129_scan_capped -ne $false){
            throw 'Synthetic event log diagnostics invalid'
          }
          if($raw -match '(?i)parent_pid|child_pid|processid|commandline|executablepath'){
            throw 'Read-only synthetic JSON disclosed forbidden process metadata'
          }
          # The operator's real 2026-10-18 sample had no Task Scheduler 129
          # events. Even a healthy Java/UDP parent-child hint is NOT task
          # identity proof or live authorization.
          $missingRaw = (& powershell.exe -NoProfile -NonInteractive -File $file -Synthetic -SyntheticCase NoEvent | Out-String)
          $missing = $missingRaw | ConvertFrom-Json
          if($missing.synthetic -ne $true -or
            $missing.event129_query_status -ne 'NO_MATCHES_48H' -or
            @($missing.instances).Count -ne 3 -or
            $missing.source_authenticated -ne $false -or
            $missing.live_control_authorized -ne $false -or
            $missing.task_state_modified -ne $false -or
            $missing.audit_log_settings_changed -ne $false) {
            throw 'No-event synthetic test promoted incomplete evidence'
          }
          foreach($entry in $missing.instances){
            if($entry.task_event129_found -ne $false -or
              $entry.udp_java_pair_hint -ne $true -or
              $entry.reliable_task_to_jvm_identity_verified -ne $false -or
              $entry.live_control_authorized -ne $false -or
              $entry.result -ne 'SYNTHETIC_NO_EVENT_JAVA_PAIR_NEVER_ATTESTED') {
              throw 'Healthy UDP/Java pair was falsely treated as task ownership'
            }
          }
          if($missingRaw -match '(?i)parent_pid|child_pid|processid|commandline|executablepath'){
            throw 'No-event synthetic JSON leaked process metadata'
          }
          Write-Host 'Task-JVM event and missing-event NO-GO fixtures PASS (NOT LIVE)'
      - name: Validate event-log-independent COM instance hint collector synthetic
        shell: powershell
        run: |
          $file='tools/velocity/Velocity_TaskInstance_COM_READ_ONLY.ps1'
          $tokens=$null; $issues=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file),[ref]$tokens,[ref]$issues)
          if(@($issues).Count -gt 0){throw 'COM instance read-only script syntax error'}
          $source=Get-Content -LiteralPath $file -Raw
          # Scan actual PowerShell command invocations rather than forbidding
          # legitimate words in explanatory security comments.
          if($source -match '(?im)^\s*(?:Start-Process|Stop-Process|Start-ScheduledTask|Stop-ScheduledTask|Register-ScheduledTask|Unregister-ScheduledTask|Set-ScheduledTask|Enable-ScheduledTask|Set-WinEvent|wevtutil)\b'){
            throw 'Forbidden task/process/log mutation command in read-only inspector'
          }
          foreach($scenario in @('MatchingHint','NoVisibility','Ambiguous')){
            $raw=(& powershell.exe -NoProfile -NonInteractive -File $file -Synthetic -SyntheticCase $scenario | Out-String)
            $x=$raw|ConvertFrom-Json
            if($x.schema -ne 1 -or $x.synthetic -ne $true -or
              $x.kind -ne 'GEUMYI_GSC_452_VELOCITY_TASK_INSTANCE_COM_READ_ONLY' -or
              $x.result -ne 'SYNTHETIC_NO_GO_FIXTURE_PASS' -or
              $x.source_authenticated -ne $false -or
              $x.live_control_authorized -ne $false -or
              $x.server_state_changed -ne $false -or
              $x.task_state_modified -ne $false -or
              $x.audit_log_settings_changed -ne $false -or
              $x.privilege_elevation_attempted -ne $false -or
              @($x.instances).Count -ne 3){
              throw 'COM inspector synthetic security contract failed'
            }
            if((@($x.instances | ForEach-Object {$_.id}) -join ',') -ne 'wild,playground,other'){
              throw 'Unexpected task IDs in COM inspector'
            }
            foreach($item in $x.instances){
              if($item.reliable_task_to_jvm_identity_verified -ne $false -or
                $item.live_control_authorized -ne $false -or
                $item.safe_to_start -ne $false -or
                $item.safe_to_stop -ne $false -or
                $item.safe_to_restart -ne $false){
                throw 'COM engine PID synthetic hint illegally promoted to live authority'
              }
              if($scenario -eq 'MatchingHint' -and
                ($item.instance_to_jvm_suggestive -ne $true -or
                $item.engine_pid_matches_java_parent -ne $true)){
                throw 'Synthetic engine-match hint was not exercised'
              }
              if($scenario -eq 'NoVisibility' -and
                ($item.instance_query_status -ne 'NO_VISIBLE_INSTANCE' -or
                $item.udp_java_pair_hint -ne $true)){
                throw 'Synthetic low-rights visibility path not exercised'
              }
              if($scenario -eq 'Ambiguous' -and
                ($item.instance_query_status -ne 'MULTIPLE_VISIBLE' -or
                $item.visible_instance_count -ne 2)){
                throw 'Synthetic multi-instance path not exercised'
              }
            }
            if($raw -match '(?i)parent_pid|child_pid|processid|commandline|executablepath|instanceguid|user(name)?|key.pem'){
              throw 'Synthetic JSON exposed OS details'
            }
          }
          Write-Host 'COM Task Scheduler 3-case read-only NO-GO fixture PASS (NOT HOST)'

      - name: Validate sanitized Windows principal-scope schema (SYNTHETIC ONLY)
        shell: powershell
        run: |
          $file='tools/velocity/Velocity_PrincipalScope_READ_ONLY.ps1'
          $tokens=$null; $issues=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file),[ref]$tokens,[ref]$issues)
          if(@($issues).Count -gt 0) {
            $issues|ForEach-Object {Write-Host ('PS syntax issue: '+$_.ErrorId)}
            throw 'PowerShell 5.1 principal-scope collector syntax invalid'
          }
          $source=Get-Content -LiteralPath $file -Raw
          if($source -match '(?im)^\s*(?:Start-Process|Stop-Process|Start-ScheduledTask|Stop-ScheduledTask|Set-ScheduledTask|Register-ScheduledTask|Enable-ScheduledTask|wevtutil|icacls|netsh)\b'){
            throw 'Prohibited live mutation command in principal-scope collector'
          }
          $raw=(& powershell.exe -NoProfile -NonInteractive -File $file -Synthetic | Out-String)
          $record=$raw|ConvertFrom-Json
          if($record.schema -ne 1 -or
            $record.kind -ne 'GEUMYI_GSC_452_VELOCITY_WINDOWS_PRINCIPAL_SCOPE_READ_ONLY' -or
            $record.result -ne 'SYNTHETIC_SCHEMA_ONLY_NO_GO' -or
            $record.synthetic -ne $true -or $record.read_only -ne $true -or
            $record.live_control_authorized -ne $false -or
            $record.source_authenticated -ne $false -or
            $record.server_state_changed -ne $false -or
            $record.task_state_modified -ne $false -or
            $record.acl_modified -ne $false -or
            $record.dpapi_access_attempted -ne $false -or
            $record.privilege_elevation_attempted -ne $false -or
            $record.audit_log_settings_changed -ne $false -or
            @($record.instances).Count -ne 3){
            throw 'Read-only principal-scope fixture breached safety contract'
          }
          if((@($record.instances | ForEach-Object { $_.id }) -join ',') -ne 'wild,playground,other'){
            throw 'Unknown principal-scope target'
          }
          foreach($item in $record.instances){
            if($item.reliable_task_to_jvm_identity_verified -ne $false -or
              $item.dpapi_cross_process_compatibility_verified -ne $false -or
              $item.live_control_authorized -ne $false -or
              $item.task_principal_vs_udp_java_owner -ne 'MATCH' -or
              $item.java_parent_and_child_same_owner -ne 'MATCH'){
              throw 'Synthetic account coincidence promoted to live authorization'
            }
          }
          if($raw -match '(?i)"(?:sid|pid|processid|username|task_command|key|secret|password|path)"\s*:'){
            throw 'Sanitized fixture disclosed forbidden OS identity data'
          }
          Write-Host '3x synthetic principal relationship NO-GO contracts PASS'

      - name: Validate read-only GSC host vs task principal matrix (synthetic)
        shell: powershell
        run: |
          $file='tools/velocity/Velocity_GSC_HostPrincipal_READ_ONLY.ps1'
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file),[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0){throw 'Host principal collector PowerShell syntax invalid'}
          $source=Get-Content -LiteralPath $file -Raw
          if($source -match '(?im)^\s*(?:Start-Process|Stop-Process|Start-ScheduledTask|Stop-ScheduledTask|Set-ScheduledTask|Register-ScheduledTask|Enable-ScheduledTask|wevtutil|icacls|netsh)\b'){
            throw 'Host principal collector attempts a forbidden mutation'
          }
          foreach($scenario in @('HostDifferent','HostSame','NoHost','MultipleHosts')){
            $raw=(& powershell.exe -NoProfile -NonInteractive -File $file -Synthetic -SyntheticCase $scenario | Out-String)
            if($LASTEXITCODE -ne 0){throw 'Host principal synthetic execution failed'}
            $r=$raw|ConvertFrom-Json
            if($r.schema -ne 1 -or $r.synthetic -ne $true -or
              $r.kind -ne 'GEUMYI_GSC_452_HOST_RUNTIME_PRINCIPAL_READ_ONLY' -or
              $r.result -ne 'SYNTHETIC_HOST_SCHEMA_NO_GO' -or
              $r.read_only -ne $true -or $r.source_authenticated -ne $false -or
              $r.server_state_changed -ne $false -or
              $r.task_state_modified -ne $false -or $r.acl_modified -ne $false -or
              $r.dpapi_access_attempted -ne $false -or
              $r.event_log_settings_changed -ne $false -or
              $r.privilege_elevation_attempted -ne $false -or
              $r.host_executable_identity_verified -ne $false -or
              $r.gsc_service_runtime_attested -ne $false -or
              $r.live_control_authorized -ne $false -or
              @($r.instances).Count -ne 3){
              throw 'Synthetic host account relationship violated NO-GO contract'
            }
            $expectedCount=if($scenario -eq 'NoHost'){'NONE'}elseif($scenario -eq 'MultipleHosts'){'MULTIPLE'}else{'ONE'}
            $expectedRelation=if($scenario -eq 'HostSame'){'MATCH'}elseif($scenario -eq 'HostDifferent'){'DIFFERENT'}else{'UNKNOWN'}
            if($r.gsc_host_process_count_category -ne $expectedCount -or
              $r.collector_vs_host -ne $expectedRelation){
              throw 'Host process visibility and SID comparisons not scoped'
            }
            if((@($r.instances | ForEach-Object {$_.id}) -join ',') -ne 'wild,playground,other'){
              throw 'Unknown task identity in GSC host relationship report'
            }
            foreach($target in $r.instances){
              if($target.host_vs_task_principal -ne $expectedRelation -or
                $target.trusted_process_identity_verified -ne $false -or
                $target.dpapi_compatible -ne $false -or
                $target.live_control_authorized -ne $false){
                throw 'Synthetic account relation was falsely used as authorization'
              }
            }
            if($raw -match '(?i)"(?:sid|pid|processid|username|task_command|key|secret|password|path)"\s*:'){
              throw 'Sensitive identity value in sanitized report'
            }
          }
          Write-Host 'GSC host account 4-case NO-GO fixture PASS (no real OS probe)'

