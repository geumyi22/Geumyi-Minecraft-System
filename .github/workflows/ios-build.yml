name: Build GSCM iOS unsigned IPA
# Day 7: upload only the final IPA and checksum.

on:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - 'GSCM/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'GSCM/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gscm-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(awk '/^version:/ {print $2; exit}' GSCM/pubspec.yaml)"
          NAME="${FULL%%+*}"
          BUILD="${FULL##*+}"
          test -n "$NAME"
          test -n "$BUILD"
          echo "version_full=$FULL" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Install Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          ruby --version

      - name: Restore GSCM source
        shell: bash
        run: |
          set -euo pipefail
          cp -R GSCM app
          cd app
          test -f pubspec.yaml
          test -f tool/ios/patch_ios.sh

      - name: Prepare iOS Runner
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          chmod +x tool/ios/patch_ios.sh
          ./tool/ios/patch_ios.sh

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build iOS release without signing
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        working-directory: app
        env:
          VERSION_FULL: ${{ steps.version.outputs.version_full }}
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          rm -rf dist
          mkdir -p dist/Payload
          ditto build/ios/iphoneos/Runner.app dist/Payload/Runner.app
          (
            cd dist
            FILE="GSCM-v${VERSION_FULL}-unsigned.ipa"
            /usr/bin/zip -qry "$FILE" Payload
            /usr/bin/shasum -a 256 "$FILE" > "$FILE.sha256"
          )
          rm -rf dist/Payload
          ls -lh dist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSCM-${{ steps.version.outputs.version_name }}-build${{ steps.version.outputs.build_number }}-iOS-unsigned
          path: |
            app/dist/*.ipa
            app/dist/*.ipa.sha256
          if-no-files-found: error
          retention-days: 14
