name: Day12 Phase6 Release Chain Source Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/day12-phase6-release-chain-audit.yml'
      - 'tools/day12/audit_phase6_release_chain.py'
      - '.github/workflows/day12-final-release.yml'
      - '.github/workflows/day12-final-gate.yml'
      - 'FINAL-RELEASE-GATES.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/day12/audit_phase6_release_chain.py
