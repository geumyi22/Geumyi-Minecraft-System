name: Day12 GSC Host RC4 Preview (UNSIGNED — DO NOT INSTALL)

# Distinct versioned CI-only preview. NEVER publish or install this unsigned artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/day12-gsc-host-rc4-preview.yml'
      - 'tools/day12/Build_Day12_GSC_Host_RC4_CI.ps1'
      - 'tools/day12/Test_Day12_GSC_Host_RC4_AutoRollback_Disposable_CI.ps1'

permissions:
  contents: read
  actions: read

concurrency:
  group: day12-gsc-guard-host-rc4-preview
  cancel-in-progress: false

jobs:
  baseline:
    name: Require verified baseline dependencies and GSC tests
    uses: ./.github/workflows/system-ci.yml

  preview:
    name: Build distinct 4.3.9-rc.4 preview in disposable Windows CI
    needs: baseline
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GEUMYI_GSC_RC_STAGE: isolated_ci_review_only
    steps:
      - name: Checkout (read-only GitHub source)
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: GSC/ServerCenter/go.mod
          cache: false
      - name: Download verified StatusAgent / GDS / GST payload dependencies
        uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: ci-deps
      - name: Restore exactly three verified GSC installer plugin payloads
        shell: pwsh
        run: |
          $dest='GSC/ServerCenter/cmd/setup/payload'
          $m=@(
            @('statusagent-0.5.4','GeumyiStatusAgent-0.5.4.jar'),
            @('gds-1.1.1','GeumyiDiscordStatus-1.1.1-SpigotPaper26.3.jar'),
            @('gst-1.1.1-hotfix','GeumyiServerTools-1.1.1-SpigotPaper26.3-GSCv4.1-HOTFIX.jar')
          )
          foreach($entry in $m){
            $source=Join-Path (Join-Path 'ci-deps' $entry[0]) $entry[1]
            if(-not (Test-Path -LiteralPath $source)){throw ('missing previously built dependency: '+$entry[0])}
            Copy-Item -LiteralPath $source -Destination (Join-Path $dest $entry[1]) -ErrorAction Stop
          }
      - name: Parse isolated preview builder
        shell: pwsh
        run: |
          $errors=$null; $tokens=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/day12/Build_Day12_GSC_Host_RC4_CI.ps1'),
            [ref]$tokens,[ref]$errors)
          if(@($errors).Count){throw 'RC builder syntax failed'}
      - name: CI-only 4.3.9-rc.4 Go unit, installer build, host selftest and SHA256
        shell: pwsh
        run: |
          & ./tools/day12/Build_Day12_GSC_Host_RC4_CI.ps1 -OutputDir candidate-output
          if($LASTEXITCODE -ne 0){throw 'RC preview builder failed'}
          $m=Get-Content -LiteralPath candidate-output/RC-METADATA.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if($m.candidate_version -ne '4.3.9-rc.4' -or !$m.review_only -or !$m.unsigned -or
             !$m.go_test_pass -or !$m.day10_host_selftest_pass -or $m.operator_install_approved -or
             $m.production_host_modified -or $m.stable_published -or
             $m.backend_ports_private -ne 'UNCHANGED_FAIL'){
            throw 'Versioned review-only RC metadata contract invalid'
          }
          $files=@('GeumyiServerCenter-v4.3.9-rc.4-Setup.exe',
                   'GeumyiServerHost-v4.3.9-rc.4.exe',
                   'GeumyiServerCenter-v4.3.9-rc.4.exe',
                   'RC-METADATA.json','DO-NOT-INSTALL-README.txt')
          foreach($n in $files){
            if(-not (Test-Path -LiteralPath "candidate-output/$n")){throw "RC output missing: $n"}
          }
          $sha=Get-Content candidate-output/SHA256SUMS.txt -Encoding ascii
          if(@($sha).Count -ne 5){throw 'Missing RC SHA256 entries'}
          foreach($row in $sha){
            if($row -notmatch '^([0-9a-f]{64})  (.+)$'){throw 'Invalid RC checksum format'}
            $actual=(Get-FileHash -LiteralPath ("candidate-output/"+$Matches[2]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if($actual -ne $Matches[1]){throw 'RC content digest mismatch'}
          }
      - name: Ensure original main source was not re-versioned
        shell: pwsh
        run: |
          git diff --exit-code -- 'GSC/ServerCenter'
          if($LASTEXITCODE -ne 0){throw 'RC preview modified tracked 4.3.8 source'}
      - name: Archive UNSIGNED review-only candidate (not Stable, never published)
        uses: actions/upload-artifact@v7
        with:
          name: gsc-4.3.9-rc.4-UNSIGNED-DO-NOT-INSTALL
          path: candidate-output/*
          if-no-files-found: error
          retention-days: 14

  auto-rollback:
    name: Real service failed-update auto-rollback (disposable Windows only)
    needs: preview
    runs-on: windows-latest
    timeout-minutes: 16
    env:
      GEUMYI_GSC_RC_STAGE: isolated_ci_host_service
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Download this run's pinned RC4 preview
        uses: actions/download-artifact@v8
        with:
          name: gsc-4.3.9-rc.4-UNSIGNED-DO-NOT-INSTALL
          path: candidate-output
      - name: Ensure script is valid Windows PowerShell
        shell: pwsh
        run: |
          $p='tools/day12/Test_Day12_GSC_Host_RC4_AutoRollback_Disposable_CI.ps1'
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0){$errors|ForEach-Object{Write-Host $_.ErrorId};throw 'Invalid CI rollback script'}
      - name: Run actual Host RC4 Setup; force stale-service health and verify automatic rollback
        shell: pwsh
        run: |
          & ./tools/day12/Test_Day12_GSC_Host_RC4_AutoRollback_Disposable_CI.ps1 -CandidateDir candidate-output
          if($LASTEXITCODE -ne 0){throw 'Failed isolated Host rollback run'}
          $p=Join-Path $env:RUNNER_TEMP 'Day12-GSC-Host-RC4-AutoRollback-Report.json'
          if(-not (Test-Path -LiteralPath $p)){throw 'Missing rollback evidence'}
          $r=Get-Content $p -Raw -Encoding UTF8|ConvertFrom-Json
          if($r.result -ne 'DISPOSABLE_RC4_HOST_AUTOMATIC_ROLLBACK_PASS' -or
             !$r.official_host_sha_verified -or !$r.service_health_438_before -or
             !$r.stale_health_caused_update_rejection -or !$r.automatic_rollback_reported -or
             !$r.original_host_restored_sha -or !$r.original_backup_verified_sha -or
             !$r.new_setup_removed -or !$r.service_health_438_after -or
             !$r.no_update_lock_residue -or !$r.service_removed -or !$r.registry_removed -or
             $r.production_host_modified -or $r.production_network_modified -or
             $r.game_servers_started -or $r.backend_ports_private -ne 'UNCHANGED_FAIL'){
            throw 'Automatic Host rollback verification contract failed'
          }
      - name: Save sanitized fail-closed report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: day12-gsc-host-rc4-automatic-rollback-report
          path: ${{ runner.temp }}/Day12-GSC-Host-RC4-AutoRollback-Report.json
          if-no-files-found: warn
          retention-days: 14
