name: Publish Geumyi System Release

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Direct HTTPS URL to the current master bundle
        required: true
        type: string
      tag:
        description: Release tag (leave blank to use release-tag.txt)
        required: false
        type: string
      sha256:
        description: Expected SHA-256 (leave blank to use release-sha256.txt)
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release metadata
        id: meta
        shell: bash
        env:
          INPUT_SOURCE: ${{ inputs.source_url }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SHA: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          SOURCE="$INPUT_SOURCE"
          TAG="$INPUT_TAG"
          SHA="$INPUT_SHA"

          if [ -z "$TAG" ]; then
            TAG="$(tr -d '\r\n' < release-tag.txt)"
          fi
          if [ -z "$SHA" ]; then
            SHA="$(tr -d '\r\n' < release-sha256.txt)"
          fi

          test -n "$SOURCE"
          test -n "$TAG"
          test -n "$SHA"

          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Download master bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "${{ steps.meta.outputs.source }}" -o MC_LATEST.zip
          echo "${{ steps.meta.outputs.sha }}  MC_LATEST.zip" | sha256sum -c -

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpack dist extra
          unzip -q MC_LATEST.zip -d unpack
          cp MC_LATEST.zip dist/MC_LATEST_2026-09-26_v3_FINAL.zip

          find unpack -type f \( -name '*.zip' -o -name '*.jar' \) -print0 |
            while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              cp "$f" "dist/$base"
            done

          BUILDER="$(find unpack -type f -name 'GSCM_v1.1.2_Android_Builder_CLEAN.zip' | head -n1 || true)"
          if [ -n "$BUILDER" ]; then
            mkdir -p extra/gscm
            unzip -q "$BUILDER" -d extra/gscm
            find extra/gscm -type f \( -name '*.apk' -o -name '*.ipa' \) -exec cp {} dist/ \;
          fi

          GSC="$(find unpack -type f -name 'GeumyiServerCenter_FINAL_v4.2.3.zip' | head -n1 || true)"
          if [ -n "$GSC" ]; then
            mkdir -p extra/gsc
            unzip -q "$GSC" -d extra/gsc
            find extra/gsc -type f -name 'GeumyiServerCenter-v4.2.3-Setup.exe' -exec cp {} dist/ \;
          fi

          (cd dist && sha256sum * > SHA256SUMS.txt)

          echo "Assets:"
          ls -lh dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'EOF'
          Geumyi Minecraft System current baseline.

          - Paper 26.3
          - GSC 4.2.3
          - StatusAgent 0.5.4
          - GSCM 1.1.2+112
          - GST 1.1.1 HOTFIX
          - GDS 1.1.1
          - Technology 0.1.3
          - Chemistry 0.4.1

          Large distributable binaries are attached as release assets.
          Source/configuration documentation remains in the repository.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "MC Latest 2026-09-26 v3" \
              --notes-file RELEASE_NOTES.md
          fi
