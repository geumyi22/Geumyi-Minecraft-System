name: Velocity console candidate QA

on:
  push:
    branches: [feature/velocity-console-20261115]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velocity-console-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-review:
    name: Export tracked source only (no production files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export exact source for offline review
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate-review
          git rev-parse HEAD > candidate-review/SOURCE-COMMIT.txt
          git archive --format=zip --output=candidate-review/source.zip HEAD GSC/ServerCenter Plugins/GSCVelocityControl tools/gsc5 tools/release .github/workflows deploy FINAL-RELEASE-GATES.json
          (cd candidate-review && sha256sum source.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: velocity-console-source-review
          path: candidate-review/*
          retention-days: 7
          if-no-files-found: error
