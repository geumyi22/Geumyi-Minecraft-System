name: Day12 Cloud Recovery Safe Preflight Kit

on:
  pull_request:
    paths:
      - 'tools/day12/cloud/**'
      - '.github/workflows/day12-cloud-recovery-preflight-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cloud-preflight:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Strict parse Windows PowerShell 5.1 and inspect v4 no-write contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tool='tools/day12/cloud/Day12_Cloud_Recovery_Preflight_READ_ONLY.ps1'
          $cmd='tools/day12/cloud/RUN_Day12_Cloud_Recovery_Preflight_READ_ONLY.cmd'
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $tool).Path,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0){throw 'CLOUD_PREFLIGHT_POWERSHELL_PARSE_FAILED'}
          $s=Get-Content -LiteralPath $tool -Raw -Encoding UTF8
          foreach($required in @('cloud_upload_performed=$false',
                                   'server_backup_deleted_or_created=$false',
                                   'world_consistency_proven=$false',
                                   'server_root_paths_exported=$false',
                                   'OneDriveCommercial','GoogleDriveFS','diagnostic_version=4',
                                   'AllowAutoRedirect=$false','REGISTRY_SYNC_ROOT','SHELL_KNOWN_FOLDER')){
            if(-not $s.Contains($required)){throw ('CLOUD_GUARD_MISSING='+$required)}
          }
          if(-not (Test-Path -LiteralPath $cmd)){throw 'CLOUD_CMD_MISSING'}
          $test='tools/day12/cloud/Test_Cloud_Preflight_V4.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $test).Path,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0){throw 'V4_TEST_PARSE_FAILED'}
          if((Get-Content -LiteralPath $test -Raw) -notmatch 'CLOUD_PREFLIGHT_V4_WINDOWS_PATH_PRIVACY_PASS'){
            throw 'V4_TEST_PASS_MARKER_MISSING'
          }
          Write-Host 'CLOUD_PREFLIGHT_SOURCE_PARSE_PASS'

      - name: Synthetic positive and negative path-policy fixtures
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/cloud/Day12_Cloud_Recovery_Preflight_READ_ONLY.ps1 -Synthetic)
          if($LASTEXITCODE -ne 0 -or ($out | Out-String) -notmatch 'CLOUD_PREFLIGHT_SYNTHETIC_PASS'){
            $out | ForEach-Object { Write-Host $_ }
            throw 'CLOUD_PREFLIGHT_SYNTHETIC_FAILED'
          }
          $txt=($out|Out-String)
          $begin=$txt.IndexOf('{')
          if($begin -lt 0){throw 'CLOUD_SYNTHETIC_JSON_MISSING'}
          $j=$txt.Substring($begin)|ConvertFrom-Json
          if($j.diagnostic_version -ne 4 -or $j.schema -ne 2 -or
             $j.result -ne 'DESTINATIONS_AND_SOURCE_DISCOVERED_REVIEW_REQUIRED' -or
             -not $j.synthetic -or -not $j.read_only -or
             $j.checks.active_server_roots_found -ne 3 -or
             $j.checks.provider_folder_identity_proven -or
             $j.checks.actual_cloud_free_quota_verified -or
             $j.checks.actual_cloud_upload_verified -or
             $j.checks.cloud_backup_created -or
             $j.checks.restore_test_passed -or
             $j.checks.stable_release_allowed -or
             $j.cloud_upload_performed -or
             $j.service_world_network_acl_firewall_changed){
            throw 'CLOUD_READ_ONLY_FAIL_CLOSED_REPORT_BROKEN'
          }
          Write-Host 'CLOUD_SYNTHETIC_POSITIVE_NEGATIVE_PASS'

      - name: Windows PowerShell 7 v4 path and privacy regression
        shell: pwsh
        run: |
          $out=@(& pwsh -NoProfile -NonInteractive -File tools/day12/cloud/Day12_Cloud_Recovery_Preflight_READ_ONLY.ps1 -Synthetic)
          if($LASTEXITCODE -ne 0 -or ($out|Out-String) -notmatch 'CLOUD_PREFLIGHT_V4_WINDOWS_PATH_PRIVACY_PASS'){
            throw 'V4_PWSH_REGRESSION_FAILED'
          }

      - name: Hosted Windows runner remains discovery-blocked
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $global:LASTEXITCODE=0
          $ErrorActionPreference='Continue'
          $dir=Join-Path $env:RUNNER_TEMP ('v4-nonhost-'+[guid]::NewGuid().ToString('N'))
          $output=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/cloud/Day12_Cloud_Recovery_Preflight_READ_ONLY.ps1 -OutputDir $dir 2>&1)
          $exitCode=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          # Hosted Windows runner cannot have a private GSC config, GoogleDriveFS
          # and OneDrive in an authenticated user's session. Its report can only
          # be BLOCKED. A runtime failure is a test failure, never a backup PASS.
          if($exitCode -ne 0){throw 'V4_NONHOST_DIAGNOSTIC_RUNTIME_FAILED'}
          if($exitCode -eq 0){
            $arr=@($output|ForEach-Object{[string]$_})
            $line=($arr|Where-Object{$_ -match '^Send ONLY:'}|Select-Object -Last 1)
            if(-not $line){throw 'CLOUD_NONHOST_MISSING_REPORT'}
            $jsonPath=($line -replace '^Send ONLY:\s*','')
            $j=Get-Content -LiteralPath $jsonPath -Raw -Encoding UTF8|ConvertFrom-Json
            if($j.result -ne 'BLOCKED_DISCOVERY_REVIEW_REQUIRED' -or
               $j.checks.actual_cloud_upload_verified -or
               $j.checks.cloud_backup_created){
              throw 'CLOUD_NONHOST_RUNNER_FALSE_PASS'
            }
          }
          $global:LASTEXITCODE=0
          Write-Host 'CLOUD_NONHOST_FAIL_CLOSED_PASS'

      - name: Package reviewed read-only operator ZIP
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'Day12_Cloud_Recovery_Preflight_READ_ONLY.ps1',
            'RUN_Day12_Cloud_Recovery_Preflight_READ_ONLY.cmd',
            'README-Day12-CLOUD-PREFLIGHT-KO.txt',
            'Test_Cloud_Preflight_V4.ps1'
          )
          $dir=Join-Path $env:RUNNER_TEMP ('day12-cloud-kit-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop|Out-Null
          foreach($name in $files){
            Copy-Item -LiteralPath (Join-Path 'tools/day12/cloud' $name) -Destination $dir -ErrorAction Stop
          }
          $head='${{ github.event.pull_request.head.sha || github.sha }}'
          $manifest=[ordered]@{diagnostic_version=4;source_head_sha=$head;files=@()}
          foreach($name in $files){
            $manifest.files+=@{name=$name;sha256=(Get-FileHash -LiteralPath (Join-Path $dir $name) -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          $manifest|ConvertTo-Json -Depth 5|Set-Content -LiteralPath (Join-Path $dir 'BUILD-INFO-V4.json') -Encoding UTF8
          $files+='BUILD-INFO-V4.json'
          $zip=Join-Path $PWD 'Geumyi-Day12-GoogleDrive-OneDrive-READ-ONLY-Preflight-v4.zip'
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $actual=@($z.Entries|ForEach-Object{$_.FullName}|Sort-Object)
            $expected=@($files|Sort-Object)
            if(Compare-Object $actual $expected){throw 'CLOUD_ZIP_FILE_LIST_NOT_EXACT'}
          } finally {$z.Dispose()}
          $h=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "CLOUD_READONLY_OPERATOR_ZIP_SHA256=$h"

      - uses: actions/upload-artifact@v7
        with:
          name: day12-google-onedrive-safe-readonly-preflight-v4
          path: Geumyi-Day12-GoogleDrive-OneDrive-READ-ONLY-Preflight-v4.zip
          if-no-files-found: error
          retention-days: 30
