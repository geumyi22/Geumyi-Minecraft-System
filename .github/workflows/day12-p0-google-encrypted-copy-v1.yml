name: Day12 P0 Google Encrypted Copy V1

on:
  pull_request:
    paths:
      - 'tools/day12/cloud/Day12_P0_Google_Encrypted_Copy.ps1'
      - 'tools/day12/cloud/Test_Day12_P0_Google_Encrypted_Copy_V1.ps1'
      - 'tools/day12/cloud/Test_Day12_P0_Google_Mirror_Validation_V2.ps1'
      - 'tools/day12/cloud/RUN_Day12_P0_Google_Encrypted_Copy.cmd'
      - 'tools/day12/cloud/README-Day12-P0-GOOGLE-ENCRYPTED-COPY-KO.txt'
      - '.github/workflows/day12-p0-google-encrypted-copy-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only-encrypted-copy:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Syntax and live-operation safety contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='tools/day12/cloud'
          foreach($n in @('Day12_P0_Google_Encrypted_Copy.ps1',
            'Day12_P0_Google_Transfer_Preflight_READ_ONLY.ps1',
            'Test_Day12_P0_Google_Encrypted_Copy_V1.ps1',
            'Test_Day12_P0_Google_Mirror_Validation_V2.ps1')){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path (Join-Path $base $n)).Path,
              [ref]$tokens,[ref]$errors)
            if(@($errors).Count){throw ('P0_GOOGLE_COPY_PARSE_FAILED_'+$n)}
          }
          $src=Get-Content -LiteralPath (Join-Path $base 'Day12_P0_Google_Encrypted_Copy.ps1') -Raw
          foreach($expected in @('P0-CopyCipherFile','P0-CopyCipherSet',
            'P0-CheckMirrorParent','P0-MirrorCandidateUnderProfile',
            'P0-PathIdentical','P0-ExactCipherInventory',
            'P0_GOOGLE_REMOTE_UPLOAD_VERIFIED=false',
            'P0_INDEPENDENT_WEB_DOWNLOAD_VERIFIED=false',
            'GOOGLE_P0_ENCRYPTED_UPLOAD_APPROVED',
            'FileMode]::CreateNew','Get-FileHash','81413',
            'P0_GOOGLE_MIRROR_COPY_HASH_VERIFIED=23')){
            if(-not $src.Contains($expected)){throw ('P0_COPY_REQUIRED_GUARD_MISSING_'+$expected)}
          }
          if($src -match '(?i)Remove-Item|Stop-Process|Restart-Service|Stop-Service|Set-Content|Invoke-RestMethod|Invoke-WebRequest|git push'){
            throw 'PRODUCTION_UPLOAD_TOOL_FORBIDDEN_ACTION'
          }
      - name: Regression - production entrypoint must not silently return zero
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $scriptPath=(Resolve-Path 'tools/day12/cloud/Day12_P0_Google_Encrypted_Copy.ps1').Path
          $source=Get-Content -LiteralPath $scriptPath -Raw -Encoding UTF8
          if(-not $source.Contains('$script:P0_Copy_EntryMode') -or
             -not $source.Contains('P0_GOOGLE_COPY_ENTRYPOINT_STARTED')){
            throw 'REAL_ENTRYPOINT_EARLY_RETURN_GUARD_ABSENT'
          }
          foreach($engine in @('powershell.exe','pwsh')){
            # Use an intentionally nonexistent temp LOCALAPPDATA. Real backup/G: is NEVER accessed.
            $original=$env:LOCALAPPDATA
            try{
              $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP ('p0-no-real-backup-'+[guid]::NewGuid().ToString('N'))
              $seen=@(& $engine -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $scriptPath 2>&1)
              $exitCode=$LASTEXITCODE
              $msg=$seen|Out-String
              if($exitCode -eq 0 -or
                 $msg -notmatch 'P0_GOOGLE_COPY_ENTRYPOINT_STARTED' -or
                 $msg -notmatch 'P0_GOOGLE_COPY_FAILED_OR_INCOMPLETE' -or
                 $msg -match 'P0_G_MOUNT_COPY_COMPLETE=true'){
                throw ('SILENT_SUCCESS_WITHOUT_FILE_COPY_'+$engine)
              }
              Write-Host ('NO_SILENT_SUCCESS_REGRESSION_PASS_'+$engine)
            } finally {$env:LOCALAPPDATA=$original}
          }
          $global:LASTEXITCODE=0
      - name: Copy simulation in Windows PowerShell 5.1 and 7
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fixture='tools/day12/cloud/Test_Day12_P0_Google_Encrypted_Copy_V1.ps1'
          foreach($engine in @('powershell.exe','pwsh')){
            $global:LASTEXITCODE=0
            $result=@(& $engine -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $fixture)
            if($LASTEXITCODE -ne 0 -or
              ($result|Out-String) -notmatch 'P0_GOOGLE_ENCRYPTED_COPY_SYNTHETIC_PASS'){
              $result|ForEach-Object{Write-Host $_}
              throw ('P0_GOOGLE_ENCRYPTED_COPY_SYNTHETIC_FAILED_'+$engine)
            }
            $result|ForEach-Object{Write-Host $_}
          }
          $global:LASTEXITCODE=0
      - name: Google mirror shortcut validation - PowerShell 5.1 and 7
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fixture='tools/day12/cloud/Test_Day12_P0_Google_Mirror_Validation_V2.ps1'
          foreach($engine in @('powershell.exe','pwsh')){
            $global:LASTEXITCODE=0
            $r=@(& $engine -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $fixture)
            if($LASTEXITCODE -ne 0 -or
              ($r|Out-String) -notmatch 'P0_GOOGLE_MIRROR_VALIDATION_SYNTHETIC_PASS'){
              $r|ForEach-Object{Write-Host $_}
              throw ('GOOGLE_MIRROR_SHORTCUT_REGRESSION_FAILED_'+$engine)
            }
            $r|ForEach-Object{Write-Host $_}
          }
          $global:LASTEXITCODE=0
      - name: Build and verify exact operator ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('day12-google-operator-'+[guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $dir)
          $files=@(
            'Day12_P0_Google_Encrypted_Copy.ps1',
            'Day12_P0_Google_Transfer_Preflight_READ_ONLY.ps1',
            'RUN_Day12_P0_Google_Encrypted_Copy.cmd',
            'README-Day12-P0-GOOGLE-ENCRYPTED-COPY-KO.txt')
          foreach($name in $files){
            Copy-Item -LiteralPath (Join-Path 'tools/day12/cloud' $name) -Destination $dir -ErrorAction Stop
          }
          $metadata=[ordered]@{
            label='DAY12_P0_ENCRYPTED_ONLY_GOOGLE_MIRROR_COPY_V2'
            git_head='${{ github.event.pull_request.head.sha || github.sha }}'
            synthetic_ci_only=$true
            uploads_remotely_confirmed=$false
            overwrites_existing=$false
            files=@()
          }
          foreach($file in @(Get-ChildItem -LiteralPath $dir -File)){
            $metadata.files+=@{
              name=$file.Name
              sha256=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $metadata|ConvertTo-Json -Depth 7|Set-Content -LiteralPath (Join-Path $dir 'BUILD-INFO-P0-GOOGLE-COPY.json') -Encoding UTF8
          $zip='Geumyi-Day12-P0-GOOGLE-MIRROR-ENCRYPTED-COPY-v2.zip'
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $zip -ErrorAction Stop
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $read=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try{
            $expectedNames=@($files + 'BUILD-INFO-P0-GOOGLE-COPY.json' | Sort-Object)
            $actualNames=@($read.Entries|ForEach-Object{$_.FullName}|Sort-Object)
            if(Compare-Object $actualNames $expectedNames){throw 'P0_ZIP_INVENTORY_MISMATCH'}
          } finally {$read.Dispose()}
          Write-Host ('P0_GOOGLE_CIPHER_COPY_ZIP_SHA256='+(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant())
      - uses: actions/upload-artifact@v7
        with:
          name: day12-p0-google-mirror-encrypted-copy-v2
          path: Geumyi-Day12-P0-GOOGLE-MIRROR-ENCRYPTED-COPY-v2.zip
          if-no-files-found: error
          retention-days: 30
      - name: Explicit CI limitation
        shell: pwsh
        run: |
          @'
          SYNTHETIC TESTS ONLY. No real G: mount, no Google account identity,
          no provider upload/download or remote storage confirmation.
          On the operator host, mirrored-folder copy is a provider staging step;
          independent Google web download and AES-GCM verification remain required.
          Existing local encrypted backup and live server data remain unchanged.
          '@ >> $env:GITHUB_STEP_SUMMARY
