name: Day12 Native Online Java/RCON Bind Owner Operator Kit

on:
  pull_request:
    paths:
      - 'tools/day12/Day12_Native_TCP_Provider_READ_ONLY.ps1'
      - 'tools/day12/Day12_Phase10_Online_Bind_Owner_Scoped_READ_ONLY.ps1'
      - 'tools/day12/RUN_Day12_Phase10_Current_Online_Bind_READ_ONLY.cmd'
      - 'tools/day12/README-Day12-PHASE10-ONLINE-NATIVE-BIND-20261013-KO.txt'
      - '.github/workflows/day12-native-online-bind-operator-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-scoped-owner:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Parse and prove both positive and fail-closed synthetic fixtures (PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'tools/day12/Day12_Phase10_Online_Bind_Owner_Scoped_READ_ONLY.ps1'
          $helper = 'tools/day12/Day12_Native_TCP_Provider_READ_ONLY.ps1'
          foreach($file in @($script, $helper)){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,[ref]$tokens,[ref]$errors)
            if(@($errors).Count -gt 0){throw ('INVALID_WINDOWS_PS51_SOURCE:'+$file)}
          }
          $result = @(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Synthetic -ExpectedOtherBackendState OFFLINE)
          if($LASTEXITCODE -ne 0 -or ($result | Out-String) -notmatch 'DAY12_SCOPED_NATIVE_OWNER_SYNTHETIC_PASS'){
            $result | ForEach-Object {Write-Host $_}
            throw 'SCOPED_BIND_OWNER_SYNTHETIC_FAIL'
          }
          $global:LASTEXITCODE=0
          Write-Host 'SCOPED_BIND_OWNER_SYNTHETIC_PASS'

      - name: Prove Windows native OWNER_PID listener fixture v4+v6 against live ephemeral self-owned sockets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tools/day12/Day12_Native_TCP_Provider_READ_ONLY.ps1
          $v4 = New-Object System.Net.Sockets.TcpListener([Net.IPAddress]::Loopback,0)
          $v6 = New-Object System.Net.Sockets.TcpListener([Net.IPAddress]::IPv6Loopback,0)
          try {
            $v4.Start();$v6.Start()
            $p4 = [int]$v4.LocalEndpoint.Port
            $p6 = [int]$v6.LocalEndpoint.Port
            $result = Get-Day12NativeTcpInventory -WantedPorts @($p4,$p6)
            if($result.status -ne 'CAPTURED'){throw 'NATIVE_PROVIDER_NOT_CAPTURED'}
            $rows=@($result.rows)
            $mine4=@($rows|Where-Object{$_.port -eq $p4 -and $_.source -eq 'GetExtendedTcpTable_OWNER_PID_IPv4' -and $_.pid -eq $PID -and $_.address -eq '127.0.0.1'})
            $mine6=@($rows|Where-Object{$_.port -eq $p6 -and $_.source -eq 'GetExtendedTcpTable_OWNER_PID_IPv6' -and $_.pid -eq $PID -and $_.address -eq '::1'})
            if($mine4.Count -ne 1 -or $mine6.Count -ne 1){
              throw 'NATIVE_V4_V6_SELF_OWNED_LISTENER_FIXTURE_FAILED'
            }
            if(-not [GeumyiDay12TcpListenerV2]::IsListenerClassStateAccepted(3,0) -or
               -not [GeumyiDay12TcpListenerV2]::IsListenerClassStateAccepted(0,0) -or
               [GeumyiDay12TcpListenerV2]::IsListenerClassStateAccepted(5,0) -or
               [GeumyiDay12TcpListenerV2]::IsListenerClassStateAccepted(2,0)){
              throw 'NATIVE_LISTENER_CLASS_STATE0_FAIL_CLOSED_FAILED'
            }
            Write-Host 'NATIVE_V4_V6_OWNER_CLASS3_AND_STATE0_POLICY_PASS'
          } finally {
            $v4.Stop();$v6.Stop()
          }

      - name: Package offline-only, no-mutation operator kit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'Day12_Native_TCP_Provider_READ_ONLY.ps1',
            'Day12_Phase10_Online_Bind_Owner_Scoped_READ_ONLY.ps1',
            'RUN_Day12_Phase10_Current_Online_Bind_READ_ONLY.cmd',
            'README-Day12-PHASE10-ONLINE-NATIVE-BIND-20261013-KO.txt'
          )
          $staging=Join-Path $env:RUNNER_TEMP ('day12-native-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $staging -ErrorAction Stop | Out-Null
          foreach($file in $files) {
            Copy-Item -LiteralPath (Join-Path 'tools/day12' $file) -Destination $staging -ErrorAction Stop
          }
          $zip=Join-Path $PWD 'Geumyi-Day12-Native-Online-Owner-Other-OFFLINE-READ-ONLY.zip'
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $actual=@($z.Entries|ForEach-Object{$_.FullName}|Sort-Object)
            $expected=@($files|Sort-Object)
            if((Compare-Object $actual $expected)){throw 'OPERATOR_KIT_ZIP_MANIFEST_MISMATCH'}
          } finally {$z.Dispose()}
          $hash=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "NATIVE_OWNER_READONLY_KIT_SHA256=$hash"

      - uses: actions/upload-artifact@v7
        with:
          name: day12-native-online-owner-other-offline-readonly-kit
          path: Geumyi-Day12-Native-Online-Owner-Other-OFFLINE-READ-ONLY.zip
          if-no-files-found: error
          retention-days: 21
