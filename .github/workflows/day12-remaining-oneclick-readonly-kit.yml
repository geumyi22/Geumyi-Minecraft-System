name: Day12 Remaining Nine Phases OneClick READ ONLY

on:
  push:
    branches: [main]
    paths:
      - 'tools/day12/Day12_Remaining_OneClick_READ_ONLY.ps1'
      - 'Geumyi_Day12_Remaining_OneClick_READ_ONLY.cmd'
      - 'DAY12-REMAINING-ONECLICK-GUIDE.md'
      - '.github/workflows/day12-remaining-oneclick-readonly-kit.yml'
      - 'tools/day12/Day12_Phase1_Content_Preflight_READ_ONLY.ps1'
      - 'tools/day12/Day12_Phase2_Component_Inventory_READ_ONLY.ps1'
      - 'deploy/day12-managed-content.json'
      - 'deploy/day12-lifecycle-policy.json'
      - 'deploy/components.json'
      - 'FINAL-RELEASE-GATES.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-verified-operator-kit:
    name: Windows synthetic safety plus focused package
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell and assert launcher is strictly read-only
        shell: powershell
        run: |
          foreach($p in @(
            'tools/day12/Day12_Remaining_OneClick_READ_ONLY.ps1',
            'tools/day12/Day12_Phase1_Content_Preflight_READ_ONLY.ps1',
            'tools/day12/Day12_Phase2_Component_Inventory_READ_ONLY.ps1')){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
            if(@($errors).Count){
              $errors|ForEach-Object{Write-Host ($_.ErrorId)}
              throw ('PowerShell parse failed: '+$p)
            }
          }
          $src=Get-Content 'tools/day12/Day12_Remaining_OneClick_READ_ONLY.ps1' -Raw
          foreach($bad in @('New-NetFirewallRule','Set-NetFirewallRule','Remove-NetFirewallRule',
            'Restart-Service','Stop-Service','Start-Service','Stop-Process',
            'GetExtendedTcpTable','GetTcpTable2','auditpol','-Mode Build',
            'Phase4_Lifecycle_Apply','_Scoped_Graceful_Restart','Geumyi_Final_Verification.cmd')){
            if($src -match [regex]::Escape($bad)){throw ('Unsafe/repeated code reference: '+$bad)}
          }
          $cmd=Get-Content 'Geumyi_Day12_Remaining_OneClick_READ_ONLY.cmd' -Raw
          if($cmd -notmatch 'powershell.exe.*Day12_Remaining_OneClick_READ_ONLY.ps1' -or
             $cmd -match '(?i)-NonInteractive'){
            throw 'Interactive one-click launcher not correctly anchored'
          }
      - name: Test fail-closed synthetic all-nine report without live calls
        shell: powershell
        run: |
          $src='tools/day12/Day12_Remaining_OneClick_READ_ONLY.ps1'
          $out=Join-Path $env:RUNNER_TEMP 'day12-nine-phase-synthetic'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $src -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'Synthetic integrated CMD engine failed'}
          $report=Join-Path $out 'Day12-Remaining-Summary.json'
          if(-not(Test-Path -LiteralPath $report -PathType Leaf)){throw 'Summary JSON missing'}
          $r=Get-Content $report -Raw -Encoding UTF8|ConvertFrom-Json
          $expected=@('12.1','12.2','12.4','12.5','12.7','12.10','12.11','12.12','12.13')
          $seen=@($r.phase_rows|ForEach-Object{$_.phase})
          if($r.result -ne 'SYNTHETIC_CONTRACT_PASS' -or !$r.synthetic -or
             $r.collected_phase_count -ne 9 -or $seen.Count -ne 9 -or
             @($expected|Where-Object{$seen -notcontains $_}).Count -gt 0 -or
             $r.stable_release_allowed -or $r.maintenance_mode_allowed -or
             $r.overall_live_completion -ne 'NOT_PROVEN' -or
             $r.canonical_backend_ports_private -ne 'UNCHANGED_FAIL' -or
             $r.service_restart_performed -or $r.world_or_golden_mutation_performed -or
             $r.authorization_credentials_exported -or $r.raw_process_commands_or_pids_exported){
            throw 'Remaining phase summary fail-closed contract failed'
          }
          if(@($r.phase_rows|Where-Object{$_.released_to_stable}).Count -gt 0){
            throw 'Synthetic gate unexpectedly released to Stable'
          }
          Write-Host 'Nine pending phases appear once and no live PASS/release flag is possible'
      - name: Refuse to execute real review on a disposable Windows runner
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'day12-must-refuse-live'
          $errorFile=Join-Path $env:RUNNER_TEMP 'must-refuse-stderr.txt'
          $p=Start-Process 'powershell.exe' -Wait -NoNewWindow -PassThru -RedirectStandardError $errorFile -ArgumentList @(
            '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',
            'tools/day12/Day12_Remaining_OneClick_READ_ONLY.ps1','-OutputDir',$out)
          if($p.ExitCode -eq 0){throw 'OneClick unexpectedly accepted a runner with no GSC Host'}
          if(Test-Path -LiteralPath (Join-Path $out 'Day12-Remaining-Summary.json')){
            throw 'Fake live server summary was produced'
          }
      - name: Package exact read-only kit and SHA256 manifest
        shell: powershell
        run: |
          $k='Day12-Remaining-OneClick-READONLY'
          New-Item -ItemType Directory -Force -Path "$k/tools/day12","$k/deploy"|Out-Null
          Copy-Item 'Geumyi_Day12_Remaining_OneClick_READ_ONLY.cmd' $k
          Copy-Item 'DAY12-REMAINING-ONECLICK-GUIDE.md' $k
          Copy-Item 'FINAL-RELEASE-GATES.json' $k
          foreach($name in @('Day12_Remaining_OneClick_READ_ONLY.ps1',
            'Day12_Phase1_Content_Preflight_READ_ONLY.ps1',
            'Day12_Phase2_Component_Inventory_READ_ONLY.ps1')){
            Copy-Item (Join-Path 'tools/day12' $name) "$k/tools/day12"
          }
          foreach($name in @('day12-managed-content.json','day12-lifecycle-policy.json','components.json')){
            Copy-Item (Join-Path 'deploy' $name) "$k/deploy"
          }
          $expected=@(
            'Geumyi_Day12_Remaining_OneClick_READ_ONLY.cmd',
            'DAY12-REMAINING-ONECLICK-GUIDE.md',
            'FINAL-RELEASE-GATES.json',
            'tools/day12/Day12_Remaining_OneClick_READ_ONLY.ps1',
            'tools/day12/Day12_Phase1_Content_Preflight_READ_ONLY.ps1',
            'tools/day12/Day12_Phase2_Component_Inventory_READ_ONLY.ps1',
            'deploy/day12-managed-content.json',
            'deploy/day12-lifecycle-policy.json',
            'deploy/components.json'
          )
          $manifest=@(Get-ChildItem $k -File -Recurse|ForEach-Object{
            [ordered]@{
              path=$_.FullName.Substring((Resolve-Path $k).Path.Length+1).Replace('\','/')
              sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }|Sort-Object path)
          $have=@($manifest|ForEach-Object{$_.path})
          if($have.Count -ne $expected.Count -or
             @($expected|Where-Object{$have -notcontains $_}).Count){
            throw 'OneClick focused source kit has unexpected/missing member'
          }
          [ordered]@{schema=1;role='SERVER_PC_ONLY';production_mutations='NONE'
            stable_release_allowed=$false;files=$manifest
          }|ConvertTo-Json -Depth 8|Set-Content -LiteralPath "$k/SHA256-MANIFEST.json" -Encoding UTF8
          $zip='Geumyi-Day12-Remaining-OneClick-READONLY.zip'
          Compress-Archive -Path "$k/*" -DestinationPath $zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try{
            $names=@($z.Entries|Where-Object{$_.Name -ne ''}|ForEach-Object{$_.FullName.Replace('\','/')})
            if($names.Count -ne ($expected.Count+1)){
              throw 'ZIP file count mismatch'
            }
            foreach($expectedName in $expected+@('SHA256-MANIFEST.json')){
              if($names -notcontains $expectedName){throw ('ZIP missing '+$expectedName)}
            }
          }finally{$z.Dispose()}
          Write-Host 'Read-only focused one-click ZIP SHA and required file membership VERIFIED'
      - uses: actions/upload-artifact@v7
        with:
          name: day12-remaining-oneclick-readonly-kit
          path: Geumyi-Day12-Remaining-OneClick-READONLY.zip
          retention-days: 30
