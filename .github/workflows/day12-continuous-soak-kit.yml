name: Day12 Continuous Soak Read Only Kit
on:
  push:
    branches: [main]
    paths:
      - 'tools/day12/Day12_Phase12_Continuous_Soak_READ_ONLY.ps1'
      - 'tools/day12/Start_Day12_8H_Soak_READ_ONLY.cmd'
      - 'DAY12-PHASE12-CONTINUOUS-SOAK-RUNBOOK.md'
      - '.github/workflows/day12-continuous-soak-kit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-synthetic-and-pack:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 synthetic fail-closed test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $file='tools/day12/Day12_Phase12_Continuous_Soak_READ_ONLY.ps1'
          $tokens=$null;$issues=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$issues)
          if(@($issues).Count -gt 0){throw ('PowerShell parse errors='+@($issues).Count)}
          $danger=@('Stop-Process','Start-Process','Stop-Service','Start-Service','Restart-Service','Stop-ScheduledTask','Start-ScheduledTask','New-NetFirewallRule','Set-NetFirewallRule','Remove-Item','Restart-Computer')
          $commands=@($ast.FindAll({param($x) $x -is [Management.Automation.Language.CommandAst]},$true) | ForEach-Object{$_.GetCommandName()})
          foreach($c in $commands){if($c -in $danger){throw ('Forbidden command: '+$c)}}
          $global:LASTEXITCODE=0
          $result=(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $file -Synthetic | Out-String | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Synthetic exited nonzero'}
          if($result.result -ne 'REVIEW_REQUIRED' -or $result.stable_release_allowed -ne $false -or
             $result.observed_added_java_gsc_process_identities -ne 1 -or
             $result.observed_removed_java_gsc_process_identities -ne 1 -or
             $result.application_probe_unhealthy_samples -ne 1 -or
             $result.observed_process_identity_stable -ne $false){throw 'Fail-closed regression'}
          Write-Host 'Synthetic process/probe churn and safety tests PASS (no actual 8h run)'
      - name: Package read-only kit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path 'soak-kit' -Force|Out-Null
          Copy-Item 'tools/day12/Day12_Phase12_Continuous_Soak_READ_ONLY.ps1' 'soak-kit'
          Copy-Item 'tools/day12/Start_Day12_8H_Soak_READ_ONLY.cmd' 'soak-kit'
          Copy-Item 'DAY12-PHASE12-CONTINUOUS-SOAK-RUNBOOK.md' 'soak-kit/README.md'
          Compress-Archive -Path 'soak-kit/*' -DestinationPath 'Geumyi-Day12-8H-Soak-READ-ONLY.zip'
          $zip=[IO.Compression.ZipFile]::OpenRead((Resolve-Path 'Geumyi-Day12-8H-Soak-READ-ONLY.zip'))
          try {if(@($zip.Entries).Count -ne 3){throw 'Bad operator ZIP layout'}}
          finally {$zip.Dispose()}
      - uses: actions/upload-artifact@v4
        with:
          name: Geumyi-Day12-8H-Soak-READ-ONLY
          path: Geumyi-Day12-8H-Soak-READ-ONLY.zip
          if-no-files-found: error
