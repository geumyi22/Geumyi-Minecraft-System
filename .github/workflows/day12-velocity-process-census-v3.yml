name: Day12 Velocity Process Census V3 Regression
on:
  push:
    branches: [main]
    paths:
      - 'tools/day12/Day12_Velocity_Process_Parser_V3.ps1'
      - '.github/workflows/day12-velocity-process-census-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-ps51-parser:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse and test exact shipped V3 command-line parser on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $file='tools/day12/Day12_Velocity_Process_Parser_V3.ps1'
          $t=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$t,[ref]$errors)
          if(@($errors).Count -gt 0){throw 'Syntax errors in shipped parser'}
          $ProxyRoot='C:\ProgramData\GeumyiServerCenter\Network\FourServer'
          $proxyPorts=@(
            [pscustomobject]@{id='wild'},
            [pscustomobject]@{id='playground'},
            [pscustomobject]@{id='other'}
          )
          . ./$file
          $cases=@(
            @{name='absolute-wild';cmd='C:\Java\bin\java.exe -Xms256M -Xmx512M -jar C:\ProgramData\GeumyiServerCenter\Network\FourServer\wild\velocity.jar'; expected='EXPECTED_ABSOLUTE_WILD'},
            @{name='quoted-playground';cmd='"C:\Java\bin\java.exe" -Xms256M -jar "C:\ProgramData\GeumyiServerCenter\Network\FourServer\playground\velocity.jar"';expected='EXPECTED_ABSOLUTE_PLAYGROUND'},
            @{name='relative-task';cmd='"C:\Program Files\Java\bin\java.exe" -Xms256M -Xmx512M -jar velocity.jar';expected='TASK_STYLE_RELATIVE_JAR'},
            @{name='other-absolute';cmd='java.exe -jar "C:\ProgramData\GeumyiServerCenter\Network\FourServer\other\velocity.jar"';expected='EXPECTED_ABSOLUTE_OTHER'},
            @{name='outside';cmd='java.exe -jar C:\Unrelated\velocity.jar';expected='OUTSIDE_EXPECTED_PROXY_ROOT'},
            @{name='other-java';cmd='java.exe -jar C:\data\paper.jar';expected='NOT_VELOCITY'},
            @{name='sneaky';cmd='java.exe -jar C:\Other\velocity.jar -jar velocity.jar';expected='NOT_VELOCITY'},
            @{name='relative-unexpected';cmd='java.exe -jar Other\velocity.jar';expected='UNEXPECTED_RELATIVE_JAR'}
          )
          foreach($c in $cases){
            $arg=Get-JarArgument $c.cmd
            $result=Classify-JarArgument $arg
            if($result -cne $c.expected){throw ($c.name + ': expected '+$c.expected+', got '+$result)}
          }
          $oldRegex='(?i)(?:^|\s)-jar\s+"?([\w.:-]+[\\/])?velocity\.jar"?(?:\s|$)'
          if([regex]::IsMatch($cases[0].cmd,$oldRegex)){throw 'Old V2 parser unexpectedly matches multi-directory absolute jar path'}
          Write-Host 'Windows PowerShell 5.1 shipped parser fixture PASS (8 cases)'
