name: Day 12 Read-Only Safety CI

on:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - 'tools/day12/**'
      - 'deploy/day12-*.json'
      - 'FINAL-*.json'
      - 'FINAL-*.md'
      - 'DAY12-PLAN.md'
      - '.github/workflows/day12-safety-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/day12/**'
      - 'deploy/day12-*.json'
      - 'FINAL-*.json'
      - 'FINAL-*.md'
      - 'DAY12-PLAN.md'
      - '.github/workflows/day12-safety-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  day12-safety:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Parse all Day 12 PowerShell
        shell: powershell
        run: |
          $files=Get-ChildItem 'tools/day12' -Filter '*.ps1' -File -Recurse
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){
              Write-Host "Parse failure: $($file.FullName)"
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell parse failed"
            }
          }
          Write-Host "Parsed $($files.Count) Day 12 PowerShell scripts."

      - name: Day1-12 cleanup synthetic classifier and isolated Windows quarantine/restore
        shell: powershell
        run: |
          $script=Join-Path (Get-Location) 'tools/day12/Geumyi_Day1To12_PC_Temp_Cleanup.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Synthetic
          if($LASTEXITCODE -ne 0){throw 'Day1-12 cleanup classifier failed'}
          $root=Join-Path $env:LOCALAPPDATA ('GeumyiCleanupCI-'+[guid]::NewGuid().ToString('N'))
          $safe=Join-Path $root 'Geumyi-Day6-CI-Throwaway'
          $protected=Join-Path $root 'Geumyi-Day9-CI-World'
          $day12=Join-Path $root 'Geumyi-Day12-CI-HOLD'
          $old=(Get-Date).AddDays(-21)
          $origTemp=$env:TEMP;$origTmp=$env:TMP
          try{
            New-Item -Path $safe,$protected,$day12 -ItemType Directory -Force|Out-Null
            $file=Join-Path $safe 'scratch.tmp'
            Set-Content -LiteralPath $file -Value 'scratch-only'
            New-Item -Path (Join-Path $protected 'world') -ItemType Directory|Out-Null
            foreach($i in @($file,$safe,$protected,$day12)){
              (Get-Item -LiteralPath $i).LastWriteTime=$old
            }
            $env:TEMP=$root;$env:TMP=$root
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Mode Preview -MinimumAgeDays 7
            if($LASTEXITCODE -ne 0){throw 'CI cleanup Preview unexpectedly failed'}
            $plans=Join-Path $env:LOCALAPPDATA 'Geumyi-Day1To12-Cleanup\Plans'
            $p=Get-ChildItem -LiteralPath $plans -File -Filter 'plan-*.json' |
              Sort-Object LastWriteTimeUtc -Descending|Select-Object -First 1
            if($null -eq $p){throw 'Missing cleanup private plan'}
            $plan=Get-Content -LiteralPath $p.FullName -Raw | ConvertFrom-Json
            $safeRow=@($plan.items|Where-Object{$_.path -eq $safe})
            $protectedRow=@($plan.items|Where-Object{$_.path -eq $protected})
            $day12Row=@($plan.items|Where-Object{$_.path -eq $day12})
            if($safeRow.Count -ne 1 -or -not $safeRow[0].eligible -or
              $protectedRow.Count -ne 1 -or $protectedRow[0].eligible -or
              $day12Row.Count -ne 1 -or $day12Row[0].eligible){
              throw 'Temp allowlist/protected world/Day12 hold classifier regression'
            }
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Mode Quarantine -PlanPath $p.FullName -Confirm 'QUARANTINE_GEUMYI_TEMP'
            if($LASTEXITCODE -ne 0){throw 'CI cleanup quarantine failed'}
            if(Test-Path -LiteralPath $safe){throw 'CI temp item was not quarantined'}
            if(-not(Test-Path -LiteralPath $protected) -or -not(Test-Path -LiteralPath $day12)){throw 'Protected candidate moved'}
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Mode Restore -RunId $plan.run_id -Confirm 'RESTORE_GEUMYI_TEMP'
            if($LASTEXITCODE -ne 0 -or -not(Test-Path -LiteralPath $safe)){throw 'CI restore failed'}
            Write-Host 'Day1-12 cleanup isolated Windows preview/quarantine/restore PASS; Day12 HOLD confirmed'
          }finally{
            $env:TEMP=$origTemp;$env:TMP=$origTmp
            if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue}
          }
          $global:LASTEXITCODE=0

      - name: Read-only mutation guard
        shell: powershell
        run: |
          $files=Get-ChildItem 'tools/day12' -Filter '*READ_ONLY.ps1' -File -Recurse
          $forbidden=@(
            'Stop-Process','Stop-Service','Restart-Service','Start-Service',
            'Remove-Item','Move-Item','Rename-Item','Copy-Item',
            'Set-NetFirewallRule','New-NetFirewallRule','Remove-NetFirewallRule',
            'Register-ScheduledTask','Unregister-ScheduledTask',
            'Restart-Computer','Stop-Computer'
          )
          foreach($file in $files){
            $text=Get-Content -LiteralPath $file.FullName -Raw
            foreach($x in $forbidden){
              if($text -match [regex]::Escape($x)){throw "$($file.Name) contains forbidden mutation: $x"}
            }
            if($text -match '(?i)-Method\s+(POST|PUT|PATCH|DELETE)'){
              throw "$($file.Name) contains a mutating HTTP method"
            }
          }

      - name: Validate Day 12 JSON contracts
        shell: powershell
        run: |
          foreach($p in @(
            'FINAL-BASELINE.json',
            'FINAL-NETWORK-TOPOLOGY.json',
            'FINAL-RELEASE-GATES.json',
            'FINAL-SECURITY-REPORT.json',
            'FINAL-HEALTH-REPORT.json',
            'deploy/day12-managed-content.json',
            'deploy/day12-lifecycle-policy.json'
          )){
            $j=Get-Content -LiteralPath $p -Raw | ConvertFrom-Json
            if([int]$j.schema -lt 1){throw "Unexpected schema: $p"}
          }

      - name: Synthetic Phase 0A and 0B
        shell: powershell
        run: |
          $a=Join-Path $env:RUNNER_TEMP 'p0a'
          & tools/day12/Day12_Phase0_Golden_Baseline_READ_ONLY.ps1 -Synthetic -OutputDir $a
          if($LASTEXITCODE -ne 0){throw "Phase0A synthetic failed"}
          $b=Join-Path $env:RUNNER_TEMP 'p0b'
          & tools/day12/Day12_Phase0B_Golden_Checkpoint.ps1 -Synthetic -OutputDir $b
          if($LASTEXITCODE -ne 0){throw "Phase0B synthetic failed"}

      - name: Synthetic Phase 1
        shell: powershell
        run: |
          $a=Join-Path $env:RUNNER_TEMP 'p1pre'
          & tools/day12/Day12_Phase1_Content_Preflight_READ_ONLY.ps1 -Synthetic -OutputDir $a
          if($LASTEXITCODE -ne 0){throw "Phase1 preflight synthetic failed"}
          $b=Join-Path $env:RUNNER_TEMP 'p1apply'
          & tools/day12/Day12_Phase1_Managed_Content_Apply.ps1 -Synthetic -ManifestPath deploy/day12-managed-content.json -OutputDir $b
          if($LASTEXITCODE -ne 0){throw "Phase1 apply synthetic failed"}

      - name: Synthetic Phase 2 through 5
        shell: powershell
        run: |
          & tools/day12/Day12_Phase2_Component_Inventory_READ_ONLY.ps1 -Synthetic -OutputDir (Join-Path $env:RUNNER_TEMP 'p2')
          if($LASTEXITCODE -ne 0){throw "Phase2 synthetic failed"}
          & tools/day12/Day12_Phase3_Health_READ_ONLY.ps1 -Synthetic -OutputDir (Join-Path $env:RUNNER_TEMP 'p3')
          if($LASTEXITCODE -ne 0){throw "Phase3 synthetic failed"}
          & tools/day12/Day12_Phase4_Storage_Log_DRY_RUN.ps1 -Synthetic -OutputDir (Join-Path $env:RUNNER_TEMP 'p4')
          if($LASTEXITCODE -ne 0){throw "Phase4 dry-run synthetic failed"}
          & tools/day12/Day12_Phase4_Lifecycle_Apply.ps1 -Synthetic -PolicyPath deploy/day12-lifecycle-policy.json -OutputDir (Join-Path $env:RUNNER_TEMP 'p4apply')
          if($LASTEXITCODE -ne 0){throw "Phase4 apply synthetic failed"}
          & tools/day12/Day12_Phase5_Security_Audit_READ_ONLY.ps1 -Synthetic -OutputDir (Join-Path $env:RUNNER_TEMP 'p5')
          if($LASTEXITCODE -ne 0){throw "Phase5 synthetic failed"}

      - name: Synthetic Phase 7 and 8
        shell: powershell
        run: |
          & tools/day12/Day12_Phase7_KnownGood_Cache.ps1 -Synthetic -OutputDir (Join-Path $env:RUNNER_TEMP 'p7')
          if($LASTEXITCODE -ne 0){throw "Phase7 synthetic failed"}
          & tools/day12/Day12_Phase8_DR_SYNTHETIC.ps1 -OutputDir (Join-Path $env:RUNNER_TEMP 'p8')
          if($LASTEXITCODE -ne 0){throw "Phase8 synthetic failed"}

      - name: Known-good cache real Build/verify in temporary Windows fixture
        shell: powershell
        run: |
          $base=Join-Path $env:RUNNER_TEMP 'day12-cache-integration'
          $previousPD=$env:PROGRAMDATA
          $previousPF=$env:ProgramFiles
          try {
            $env:PROGRAMDATA=Join-Path $base 'ProgramData'
            $env:ProgramFiles=Join-Path $base 'ProgramFiles'
            $env:DAY12_TEST_PROGRAMFILES=$env:ProgramFiles
            $root=Join-Path $env:PROGRAMDATA 'GeumyiServerCenter'
            $install=Join-Path $env:ProgramFiles 'Geumyi Server Center'
            New-Item -ItemType Directory -Force -Path $root,$install | Out-Null
            Set-Content (Join-Path $install 'GeumyiServerHost.exe') 'fixture-host'
            Set-Content (Join-Path $install 'GeumyiServerCenter.exe') 'fixture-client'
            $servers=@()
            $confirmed=@()
            foreach($id in @('wild','playground','other','lobby')){
              $dir=Join-Path $base ('server-'+$id)
              $pl=Join-Path $dir 'plugins'
              New-Item -ItemType Directory -Force -Path $pl | Out-Null
              Set-Content (Join-Path $pl 'fixture-plugin.jar') ("fixture-"+$id)
              $servers+=@{id=$id;path=$dir}
              $confirmed+=@{server_id=$id;step='create_verify_protect';pass=$true;retention_exempt=$true;file=($id+'-full-backup-test.zip');sha256=('a'*64)}
            }
            @{servers=$servers} | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $root 'server.json') -Encoding UTF8
            foreach($id in @('wild','playground','other')){
              $pl=Join-Path $root ('Network\FourServer\'+$id+'\plugins')
              New-Item -ItemType Directory -Force -Path $pl | Out-Null
              Set-Content (Join-Path $pl 'fixture-proxy.jar') ("proxy-"+$id)
            }
            $report=Join-Path $base 'Phase0B-PASS-fixture.json'
            @{phase='12.0B';result='PASS';steps=$confirmed}|ConvertTo-Json -Depth 8|Set-Content $report -Encoding UTF8
            $output=Join-Path $base 'output'
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase7_KnownGood_Cache.ps1 -Mode Build -Confirm BUILD_DAY12_KNOWN_GOOD_CACHE -Phase0BReport $report -OutputDir $output
            if($LASTEXITCODE -ne 0){throw "Known-good cache Build failed"}
            $cacheRoot=Join-Path $root 'ArtifactCache\known-good\day12'
            $manifest=Join-Path $cacheRoot 'known-good-manifest.json'
            $m=Get-Content $manifest -Raw|ConvertFrom-Json
            if($m.result -ne 'PASS' -or @($m.files).Count -ne 9){throw ("Cache Build manifest contract failed; count="+@($m.files).Count+"; names="+((@($m.files)|ForEach-Object{$_.logical}) -join ","))}
            if(@($m.files|Where-Object{-not $_.cache_name -or -not $_.sha256}).Count -ne 0){throw "Cache manifest missing cache_name or hash"}
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/recovery-kit/Verify-KnownGood.ps1 -ManifestPath $manifest -Root $cacheRoot
            if($LASTEXITCODE -ne 0){throw "Recovery Kit could not verify built cache"}
            $target=Join-Path $cacheRoot ([string]$m.files[0].cache_name)
            Set-Content -LiteralPath $target -Value 'tampered'
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/recovery-kit/Verify-KnownGood.ps1 -ManifestPath $manifest -Root $cacheRoot
            if($LASTEXITCODE -eq 0){throw "Corrupt cache passed integrity verification"}
          }finally{
            $env:PROGRAMDATA=$previousPD
            $env:ProgramFiles=$previousPF
            Remove-Item Env:DAY12_TEST_PROGRAMFILES -ErrorAction SilentlyContinue
          }
          $global:LASTEXITCODE=0

      - name: Synthetic native TCP table diagnostics (no production changes)
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'tcp-native-diagnostic'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_TCP_Bind_Diagnostic_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'TCP native diagnostic synthetic run failed'}
          $reports=@(Get-ChildItem -LiteralPath $out -Filter '*.json' -File)
          if($reports.Count -ne 1){throw 'TCP diagnostic did not write exactly one report'}
          $r=Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_CAPTURED' -or -not $r.read_only -or $r.mutation_performed -or -not $r.providers.native){throw 'TCP native diagnostic contract failed'}
          if([string]$r.providers.native.status -ne 'OK'){throw ('Native Windows TCP table call failed: '+[string]$r.providers.native.error)}

      - name: Windows native TCP Owner PID vs Basic IPv4 controlled listener
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'day12-native-crosscheck'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase10_Native_Listener_Crosscheck_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'Native controlled listener crosscheck failed'}
          $reports=@(Get-ChildItem -LiteralPath $out -Filter '*.json' -File)
          if($reports.Count -ne 1){throw 'Native crosscheck expected a single report'}
          $r=Get-Content -LiteralPath $reports[0].FullName -Raw -Encoding UTF8|ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_PASS' -or -not $r.read_only -or -not $r.synthetic -or
            -not $r.controlled_listener_observed_basic -or -not $r.controlled_listener_observed_owner -or $r.mutation_performed){
            throw 'Native controlled listener report contract failed'
          }

      - name: Synthetic online Java/RCON loopback TCP probe (controlled temporary listener)
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'day12-loopback-synthetic'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase10_Loopback_Compare_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'Loopback synthetic probe failed'}
          $files=@(Get-ChildItem -LiteralPath $out -Filter '*.json' -File)
          if($files.Count -ne 1){throw 'Loopback probe expected exactly one result'}
          $r=Get-Content -LiteralPath $files[0].FullName -Raw -Encoding UTF8|ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_PASS' -or -not $r.read_only -or -not $r.synthetic -or
            -not $r.control_open_works -or -not $r.control_closed_denied -or $r.mutation_performed){
            throw 'Loopback controlled fixture contract failure'
          }

      - name: Synthetic active TCP server-endpoint trace against held loopback socket
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'day12-held-tcp'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase10_Active_Connection_Trace_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'Active TCP synthetic failed'}
          $files=@(Get-ChildItem -LiteralPath $out -Filter '*.json' -File)
          if($files.Count -ne 1){throw 'Active trace expected one JSON'}
          $r=Get-Content -LiteralPath $files[0].FullName -Raw -Encoding UTF8|ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_PASS' -or -not $r.server_side_established_seen -or
            -not $r.synthetic -or -not $r.read_only -or $r.mutation_performed){
            throw 'Active trace controlled fixture regression'
          }

      - name: Native ALL provider differential fixture
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/day12/Day12_Phase10_Provider_Diff_READ_ONLY.ps1 -Synthetic -OutputDir (Join-Path $env:RUNNER_TEMP 'day12-provider-diff')
          if($LASTEXITCODE -ne 0){throw 'Provider differential fixture failed'}

      - name: Synthetic 12.10 configuration and bind evidence (fail-closed)
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'bind-evidence'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase10_Bind_Evidence_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'Binding evidence regression failed'}
          $reports=@(Get-ChildItem -LiteralPath $out -Filter '*.json' -File)
          if($reports.Count -ne 1){throw 'Expected exactly one binding evidence report'}
          $r=Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_PASS' -or -not $r.read_only -or -not $r.synthetic -or $r.mutation_performed){
            throw 'Binding evidence synthetic contract failed'
          }

      - name: Synthetic second-PC LAN probe validation (no network traffic)
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'lan-proof'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase10_LAN_Proof_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'Phase 12.10 LAN proof synthetic failed'}
          $reports=@(Get-ChildItem -LiteralPath $out -Filter '*.json' -File)
          if($reports.Count -ne 1){throw 'LAN proof did not emit one report'}
          $r=Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_PASS' -or -not $r.read_only -or -not $r.synthetic -or $r.mutation_performed){
            throw 'LAN proof synthetic contract failed'
          }

      - name: Synthetic component fingerprint and security-scope inspection
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'phase2-5-integrity'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase2_5_Integrity_Security_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw "Phase 2+5 synthetic failed"}
          $reports=@(Get-ChildItem -LiteralPath $out -Filter '*.json' -File)
          if($reports.Count -ne 1){throw "Phase 2+5 expected exactly one synthetic report"}
          $r=Get-Content -LiteralPath $reports[0].FullName -Raw -Encoding UTF8|ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_PASS' -or -not $r.read_only -or -not $r.synthetic -or $r.mutation_performed){
            throw "Phase 2+5 synthetic report contract failed"
          }

      - name: Day12 12.10 CI-only temporary firewall guardrails synthetic
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'day12-ci-firewall-guardrail-fixture'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase10_Disposable_Firewall_Loopback_CI.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'Disposable firewall guardrail synthetic failed'}
          $files=@(Get-ChildItem -LiteralPath $out -Filter '*.json' -File)
          if($files.Count -ne 1){throw 'Disposable guardrail fixture output missing'}
          $r=Get-Content -LiteralPath $files[0].FullName -Raw -Encoding UTF8|ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_PASS' -or !$r.synthetic -or
             $r.firewall_mutation_performed -or $r.private_ports_modified -or
             $r.canonical_backend_ports_private -ne 'UNCHANGED_FAIL'){
            throw 'CI-only firewall guardrail fixture contract mismatch'
          }

      - name: Day12 12.10 running Java executable / firewall application matching (synthetic)
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'day12-java-rule-match'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase10_Java_Program_Rule_Match_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'Java executable rule matching synthetic failed'}
          $files=@(Get-ChildItem -LiteralPath $out -File -Filter '*.json')
          if($files.Count -ne 1){throw 'Java rule matching expected one JSON'}
          $r=Get-Content -LiteralPath $files[0].FullName -Raw -Encoding UTF8|ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_PASS' -or -not $r.synthetic -or -not $r.read_only -or
             $r.mutation_performed -or $r.secrets_exported -or
             $r.canonical_backend_ports_private -ne 'UNCHANGED_FAIL' -or
             $r.categories.ALL_PROGRAMS -ne 1 -or
             $r.categories.MATCHES_RUNNING_JAVA_EXE -ne 2 -or
             $r.categories.PROGRAM_UNRESOLVED -ne 1){
            throw 'Java firewall correlation fail-closed contract failed'
          }
          $raw=Get-Content -LiteralPath $files[0].FullName -Raw -Encoding UTF8
          if($raw -match 'C:\\Java\\bin|C:\\Other\\daemon'){throw 'Path leaked into summary report'}

      - name: Day12 12.10 ActiveStore eight-private-port firewall candidate classifier (synthetic)
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'day12-firewall-target-classifier'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase10_Firewall_Target_Rules_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'Target-port firewall synthetic classifier failed'}
          $files=@(Get-ChildItem -LiteralPath $out -Filter '*.json' -File)
          if($files.Count -ne 1){throw 'Target-port firewall classifier expected one JSON'}
          $r=Get-Content -LiteralPath $files[0].FullName -Raw -Encoding UTF8|ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_PASS' -or -not $r.synthetic -or -not $r.read_only -or
             $r.firewall_mutation_performed -or $r.secrets_exported -or
             $r.canonical_backend_ports_private -ne 'UNCHANGED_FAIL' -or
             @($r.simulation).Count -ne 4){throw 'Target-port classifier contract failed'}
          $a=@($r.simulation|Where-Object{$_.port -eq 25570})
          if($a.Count -ne 1 -or $a[0].block_rule_candidates -ne 1 -or
             $a[0].allowed_rule_candidates -ne 4 -or $a[0].ambiguous_rule_candidates -ne 2){
            throw 'Candidate overlap, wildcard and bypass synthetic expectations failed'
          }

      - name: Synthetic ActiveStore firewall scope classification
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'fw-scope'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase5_Firewall_Scope_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'Phase 12.5 firewall scope synthetic failed'}
          $files=@(Get-ChildItem -LiteralPath $out -Filter '*.json' -File)
          if($files.Count -ne 1){throw 'Firewall scope synthetic report count mismatch'}
          $r=Get-Content -LiteralPath $files[0].FullName -Raw -Encoding UTF8|ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_PASS' -or -not $r.read_only -or -not $r.synthetic -or $r.mutation_performed){
            throw 'Firewall scope report contract failed'
          }

      - name: Synthetic firewall rule and ACL report classifier
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'fw-rule-acl-review'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase5_Rule_ACL_Review_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'Rule ACL synthetic failed'}
          $reports=@(Get-ChildItem -LiteralPath $out -Filter '*.json' -File)
          if($reports.Count -ne 1){throw 'Rule ACL expected exactly one synthetic result'}
          $r=Get-Content -LiteralPath $reports[0].FullName -Raw -Encoding UTF8|ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_PASS' -or -not $r.read_only -or -not $r.synthetic -or $r.mutation_performed){throw 'Rule ACL synthetic contract fail'}

      - name: ACL-only mode skips firewall and fails closed without GSC files
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'acl-only-negative'
          # The negative fixture returns exit 2 by design; capture its
          # process exit code without the CI shell aborting before report checks.
          $process=Start-Process -FilePath powershell.exe -ArgumentList @(
            '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass',
            '-File','tools/day12/Day12_Phase5_Rule_ACL_Review_READ_ONLY.ps1',
            '-AclOnly','-OutputDir',$out
          ) -Wait -PassThru -NoNewWindow
          $ec=$process.ExitCode
          $reports=@(Get-ChildItem -LiteralPath $out -Filter 'Day12-Rule-ACL-Review-*.json' -File)
          if($reports.Count -ne 1){throw "ACL-only expected single report"}
          $r=Get-Content -LiteralPath $reports[0].FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          if($r.phase -ne '12.5-acl-only' -or $r.firewall_enumeration -ne 'NOT_EXECUTED_ACL_ONLY' -or
             -not $r.read_only -or $r.synthetic -or $r.mutation_performed -or
             -not $r.acl_target_label_consistency -or $r.protected_file_acl_summaries.Count -ne 5){
            throw "ACL-only output contract failed"
          }
          if($r.result -eq 'CAPTURED_FOR_REVIEW' -and $ec -ne 0){throw 'ACL-only exit/report disagree'}
          if($r.result -eq 'CHECK_REQUIRED' -and $ec -ne 2){throw 'ACL-only fail-closed exit/report disagree'}
          if($r.result -notin @('CAPTURED_FOR_REVIEW','CHECK_REQUIRED')){throw 'Unexpected ACL-only state'}

      - name: Golden report discovery and manual-path regression
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'golden-discovery'
          $nested=Join-Path $root 'Downloads\Geumyi-Reports'
          New-Item -ItemType Directory -Force -Path $nested | Out-Null
          $steps=@()
          foreach($id in @('wild','playground','other','lobby')){
            $steps+=@{server_id=$id;step='create_verify_protect';pass=$true;retention_exempt=$true;file=($id+'-full-backup-20261009-025156.zip');sha256=('a'*64)}
          }
          $pass=Join-Path $nested 'Geumyi-Day12-Phase0B-GoldenCheckpoint-20261009-025156.json'
          @{phase='12.0B';result='PASS';steps=$steps}|ConvertTo-Json -Depth 8|Set-Content -LiteralPath $pass -Encoding UTF8
          $invalid=Join-Path $nested 'Geumyi-Day12-Phase0B-GoldenCheckpoint-20261009-031200.json'
          @{phase='12.0B';result='PARTIAL_REVIEW_REQUIRED';steps=$steps}|ConvertTo-Json -Depth 8|Set-Content -LiteralPath $invalid -Encoding UTF8
          $launcher='tools/day12/Day12_Phase7_KnownGood_Build.ps1'
          $autoOut=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $launcher -SearchRoots $root -ResolveOnly
          if($LASTEXITCODE -ne 0 -or @($autoOut|Where-Object{$_ -eq ('RESOLVED_REPORT='+$pass)}).Count -ne 1){
            throw ('Golden report auto-discovery regression: '+($autoOut -join '; '))
          }
          $manualOut=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $launcher -ReportPath $pass -ResolveOnly
          if($LASTEXITCODE -ne 0 -or @($manualOut|Where-Object{$_ -eq ('RESOLVED_REPORT='+$pass)}).Count -ne 1){
            throw ('Golden report explicit selection regression: '+($manualOut -join '; '))
          }
          $badProcess=Start-Process -FilePath 'powershell.exe' -ArgumentList @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$launcher,'-ReportPath',$invalid,'-ResolveOnly') -NoNewWindow -PassThru -Wait -RedirectStandardError (Join-Path $root 'rejected-report.txt')
          if($badProcess.ExitCode -eq 0){throw 'An invalid Golden report was accepted'}
          $global:LASTEXITCODE=0

      - name: WFP 5154/5158 historical audit parser synthetic (no Security log access)
        shell: powershell
        run: |
          $dest=Join-Path $env:RUNNER_TEMP 'day12-wfp-synthetic'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase10_WFP_Audit_Attestation_READ_ONLY.ps1 -Synthetic -OutputDir $dest
          if($LASTEXITCODE -ne 0){throw 'WFP fixture command failed'}
          $files=@(Get-ChildItem -LiteralPath $dest -Filter '*.json' -File)
          if($files.Count -ne 1){throw 'WFP fixture must emit exactly one report'}
          $t=Get-Content -LiteralPath $files[0].FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          $a=@($t.summary | Where-Object {$_.port -eq 25570})
          $b=@($t.summary | Where-Object {$_.port -eq 25571})
          $c=@($t.summary | Where-Object {$_.port -eq 25572})
          if($t.result -ne 'SYNTHETIC_PASS' -or -not $t.synthetic -or -not $t.read_only -or
             $t.mutation_performed -or $t.secrets_exported -or
             $t.canonical_backend_ports_private -ne 'UNCHANGED_FAIL' -or
             $a.Count -ne 1 -or $a[0].finding -ne 'HISTORICAL_LOOPBACK_LISTEN_AND_BIND' -or
             $b.Count -ne 1 -or $b[0].finding -ne 'REVIEW_NON_LOOPBACK_OR_UNPARSEABLE' -or
             $c.Count -ne 1 -or $c[0].finding -ne 'NO_CURRENT_PROCESS_EVENT'){
            throw 'WFP historical/audit fail-closed contract failed'
          }
          if((Get-Content -LiteralPath $files[0].FullName -Raw) -match 'C:\\Program Files\\Java|192\.0\.2\.1'){
            throw 'WFP source path/address was leaked into report'
          }

      - name: Validate WFP Event Log XPath shape against real Windows Event Log engine
        shell: powershell
        run: |
          # Parse the same restricted WFP XPath against Application instead of
          # the protected Security log, so event absence is permitted while
          # invalid event-query syntax is an unconditional CI failure.
          $ports=@(25570,25571,25572,25573,25575,25576,25577,25579)
          $filters=@(foreach($port in $ports){"Data[@Name='SourcePort']='$port'"})
          $windowMs=7*24*3600*1000
          $query="*[System[(EventID=5154 or EventID=5158) and TimeCreated[timediff(@SystemTime) <= $windowMs]] and EventData[$($filters -join ' or ')]]"
          try {
            [void]@(Get-WinEvent -LogName Application -FilterXPath $query -MaxEvents 1 -ErrorAction Stop)
            Write-Host "WFP XPath parsed; matching Application event seen (unusual)"
          } catch {
            if([string]$_.FullyQualifiedErrorId -notmatch "NoMatchingEventsFound"){
              throw ("WFP XPath rejected by Windows query engine: "+[string]$_.FullyQualifiedErrorId)
            }
            Write-Host "WFP XPath accepted; no Application event matched as expected"
          }

