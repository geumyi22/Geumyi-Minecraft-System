name: Day 12 Final Verifier Safety CI

on:
  push:
    paths:
      - 'tools/day12/**'
      - 'DAY12-PLAN.md'
      - '.github/workflows/day12-safety-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/day12/**'
      - 'DAY12-PLAN.md'
      - '.github/workflows/day12-safety-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-safety:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell
        shell: powershell
        run: |
          $p='tools/day12/Day12_Final_Verification_READ_ONLY.ps1'
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){$errors | Format-List | Out-String | Write-Host; throw 'PowerShell parse failed'}
      - name: Mutation guard
        shell: powershell
        run: |
          $p='tools/day12/Day12_Final_Verification_READ_ONLY.ps1'
          $text=Get-Content -LiteralPath $p -Raw
          $forbidden=@(
            'Stop-Process','Stop-Service','Restart-Service','Start-Service',
            'Remove-Item','Move-Item','Rename-Item','Copy-Item',
            'Set-NetFirewallRule','New-NetFirewallRule','Remove-NetFirewallRule',
            'Register-ScheduledTask','Unregister-ScheduledTask',
            'Restart-Computer','Stop-Computer'
          )
          foreach($f in $forbidden){if($text -match [regex]::Escape($f)){throw "Read-only verifier contains forbidden mutation: $f"}}
      - name: Synthetic verifier run
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'day12-verifier'
          & tools/day12/Day12_Final_Verification_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw "Synthetic verifier failed: $LASTEXITCODE"}
          $report=Get-ChildItem -LiteralPath $out -Filter '*.json' | Select-Object -First 1
          if($null -eq $report){throw 'Synthetic report missing'}
          $j=Get-Content -LiteralPath $report.FullName -Raw | ConvertFrom-Json
          if(-not [bool]$j.read_only -or -not [bool]$j.synthetic -or [int]$j.summary.fail -ne 0){throw 'Synthetic report contract failed'}
