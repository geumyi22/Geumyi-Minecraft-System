name: Day 12 Read-Only Safety CI

on:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - 'tools/day12/**'
      - 'deploy/day12-*.json'
      - 'FINAL-*.json'
      - 'FINAL-*.md'
      - 'DAY12-PLAN.md'
      - '.github/workflows/day12-safety-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/day12/**'
      - 'deploy/day12-*.json'
      - 'FINAL-*.json'
      - 'FINAL-*.md'
      - 'DAY12-PLAN.md'
      - '.github/workflows/day12-safety-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  day12-safety:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Parse all Day 12 PowerShell
        shell: powershell
        run: |
          $files=Get-ChildItem 'tools/day12' -Filter '*.ps1' -File -Recurse
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){
              Write-Host "Parse failure: $($file.FullName)"
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell parse failed"
            }
          }
          Write-Host "Parsed $($files.Count) Day 12 PowerShell scripts."

      - name: Read-only mutation guard
        shell: powershell
        run: |
          $files=Get-ChildItem 'tools/day12' -Filter '*READ_ONLY.ps1' -File -Recurse
          $forbidden=@(
            'Stop-Process','Stop-Service','Restart-Service','Start-Service',
            'Remove-Item','Move-Item','Rename-Item','Copy-Item',
            'Set-NetFirewallRule','New-NetFirewallRule','Remove-NetFirewallRule',
            'Register-ScheduledTask','Unregister-ScheduledTask',
            'Restart-Computer','Stop-Computer'
          )
          foreach($file in $files){
            $text=Get-Content -LiteralPath $file.FullName -Raw
            foreach($x in $forbidden){
              if($text -match [regex]::Escape($x)){throw "$($file.Name) contains forbidden mutation: $x"}
            }
            if($text -match '(?i)-Method\s+(POST|PUT|PATCH|DELETE)'){
              throw "$($file.Name) contains a mutating HTTP method"
            }
          }

      - name: Validate Day 12 JSON contracts
        shell: powershell
        run: |
          foreach($p in @(
            'FINAL-BASELINE.json',
            'FINAL-NETWORK-TOPOLOGY.json',
            'FINAL-RELEASE-GATES.json',
            'FINAL-SECURITY-REPORT.json',
            'FINAL-HEALTH-REPORT.json',
            'deploy/day12-managed-content.json',
            'deploy/day12-lifecycle-policy.json'
          )){
            $j=Get-Content -LiteralPath $p -Raw | ConvertFrom-Json
            if([int]$j.schema -lt 1){throw "Unexpected schema: $p"}
          }

      - name: Synthetic Phase 0A and 0B
        shell: powershell
        run: |
          $a=Join-Path $env:RUNNER_TEMP 'p0a'
          & tools/day12/Day12_Phase0_Golden_Baseline_READ_ONLY.ps1 -Synthetic -OutputDir $a
          if($LASTEXITCODE -ne 0){throw "Phase0A synthetic failed"}
          $b=Join-Path $env:RUNNER_TEMP 'p0b'
          & tools/day12/Day12_Phase0B_Golden_Checkpoint.ps1 -Synthetic -OutputDir $b
          if($LASTEXITCODE -ne 0){throw "Phase0B synthetic failed"}

      - name: Synthetic Phase 1
        shell: powershell
        run: |
          $a=Join-Path $env:RUNNER_TEMP 'p1pre'
          & tools/day12/Day12_Phase1_Content_Preflight_READ_ONLY.ps1 -Synthetic -OutputDir $a
          if($LASTEXITCODE -ne 0){throw "Phase1 preflight synthetic failed"}
          $b=Join-Path $env:RUNNER_TEMP 'p1apply'
          & tools/day12/Day12_Phase1_Managed_Content_Apply.ps1 -Synthetic -ManifestPath deploy/day12-managed-content.json -OutputDir $b
          if($LASTEXITCODE -ne 0){throw "Phase1 apply synthetic failed"}

      - name: Synthetic Phase 2 through 5
        shell: powershell
        run: |
          & tools/day12/Day12_Phase2_Component_Inventory_READ_ONLY.ps1 -Synthetic -OutputDir (Join-Path $env:RUNNER_TEMP 'p2')
          if($LASTEXITCODE -ne 0){throw "Phase2 synthetic failed"}
          & tools/day12/Day12_Phase3_Health_READ_ONLY.ps1 -Synthetic -OutputDir (Join-Path $env:RUNNER_TEMP 'p3')
          if($LASTEXITCODE -ne 0){throw "Phase3 synthetic failed"}
          & tools/day12/Day12_Phase4_Storage_Log_DRY_RUN.ps1 -Synthetic -OutputDir (Join-Path $env:RUNNER_TEMP 'p4')
          if($LASTEXITCODE -ne 0){throw "Phase4 dry-run synthetic failed"}
          & tools/day12/Day12_Phase4_Lifecycle_Apply.ps1 -Synthetic -PolicyPath deploy/day12-lifecycle-policy.json -OutputDir (Join-Path $env:RUNNER_TEMP 'p4apply')
          if($LASTEXITCODE -ne 0){throw "Phase4 apply synthetic failed"}
          & tools/day12/Day12_Phase5_Security_Audit_READ_ONLY.ps1 -Synthetic -OutputDir (Join-Path $env:RUNNER_TEMP 'p5')
          if($LASTEXITCODE -ne 0){throw "Phase5 synthetic failed"}

      - name: Synthetic Phase 7 and 8
        shell: powershell
        run: |
          & tools/day12/Day12_Phase7_KnownGood_Cache.ps1 -Synthetic -OutputDir (Join-Path $env:RUNNER_TEMP 'p7')
          if($LASTEXITCODE -ne 0){throw "Phase7 synthetic failed"}
          & tools/day12/Day12_Phase8_DR_SYNTHETIC.ps1 -OutputDir (Join-Path $env:RUNNER_TEMP 'p8')
          if($LASTEXITCODE -ne 0){throw "Phase8 synthetic failed"}

      - name: Known-good cache real Build/verify in temporary Windows fixture
        shell: powershell
        run: |
          $base=Join-Path $env:RUNNER_TEMP 'day12-cache-integration'
          $previousPD=$env:PROGRAMDATA
          $previousPF=$env:ProgramFiles
          try {
            $env:PROGRAMDATA=Join-Path $base 'ProgramData'
            $env:ProgramFiles=Join-Path $base 'ProgramFiles'
            $env:DAY12_TEST_PROGRAMFILES=$env:ProgramFiles
            $root=Join-Path $env:PROGRAMDATA 'GeumyiServerCenter'
            $install=Join-Path $env:ProgramFiles 'Geumyi Server Center'
            New-Item -ItemType Directory -Force -Path $root,$install | Out-Null
            Set-Content (Join-Path $install 'GeumyiServerHost.exe') 'fixture-host'
            Set-Content (Join-Path $install 'GeumyiServerCenter.exe') 'fixture-client'
            $servers=@()
            $confirmed=@()
            foreach($id in @('wild','playground','other','lobby')){
              $dir=Join-Path $base ('server-'+$id)
              $pl=Join-Path $dir 'plugins'
              New-Item -ItemType Directory -Force -Path $pl | Out-Null
              Set-Content (Join-Path $pl 'fixture-plugin.jar') ("fixture-"+$id)
              $servers+=@{id=$id;path=$dir}
              $confirmed+=@{server_id=$id;step='create_verify_protect';pass=$true;retention_exempt=$true;file=($id+'-full-backup-test.zip');sha256=('a'*64)}
            }
            @{servers=$servers} | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $root 'server.json') -Encoding UTF8
            foreach($id in @('wild','playground','other')){
              $pl=Join-Path $root ('Network\FourServer\'+$id+'\plugins')
              New-Item -ItemType Directory -Force -Path $pl | Out-Null
              Set-Content (Join-Path $pl 'fixture-proxy.jar') ("proxy-"+$id)
            }
            $report=Join-Path $base 'Phase0B-PASS-fixture.json'
            @{phase='12.0B';result='PASS';steps=$confirmed}|ConvertTo-Json -Depth 8|Set-Content $report -Encoding UTF8
            $output=Join-Path $base 'output'
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase7_KnownGood_Cache.ps1 -Mode Build -Confirm BUILD_DAY12_KNOWN_GOOD_CACHE -Phase0BReport $report -OutputDir $output
            if($LASTEXITCODE -ne 0){throw "Known-good cache Build failed"}
            $cacheRoot=Join-Path $root 'ArtifactCache\known-good\day12'
            $manifest=Join-Path $cacheRoot 'known-good-manifest.json'
            $m=Get-Content $manifest -Raw|ConvertFrom-Json
            if($m.result -ne 'PASS' -or @($m.files).Count -ne 9){throw ("Cache Build manifest contract failed; count="+@($m.files).Count+"; names="+((@($m.files)|ForEach-Object{$_.logical}) -join ","))}
            if(@($m.files|Where-Object{-not $_.cache_name -or -not $_.sha256}).Count -ne 0){throw "Cache manifest missing cache_name or hash"}
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/recovery-kit/Verify-KnownGood.ps1 -ManifestPath $manifest -Root $cacheRoot
            if($LASTEXITCODE -ne 0){throw "Recovery Kit could not verify built cache"}
            $target=Join-Path $cacheRoot ([string]$m.files[0].cache_name)
            Set-Content -LiteralPath $target -Value 'tampered'
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/recovery-kit/Verify-KnownGood.ps1 -ManifestPath $manifest -Root $cacheRoot
            if($LASTEXITCODE -eq 0){throw "Corrupt cache passed integrity verification"}
          }finally{
            $env:PROGRAMDATA=$previousPD
            $env:ProgramFiles=$previousPF
            Remove-Item Env:DAY12_TEST_PROGRAMFILES -ErrorAction SilentlyContinue
          }
          $global:LASTEXITCODE=0

      - name: Synthetic native TCP table diagnostics (no production changes)
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'tcp-native-diagnostic'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_TCP_Bind_Diagnostic_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'TCP native diagnostic synthetic run failed'}
          $reports=@(Get-ChildItem -LiteralPath $out -Filter '*.json' -File)
          if($reports.Count -ne 1){throw 'TCP diagnostic did not write exactly one report'}
          $r=Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_CAPTURED' -or -not $r.read_only -or $r.mutation_performed -or -not $r.providers.native){throw 'TCP native diagnostic contract failed'}
          if([string]$r.providers.native.status -ne 'OK'){throw ('Native Windows TCP table call failed: '+[string]$r.providers.native.error)}

      - name: Synthetic 12.10 configuration and bind evidence (fail-closed)
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'bind-evidence'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase10_Bind_Evidence_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'Binding evidence regression failed'}
          $reports=@(Get-ChildItem -LiteralPath $out -Filter '*.json' -File)
          if($reports.Count -ne 1){throw 'Expected exactly one binding evidence report'}
          $r=Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_PASS' -or -not $r.read_only -or -not $r.synthetic -or $r.mutation_performed){
            throw 'Binding evidence synthetic contract failed'
          }

      - name: Synthetic second-PC LAN probe validation (no network traffic)
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'lan-proof'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase10_LAN_Proof_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'Phase 12.10 LAN proof synthetic failed'}
          $reports=@(Get-ChildItem -LiteralPath $out -Filter '*.json' -File)
          if($reports.Count -ne 1){throw 'LAN proof did not emit one report'}
          $r=Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_PASS' -or -not $r.read_only -or -not $r.synthetic -or $r.mutation_performed){
            throw 'LAN proof synthetic contract failed'
          }

      - name: Synthetic component fingerprint and security-scope inspection
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'phase2-5-integrity'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Phase2_5_Integrity_Security_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw "Phase 2+5 synthetic failed"}
          $reports=@(Get-ChildItem -LiteralPath $out -Filter '*.json' -File)
          if($reports.Count -ne 1){throw "Phase 2+5 expected exactly one synthetic report"}
          $r=Get-Content -LiteralPath $reports[0].FullName -Raw -Encoding UTF8|ConvertFrom-Json
          if($r.result -ne 'SYNTHETIC_PASS' -or -not $r.read_only -or -not $r.synthetic -or $r.mutation_performed){
            throw "Phase 2+5 synthetic report contract failed"
          }

      - name: Golden report discovery and manual-path regression
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'golden-discovery'
          $nested=Join-Path $root 'Downloads\Geumyi-Reports'
          New-Item -ItemType Directory -Force -Path $nested | Out-Null
          $steps=@()
          foreach($id in @('wild','playground','other','lobby')){
            $steps+=@{server_id=$id;step='create_verify_protect';pass=$true;retention_exempt=$true;file=($id+'-full-backup-20261009-025156.zip');sha256=('a'*64)}
          }
          $pass=Join-Path $nested 'Geumyi-Day12-Phase0B-GoldenCheckpoint-20261009-025156.json'
          @{phase='12.0B';result='PASS';steps=$steps}|ConvertTo-Json -Depth 8|Set-Content -LiteralPath $pass -Encoding UTF8
          $invalid=Join-Path $nested 'Geumyi-Day12-Phase0B-GoldenCheckpoint-20261009-031200.json'
          @{phase='12.0B';result='PARTIAL_REVIEW_REQUIRED';steps=$steps}|ConvertTo-Json -Depth 8|Set-Content -LiteralPath $invalid -Encoding UTF8
          $launcher='tools/day12/Day12_Phase7_KnownGood_Build.ps1'
          $autoOut=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $launcher -SearchRoots $root -ResolveOnly
          if($LASTEXITCODE -ne 0 -or @($autoOut|Where-Object{$_ -eq ('RESOLVED_REPORT='+$pass)}).Count -ne 1){
            throw ('Golden report auto-discovery regression: '+($autoOut -join '; '))
          }
          $manualOut=& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $launcher -ReportPath $pass -ResolveOnly
          if($LASTEXITCODE -ne 0 -or @($manualOut|Where-Object{$_ -eq ('RESOLVED_REPORT='+$pass)}).Count -ne 1){
            throw ('Golden report explicit selection regression: '+($manualOut -join '; '))
          }
          $badProcess=Start-Process -FilePath 'powershell.exe' -ArgumentList @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$launcher,'-ReportPath',$invalid,'-ResolveOnly') -NoNewWindow -PassThru -Wait -RedirectStandardError (Join-Path $root 'rejected-report.txt')
          if($badProcess.ExitCode -eq 0){throw 'An invalid Golden report was accepted'}
          $global:LASTEXITCODE=0

      - name: Synthetic final verifier
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'final'
          & tools/day12/Day12_Final_Verification_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw "Final verifier synthetic failed"}
          $j=Get-Content (Join-Path $out 'FINAL-HEALTH-REPORT.json') -Raw | ConvertFrom-Json
          if(-not [bool]$j.read_only -or -not [bool]$j.synthetic -or $j.result -ne 'SYNTHETIC_PASS'){
            throw 'Final verifier synthetic report contract failed'
          }

      - name: Synthetic collector and missing-tool fail-closed regression
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'collector-synthetic'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/day12/Day12_Collect_All_READ_ONLY.ps1 -Synthetic -OutputDir $out
          if($LASTEXITCODE -ne 0){throw "Synthetic collector failed"}
          $r=Get-Content (Join-Path $out 'Day12-READONLY-SUMMARY.json') -Raw | ConvertFrom-Json
          if($r.result -ne 'CAPTURED' -or @($r.steps).Count -ne 8 -or @($r.steps|Where-Object{$_.status -ne 'CAPTURED'}).Count -gt 0){
            throw "Collector synthetic report contract failed"
          }
          # Regression: copying the launcher without child scripts must not report success.
          $missing=Join-Path $env:RUNNER_TEMP 'collector-missing-tools'
          New-Item -ItemType Directory -Force -Path $missing|Out-Null
          Copy-Item tools/day12/Day12_Collect_All_READ_ONLY.ps1 (Join-Path $missing 'Day12_Collect_All_READ_ONLY.ps1')
          $failedOut=Join-Path $env:RUNNER_TEMP 'collector-missing-report'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $missing 'Day12_Collect_All_READ_ONLY.ps1') -Synthetic -OutputDir $failedOut
          if($LASTEXITCODE -ne 2){throw "Missing scripts did not produce a nonzero collector exit"}
          $failed=Get-Content (Join-Path $failedOut 'Day12-READONLY-SUMMARY.json') -Raw|ConvertFrom-Json
          if($failed.result -ne 'CHECK_REQUIRED' -or @($failed.steps|Where-Object{$_.status -eq 'CAPTURED'}).Count -gt 0){
            throw "Missing scripts were falsely marked CAPTURED"
          }
          # The exit=2 above is expected; don't leak it into the workflow shell exit.
          $global:LASTEXITCODE=0

      - name: Sparse real-branch API contract regression (no production)
        shell: powershell
        run: |
          $fixtureRoot=Join-Path $env:RUNNER_TEMP 'day12-sparse-live-response-fixture'
          New-Item -ItemType Directory -Force -Path $fixtureRoot|Out-Null
          function Fixture([string]$route,[object]$data){
            $name=(($route -replace '[^A-Za-z0-9]+','_').Trim('_'))+'.json'
            $data|ConvertTo-Json -Depth 16|Set-Content -LiteralPath (Join-Path $fixtureRoot $name) -Encoding UTF8
          }
          $ids=@('wild','playground','other','lobby')
          Fixture '/api/status' @{app_version='4.3.8'}
          Fixture '/api/v1/info' @{ok=$true;api_version=1;gsc_version='4.3.8'}
          Fixture '/api/v1/snapshot' @{servers=@($ids|ForEach-Object{@{id=$_}});active_jobs=0}
          Fixture '/api/v4/health' @{servers=@($ids|ForEach-Object{@{id=$_;overall='warn'}})}
          Fixture '/api/v4/network/entry-status' @{endpoints=@(
            @{id='wild';java_tcp=25565;java_responding=$false;bedrock_udp=19132},
            @{id='playground';java_tcp=25566;bedrock_udp=19133},
            @{id='other';java_tcp=25567;bedrock_udp=19134}
          )}
          Fixture '/api/v4/update/fleet' @{global=@{enabled=$true;channel='beta'};servers=@($ids|ForEach-Object{
            @{server_id=$_;status=@{phase='idle'}}
          })}
          Fixture '/api/v4/update/self/status' @{release='day11'}
          Fixture '/api/v4/update/external/status' @{mode='read-only'}
          Fixture '/api/v1/mobile' @{security=@{auth_required=$true}}
          foreach($id in $ids){
            Fixture ('/api/v4/backups?id='+$id) @{backups=@(@{file='unprotected.zip';created_at='2026-10-08T00:00:00Z'})}
            Fixture ('/api/v4/backups/trash?id='+$id) @{backups=@()}
            Fixture ('/api/v4/backup/retention/dry-run_'+$id) @{candidates=@();reclaim_bytes=0}
            Fixture ('/api/v1/servers/'+$id+'/inventory') @{ok=$true}
          }
          $originalProgramData=$env:PROGRAMDATA
          try{
            $env:PROGRAMDATA=Join-Path $fixtureRoot 'ProgramData'
            $gscRoot=Join-Path $env:PROGRAMDATA 'GeumyiServerCenter'
            New-Item -ItemType Directory -Force -Path $gscRoot|Out-Null
            $configRows=@()
            foreach($id in $ids){
              $serverDir=Join-Path $fixtureRoot ('servers\'+$id)
              New-Item -ItemType Directory -Force -Path $serverDir|Out-Null
              Set-Content -LiteralPath (Join-Path $serverDir 'server.properties') -Value 'level-name=world'
              $configRows+=@{id=$id;name=$id;path=$serverDir;java_port=25570;rcon_port=25575;auto_start=$false}
            }
            @{servers=$configRows}|ConvertTo-Json -Depth 10|Set-Content -LiteralPath (Join-Path $gscRoot 'server.json') -Encoding UTF8
            $cases=@(
              @{name='12.0A';script='Day12_Phase0_Golden_Baseline_READ_ONLY.ps1';extra=@();expected=@(2)},
              @{name='12.1';script='Day12_Phase1_Content_Preflight_READ_ONLY.ps1';extra=@('-ManifestPath','deploy/day12-managed-content.json');expected=@(0)},
              @{name='12.3';script='Day12_Phase3_Health_READ_ONLY.ps1';extra=@();expected=@(0,2)},
              @{name='12.4';script='Day12_Phase4_Storage_Log_DRY_RUN.ps1';extra=@('-PolicyPath','deploy/day12-lifecycle-policy.json');expected=@(0)},
              @{name='12.10';script='Day12_Final_Verification_READ_ONLY.ps1';extra=@();expected=@(0,2)}
            )
            foreach($c in $cases){
              $output=Join-Path $fixtureRoot ('report-'+$c.name)
              & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path 'tools/day12' $c.script) -FixtureRoot $fixtureRoot -OutputDir $output @($c.extra)
              $code=[int]$LASTEXITCODE
              if($c.expected -notcontains $code){throw "$($c.name): script exit=$code; expected=$($c.expected -join ',')"}
              $reports=@(Get-ChildItem -LiteralPath $output -Filter '*.json' -File -ErrorAction SilentlyContinue)
              if($reports.Count -eq 0){throw "$($c.name): real-branch fixture produced no report"}
              $report=Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
              if(-not $report.fixture_mode){throw "$($c.name): fixture evidence not marked as non-live"}
              Write-Host "$($c.name) sparse API fixture branch: completed with exit $code"
            }
          }finally{
            $env:PROGRAMDATA=$originalProgramData
          }
          $global:LASTEXITCODE=0

      - name: Final release gate is fail-closed while live gates are pending
        shell: powershell
        run: |
          python tools/day12/validate_final_release_gates.py FINAL-RELEASE-GATES.json
          $gateExit=$LASTEXITCODE
          if($gateExit -eq 0){throw 'Final release gate unexpectedly opened while PENDING gates exist'}
          Write-Host "Fail-closed release gate verified. Validator exit=$gateExit"
          $global:LASTEXITCODE=0
          exit 0
