name: Day12 Bedrock Proxy Pack Inventory READ ONLY CI
on:
  push:
    branches: [main]
    paths:
      - 'tools/day12/Day12_Bedrock_Proxy_Packs_Inventory_READ_ONLY.ps1'
      - 'tools/day12/Day12_Bedrock_Proxy_Packs_Inventory_READ_ONLY.cmd'
      - '.github/workflows/day12-bedrock-proxy-pack-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-inventory-contract:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - name: Parse and exercise read-only inventory on disposable empty root
        shell: pwsh
        run: |
          $p='tools/day12/Day12_Bedrock_Proxy_Packs_Inventory_READ_ONLY.ps1'
          $t=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$t,[ref]$errors)
          if(@($errors).Count -gt 0){throw 'Read-only inventory parser error'}
          $root=Join-Path $env:RUNNER_TEMP 'not-a-real-server'
          $out=Join-Path $env:RUNNER_TEMP 'safe-report'
          & $p -ProxyRoot $root -OutputDir $out
          if($LASTEXITCODE -ne 0){throw 'Inventory read failed'}
          $f=Get-ChildItem -LiteralPath $out -Filter 'Day12-Bedrock-Pack-Inventory-*.json' | Select-Object -First 1
          if($null -eq $f){throw 'Missing output'}
          $j=Get-Content -LiteralPath $f.FullName -Raw|ConvertFrom-Json
          if($j.result -ne 'PACK_LAYOUT_REVIEW_REQUIRED' -or $j.production_mutation -or
             $j.stable_release_allowed -or $j.bedrock_login_and_server_switch_e2e_verified -or
             @($j.instances).Count -ne 3){throw 'Empty-runner falsely claimed production packs'}
          Write-Host 'Disposable read-only empty-root negative case PASS'
